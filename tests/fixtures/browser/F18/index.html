<!doctype html><html lang="ko"><meta charset="utf-8"><title>F18</title><link rel="stylesheet" href="/assets/style.css"><body><h1>F18</h1><input id="slider" aria-label="값" type="range" min="0" max="100"><ol><li id="a" draggable="true">A</li><li id="b" draggable="true">B</li></ol><script src="/assets/runtime.js"></script><script>document.querySelector("#slider").oninput=e=>record("slider","state",e.target.value);document.querySelector("#a").ondragstart=e=>e.dataTransfer.setData("text/plain","a");document.querySelector("#b").ondragover=e=>e.preventDefault();document.querySelector("#b").ondrop=e=>{e.preventDefault();if(e.dataTransfer.getData("text/plain")==="a"){e.target.after(document.querySelector("#a"));record("order","state","B,A");}};</script></body></html>
