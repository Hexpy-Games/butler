<!doctype html><html lang="ko"><meta charset="utf-8"><title>F05</title><link rel="stylesheet" href="/assets/style.css"><body><h1>F05</h1><button id="task" >완료</button><div id="cookie" class="wall">쿠키 설정<button id="reject" >거부</button><button id="close" >×</button><button id="accept" >동의</button></div><script src="/assets/runtime.js"></script><script>setTimeout(()=>{document.body.insertAdjacentHTML("beforeend",`<div id="newsletter" class="wall">뉴스레터<button id="dismiss">×</button></div>`);},3000); document.addEventListener("click",e=>{if(["reject","close"].includes(e.target.id))document.querySelector("#cookie")?.remove();if(e.target.id==="dismiss")document.querySelector("#newsletter").remove();});</script></body></html>
