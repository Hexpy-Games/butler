<!doctype html><meta charset="utf-8"><title>Flow popup</title><style>body{font:18px system-ui;background:#fff;color:#172033;padding:28px}button{padding:12px 20px}</style>
<h1 id="flow"></h1><p>Opener preserved</p><button id="complete">Complete</button>
