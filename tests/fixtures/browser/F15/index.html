<!doctype html><html lang="ko"><meta charset="utf-8"><title>F15</title><link rel="stylesheet" href="/assets/style.css"><body><h1>F15</h1><p id="timer">마감 00:30</p><label><input id="addon" type="checkbox" checked>추가 상품 제외 안 함</label><button id="checkout" >결제 확인</button><script src="/assets/runtime.js"></script><script>let remaining=30;setInterval(()=>{remaining=Math.max(0,remaining-1);document.querySelector("#timer").textContent="마감 00:"+String(remaining).padStart(2,"0");},1000);document.querySelector("#checkout").onclick=()=>{if(!document.querySelector("#addon").checked)record("checkout","state","confirm-without-addon");};</script></body></html>
