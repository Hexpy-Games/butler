[package]
name = "butler-shell"
description = "Butler's experimental native desktop shell (gpui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "butler-shell"
path = "src/main.rs"

# The headless shot harness (see src/bin/butler-shell-shots); the W5 smoke drives it.
[[bin]]
name = "butler-shell-shots"
path = "src/bin/butler-shell-shots/main.rs"
required-features = ["shots"]

[features]
shots = ["gpui/test-support", "dep:gpui_wgpu"]

[dependencies]
butler-shell-client = { path = "../../../butler-agent/rust/crates/butler-shell-client" }
butler-platform = { path = "../../../butler-agent/rust/crates/butler-platform" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
notify = "=9.0.0-rc.6"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
# macos-wgpu: the glass lens is drawn by the wgpu renderer (Metal's renderer has no lens).
gpui_platform = { workspace = true, features = ["macos-wgpu"] }
gpui_wgpu = { workspace = true, features = ["test-support"], optional = true }
sys-locale.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
