[package]
name = "butler-shell"
description = "Butler's experimental native desktop shell (gpui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "butler-shell"
path = "src/main.rs"

# The headless shot harness (see src/bin/butler-shell-shots); the W5 smoke drives it.
[[bin]]
name = "butler-shell-shots"
path = "src/bin/butler-shell-shots/main.rs"
required-features = ["shots"]

[features]
# The shell's `cef` cargo feature builds on macOS (CVPixelBuffer frames), Windows (D3D11 shared
# textures, `SurfaceSource::WindowsSharedTexture`) and Linux (CPU frames uploaded to a wgpu texture,
# `SurfaceSource::Texture`).
cef = ["butler-cef/cef", "dep:pulldown-cmark"]
shots = ["gpui/test-support", "dep:gpui_wgpu"]

[dependencies]
butler-cef = { path = "../../../butler-agent/rust/crates/butler-platform/cef" }
butler-ds = { path = "../butler-ds" }
butler-shell-client = { path = "../../../butler-agent/rust/crates/butler-shell-client" }
butler-platform = { path = "../../../butler-agent/rust/crates/butler-platform" }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "process", "io-util"] }
notify = "=9.0.0-rc.6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4"

anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_elements.workspace = true
pulldown-cmark = { workspace = true, optional = true }
# macos-wgpu: the glass lens is drawn by the wgpu renderer (Metal's renderer has no lens).
gpui_platform = { workspace = true, features = ["macos-wgpu"] }
# wgpu-surfaces: on Windows the headless harness imports CEF's D3D11 shared textures.
gpui_wgpu = { workspace = true, features = ["test-support", "wgpu-surfaces"], optional = true }
sys-locale.workspace = true
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
# The package updater checks the staged artifact's SHA-256 (lifecycle/app_update).
sha2 = "=0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
# Linux frames are uploaded to a texture on gpui's device: the shell names wgpu's types through
# gpui_wgpu's re-export, the one wgpu gpui uses.
gpui_wgpu = { workspace = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
