[package]
name = "butler-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# E2E fault, clock and instrumentation hooks; never enabled in shipped binaries.
e2e-fixtures = ["butler-log/e2e-fixtures"]
test-support = []

[dependencies]
butler-vault = { path = "../butler-vault" }
butler-log = { path = "../butler-log" }
butler-canon = { path = "../butler-canon" }
butler-core = { path = "../butler-core" }
butler-platform = { path = "../butler-platform" }
butler-turn = { path = "../butler-turn" }
butler-models = { path = "../butler-models" }
butler-runtime = { path = "../butler-runtime" }
axum.workspace = true
base64.workspace = true
bytes.workspace = true
chacha20poly1305 = "=0.10.1"
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
reqwest.workspace = true
futures-core.workspace = true
futures-util.workspace = true
http-body-util.workspace = true
http.workspace = true
hyper = { version = "1.11.1", features = ["http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
image.workspace = true
indexmap.workspace = true
notify.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sha2.workspace = true
snow = { version = "=0.9.6", default-features = false, features = ["default-resolver"] }
subtle.workspace = true
zeroize.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { workspace = true, features = ["io"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tz-rs.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
url.workspace = true
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zip.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
# The file-store interruption cases arm the platform's fixture fault points.
butler-platform = { path = "../butler-platform", features = ["e2e-fixtures"] }
butler-models = { path = "../butler-models", features = ["test-support"] }
butler-test-support = { path = "../butler-test-support" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
