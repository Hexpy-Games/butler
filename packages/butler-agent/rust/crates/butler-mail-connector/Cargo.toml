[package]
name = "butler-mail-connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
butler-platform = { path = "../butler-platform" }
butler-log = { path = "../butler-log" }
async-imap = { version = "=0.11.3", default-features = false, features = ["runtime-tokio"] }
imap-proto = "0.16.4"
mail-parser = "=0.11.8"
mail-send = { version = "=0.6.2", default-features = false, features = ["ring", "tls12", "builder"] }
base64.workspace = true
futures-util.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"

