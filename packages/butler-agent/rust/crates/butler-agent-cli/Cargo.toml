[package]
name = "butler-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "butler-agent"
path = "src/main.rs"

[features]
default = ["prebuilt-ort"]
prebuilt-ort = ["butler_agent/prebuilt-ort"]
static-ort = ["butler_agent/static-ort"]

[dependencies]
butler_agent = { package = "butler-host", path = "../butler-agent", default-features = false }
butler-platform = { path = "../butler-platform" }

[build-dependencies]
semver.workspace = true
embed-manifest.workspace = true

[lints]
workspace = true
