[package]
name = "butler-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The only crate with operating-system specific code (see src/lib.rs). It is a
# leaf: it depends on no other workspace crate, so every crate can use it.
[dependencies]
# Quotes paths inside macOS sandbox profiles.
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libproc.workspace = true

[features]
# Fixture values for tests of other crates (e.g. archive entry modes).
test-support = []

[lints]
workspace = true
