[package]
name = "butler-vault"
description = "One encrypted file for every secret. The product's secrets once a data folder switched to it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# OS code stays behind butler-platform (credential stores, private files).
# `age` is built without its CLI, plugin, SSH and armor features.
[dependencies]
age.workspace = true
butler-platform = { path = "../butler-platform" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
zeroize.workspace = true

[lints]
workspace = true
