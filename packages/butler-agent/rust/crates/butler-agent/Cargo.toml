[package]
name = "butler-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["prebuilt-ort"]
prebuilt-ort = ["butler-gateway/prebuilt-ort", "butler-memory/prebuilt-ort"]
static-ort = ["butler-gateway/static-ort", "butler-memory/static-ort"]

[dependencies]
butler-gateway = { path = "../butler-gateway", default-features = false }
butler-memory = { path = "../butler-memory", default-features = false }
butler-ledger = { path = "../butler-ledger" }
butler-runtime = { path = "../butler-runtime" }
butler-models = { path = "../butler-models" }
butler-turn = { path = "../butler-turn" }
butler-core = { path = "../butler-core" }
butler-platform = { path = "../butler-platform" }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
reqwest.workspace = true
futures-util.workspace = true
indexmap.workspace = true
image.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
sha1.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tz-rs.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
rmcp.workspace = true

[build-dependencies]
semver.workspace = true
embed-manifest.workspace = true

[dev-dependencies]
tiktoken-rs.workspace = true
butler-ledger = { path = "../butler-ledger", features = ["test-support"] }
butler-runtime = { path = "../butler-runtime", features = ["test-support"] }
butler-models = { path = "../butler-models", features = ["test-support"] }
butler-turn = { path = "../butler-turn", features = ["test-support"] }
butler-test-support = { path = "../butler-test-support" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
