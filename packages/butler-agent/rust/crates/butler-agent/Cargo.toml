[package]
name = "butler-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Keep the library target/API name and test inventory stable.
[lib]
name = "butler_agent"

[features]
# E2E fixtures (source keychain service, fault, clock and barrier hooks); never
# enabled in shipped binaries.
e2e-fixtures = [
    "butler-log/e2e-fixtures",
    "butler-platform/test-support",
    "butler-gateway/e2e-fixtures",
    "butler-memory/e2e-fixtures",
    "butler-turn/e2e-fixtures",
    "dep:butler-test-support",
]
default = ["prebuilt-ort"]
prebuilt-ort = ["butler-gateway/prebuilt-ort", "butler-memory/prebuilt-ort"]
static-ort = ["butler-gateway/static-ort", "butler-memory/static-ort"]

[dependencies]
butler-canon = { path = "../butler-canon" }
butler-log = { path = "../butler-log" }
butler-test-support = { path = "../butler-test-support", optional = true }
butler-gateway = { path = "../butler-gateway", default-features = false }
butler-memory = { path = "../butler-memory", default-features = false }
butler-ledger = { path = "../butler-ledger" }
butler-runtime = { path = "../butler-runtime" }
butler-models = { path = "../butler-models" }
butler-turn = { path = "../butler-turn" }
butler-core = { path = "../butler-core" }
butler-platform = { path = "../butler-platform" }
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
uuid.workspace = true
regex.workspace = true
reqwest.workspace = true
futures-util.workspace = true
indexmap.workspace = true
image.workspace = true
parking_lot.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
sha1.workspace = true
tracing.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tz-rs.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
url.workspace = true
rmcp.workspace = true

[dev-dependencies]
arrow-array.workspace = true
arrow-schema.workspace = true
lancedb.workspace = true
butler-platform = { path = "../butler-platform", features = ["test-support"] }
butler-ledger = { path = "../butler-ledger", features = ["test-support"] }
butler-runtime = { path = "../butler-runtime", features = ["test-support"] }
butler-models = { path = "../butler-models", features = ["test-support"] }
butler-turn = { path = "../butler-turn", features = ["test-support"] }
butler-test-support = { path = "../butler-test-support" }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
