<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Busy</title>
<style>body { margin: 0; } canvas { display: block; width: 100vw; height: 100vh; } a { position: fixed; left: 20px; top: 20px; background: #fff; padding: 6px; }</style>
<canvas id="noise"></canvas><a href="#" id="link">Next</a>
<script>
// Dense pixel detail, like a busy map: its JPEG at default quality is far above 150 KB.
const canvas = document.querySelector('#noise');
canvas.width = innerWidth; canvas.height = innerHeight;
const context = canvas.getContext('2d');
let seed = 7;
const next = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff);
for (let y = 0; y < canvas.height; y += 6) for (let x = 0; x < canvas.width; x += 6) {
  context.fillStyle = `rgb(${next() & 255},${next() & 255},${next() & 255})`; context.fillRect(x, y, 6, 6);
}
</script></html>
