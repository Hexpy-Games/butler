[package]
name = "butler-e2e"
description = "Dev-only end-to-end harness: drives the real butler-agent binary through its public surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Product crates are linked by dev-only companion executables; scenarios drive
# these companions through their process boundary.
# butler-platform is not product code: it is the OS boundary every crate uses.
[dependencies]
ring.workspace = true
butler-canon = { path = "../butler-canon" }
butler-log = { path = "../butler-log", features = ["e2e-fixtures"] }
butler-gateway = { path = "../butler-gateway", features = ["test-support"] }
butler-runtime = { path = "../butler-runtime", features = ["test-support"] }
butler-mail-connector = { path = "../butler-mail-connector" }
butler-core = { path = "../butler-core" }
butler-models = { path = "../butler-models" }
butler-turn = { path = "../butler-turn", features = ["test-support"] }
tokio-util.workspace = true
url.workspace = true
butler-platform = { path = "../butler-platform", features = ["test-support"] }
axum.workspace = true
base64.workspace = true
bytes.workspace = true
h2.workspace = true
http.workspace = true
flate2.workspace = true
chrono.workspace = true
futures-util.workspace = true
arrow-array.workspace = true
lancedb.workspace = true
hmac.workspace = true
image.workspace = true
notify.workspace = true
regex.workspace = true
regress.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
tracing.workspace = true
tiktoken-rs.workspace = true
uuid.workspace = true
zip.workspace = true
zstd = "0.13.3"

[dev-dependencies]
butler-memory = { path = "../butler-memory" }
tz-rs.workspace = true

[lints]
workspace = true
