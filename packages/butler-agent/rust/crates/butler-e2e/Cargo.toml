[package]
name = "butler-e2e"
description = "Dev-only end-to-end harness: drives the real butler-agent binary through its public surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The harness never imports product crates. Only the dev-only round-store
# companion executable links the actual provider serializer and TurnStore.
# butler-platform is not product code: it is the OS boundary every crate uses.
[dependencies]
butler-core = { path = "../butler-core" }
butler-models = { path = "../butler-models" }
butler-turn = { path = "../butler-turn", features = ["test-support"] }
tokio-util.workspace = true
url.workspace = true
butler-platform = { path = "../butler-platform", features = ["test-support"] }
axum.workspace = true
base64.workspace = true
bytes.workspace = true
flate2.workspace = true
chrono.workspace = true
futures-util.workspace = true
hmac.workspace = true
notify.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
tiktoken-rs.workspace = true
uuid.workspace = true
zip.workspace = true

[lints]
workspace = true
