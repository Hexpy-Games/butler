[workspace]
members = ["crates/*", "tools/source-check"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
publish = false

[workspace.dependencies]
semver = "1.0.27"
arrow-array = "=57.3.1"
arrow-schema = "=57.3.1"
axum = { version = "0.8.4", features = ["http1", "json", "multipart", "tokio"] }
base64 = "0.22.1"
bytes = "=1.12.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
dom_smoothie = "=0.18.2"
uuid = { version = "1.18.1", default-features = false, features = ["std", "v4"] }
regex = "1.13.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls-native-roots", "stream", "gzip", "brotli", "deflate", "http2"] }
futures-core = "0.3.31"
futures-util = { version = "0.3.31", default-features = false, features = ["async-await", "std"] }
http-body-util = "0.1.3"
http = "=1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
lance = { version = "=4.0.0", default-features = false }
lancedb = { version = "=0.27.2", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "api-21"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
webp = { version = "=0.3.1", default-features = false }
# Compiled ICU4X 1.4 / CLDR 44 data.
icu_collator = "=1.4.0"
icu_locid = "~1.4.0"
icu_provider = { version = "~1.4.0", features = ["sync"], default-features = false }
notify = "8.2.0"
parking_lot = "0.12.5"
lopdf = { version = "=0.45.0", default-features = false }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.143", features = ["preserve_order", "raw_value"] }
ryu-js = "1.0.3"
rusqlite = { version = "0.37.0", features = ["bundled", "hooks"] }
sha2 = "0.10.9"
sha1 = "0.10.6"
subtle = "2.6.1"
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
tz-rs = { version = "=0.7.3", default-features = false, features = ["alloc"] }
thiserror = "2.0.20"
tiktoken-rs = { version = "0.12.0", default-features = false }
unicode-normalization = "0.1.24"
unicode-segmentation = "=1.13.3"
url = "2.5.8"
regress = { version = "=0.12.0", features = ["utf16", "prohibit-unsafe"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "server", "macros", "transport-io", "transport-async-rw", "transport-streamable-http-client-reqwest"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
# Agent archives (`butler install`, `butler update --apply`): gzip-compressed tar.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
rustix = { version = "=1.1.5", features = ["fs"] }
if-addrs = "=0.15.0"
nix = { version = "=0.31.3", default-features = false, features = ["feature", "fs", "hostname", "net", "signal"] }
libproc = "=0.14.11"
# Windows process table, Job Objects and path normalization (butler-platform).
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }
win32job = "=2.0.3"
dunce = "=1.0.5"
iana-time-zone = "=0.1.65"
# The OS credential store (#217, butler-platform `secrets`): the keyring-core
# API and one store per OS (macOS Keychain; Secret Service over D-Bus in pure
# Rust; Windows Credential Manager). The `keyring` crate's own docs point
# applications at these crates rather than at its all-in-one wrapper.
keyring-core = "=1.0.0"
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["crypto-rust"] }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
zeroize = "1.8"
# The Developer ID signature check that turns the system store on (macOS).
security-framework = "3.7"
# Secret input from a terminal with echo off (`butler auth keys replace`).
rpassword = "7.4"
# Key fingerprints (HMAC-SHA-256 with a data-folder secret) for duplicate checks.
hmac = "0.12"

# Debug info is limited to line tables because full DWARF made macOS target
# directories exceed 50 GB: macOS defaults to split-debuginfo = "unpacked",
# which keeps every object file's debug info in target/debug/deps, and
# incremental rebuilds leave the superseded objects behind. Line tables keep
# file:line in panic messages and backtraces (no test inspects variables or
# frames beyond that); "packed" moves them into one .dSYM per binary.
# Dependencies need no debug info. profile.test inherits these settings.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

# Installing an Agent archive hashes and inflates a few hundred megabytes; at
# opt-level 0 that takes minutes in the install scenarios. These leaf crates
# are small, so optimizing them costs little.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# No panics in production code. Tests may unwrap/expect/panic (clippy.toml).
# A remaining expect() must carry #[expect(clippy::expect_used, reason = "..")]
# naming the test that proves its invariant.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
await_holding_lock = "deny"
# Not yet denied: 1079 of 1700 hits index serde_json::Value by key, which
# never panics on read (P5 replaces Value with typed structs). The remaining
# slice/Vec/str indexing is inventoried for a follow-up pass (see P2B notes).
indexing_slicing = "allow"

# Pedantic lints that are allowed, with the reason each one is noise here:
# Function length is bounded by module structure (P3) and source-check file caps.
too_many_lines = "allow"
# `.map(f).unwrap_or(d)` reads left to right; `map_or(d, f)` inverts it.
map_unwrap_or = "allow"
# Counters, token totals and timestamps converted to f64 stay far below 2^52.
cast_precision_loss = "allow"
# Modules glob-import their own contract/sibling items; P3 restructures modules.
wildcard_imports = "allow"
# Field names mirror persisted wire and storage schemas.
struct_field_names = "allow"
# `match` with an explicit else arm is as clear as `if let` .. `else`.
single_match_else = "allow"
# Extension checks are case-sensitive on purpose: they mirror the Bun source.
case_sensitive_file_extension_comparisons = "allow"
# JS-number mirrors are compared exactly by design (parity with the Bun source).
float_cmp = "allow"
# Local helper items next to their only use read better than hoisted ones.
items_after_statements = "allow"
# Pairs like `left`/`right`, `before`/`after` are deliberate.
similar_names = "allow"
# `a = b.clone()` is clearer than `a.clone_from(&b)`; none are hot paths.
assigning_clones = "allow"
# Internal crate: `#[must_use]`/`# Errors` docs on every fn add noise, not safety.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Backticks in prose docs are cosmetic.
doc_markdown = "allow"
# `s += &format!(..)` is clearer than `let _ = write!(s, ..)`.
format_push_string = "allow"
# `Default::default()` in struct literals avoids repeating long type names.
default_trait_access = "allow"
# 25 functions keep fallible signatures that mirror their sibling adapters
# (see the P2c notes); unwrapping them is a follow-up, not an error-type issue.
unnecessary_wraps = "allow"
# Internal crates: every map is built with the default hasher.
implicit_hasher = "allow"
# Methods keep their receiver for symmetry with sibling methods on the owner.
unused_self = "allow"
# `Option<Option<T>>` models JSON tri-state fields: absent, explicit null, value.
option_option = "allow"
# Counting newlines in small buffers; not worth a `bytecount` dependency.
naive_bytecount = "allow"
# Parity fixtures deliberately carry decomposed (non-NFC) text.
unicode_not_nfc = "allow"
