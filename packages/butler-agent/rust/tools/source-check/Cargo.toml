[package]
name = "butler-source-check"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Span locations give the function-length rule its line numbers.
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "1.0.45"
syn = { version = "=2.0.119", features = ["full", "visit"] }
# Spanned parsing sees every spelling of a manifest dependency or target table.
toml = { version = "=1.1.6", default-features = false, features = ["parse", "std"] }

[lints]
workspace = true
