[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

# Each test loads its own bge-m3 worker. Concurrent loads of both starved the
# other's 750 ms vector search on CI runners (#1493); one agent never loads
# two, and alone each search stays far below its window.
[test-groups]
bge-m3 = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(=e2e) and (test(=memory_wiring_more::wiring_more_correction_supersedes_previous_rule_in_next_prompt) or test(=memory_wiring_more::forget::rules_forget_and_correction_preserve_other_bindings_after_restart))'
test-group = 'bge-m3'

[[profile.default.overrides]]
filter = 'test(/(^|::)ins_/)'
slow-timeout = { period = "6m", terminate-after = 1 }

# Start complete observation windows early; keep their original deadlines.
[[profile.default.overrides]]
filter = 'test(/^memory_idle::mem_idle_/) or test(/^schedule_store::sched_06_/) or test(/^startup_readiness::stalled_startup_exits_at_agent_deadline$/)'
priority = 10

# Three full 60-second windows, plus startup, retention settlement and shutdown.
# Run only in the serial perf selection; the observations themselves stay 180s.
[[profile.default.overrides]]
filter = 'test(/^hooks::idle::perf_hooks_no_config_idle_has_zero_writes_for_three_windows$/)'
slow-timeout = { period = "6m", terminate-after = 1 }

# Browser-on only: full 600-second attached-host observation plus lifecycle work.
[[profile.default.overrides]]
filter = 'test(/^browser_outputs::perf_published_outputs_idle_ten_minutes_without_writes$/)'
slow-timeout = { period = "12m", terminate-after = 1 }

# PERF-IDLE: 120-second startup grace and ten full 60-second idle windows.
[[profile.default.overrides]]
filter = 'test(/^idle_resources::perf_idle_history_reads_and_footprint$/)'
slow-timeout = { period = "15m", terminate-after = 1 }
