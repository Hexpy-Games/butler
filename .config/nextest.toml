[profile.default]
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'test(/::ins_/)'
success-output = 'final'
slow-timeout = { period = "6m", terminate-after = 1 }

# PERF-01 measures request latency at owner scale. Other test processes must
# not compete for the same runner while it samples the unchanged budget.
[[profile.default.overrides]]
filter = 'binary(=e2e) and test(/^app_storage_scale::perf_01_/)'
threads-required = 8
priority = 100
success-output = "final"
