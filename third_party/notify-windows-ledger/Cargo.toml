windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging"] }

[features]
test-support = []
