name: Prepare owner Windows build host
description: Installed tools, persistent verified ORT, isolated profile and registry sentinel
inputs:
  require-prebuilt:
    required: false
    default: 'false'
    description: Require the digest-verified published SDK instead of compiling it
  workflow:
    required: true
    description: Runner-local Cargo cache namespace
runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@v1
      with:
        version: 1.2.3
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Isolate job profile and snapshot protocol registration
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        if ('${{ inputs.workflow }}' -notmatch '^[a-zA-Z0-9_-]+$') { throw 'Invalid cache namespace' }
        $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString('N'))
        # A sibling in this runner's _work tree survives checkout's git clean.
        $cache = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'butler-windows-owner'
        New-Item -ItemType Directory -Force "$root/home","$root/data","$root/local","$root/roaming","$root/tmp" | Out-Null
        & ./deploy/windows-protocol-snapshot.ps1 -Output "$root/protocol-before.json"
        # Keep build resource use bounded and preserve task identity if the
        # runner disconnects before GitHub can upload its step logs (#500).
        @{run_id=$env:GITHUB_RUN_ID; sha=$env:GITHUB_SHA; cache='${{ inputs.workflow }}'; powershell_pid=$PID} |
          ConvertTo-Json -Compress | Set-Content -Encoding utf8 "$root/job.json"
        $memory = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
        if ($memory) {
          "Native build: cargo_jobs=8 total_mib=$([math]::Round($memory.TotalVisibleMemorySize / 1024)) free_mib=$([math]::Round($memory.FreePhysicalMemory / 1024))"
        }
        @("OWNER_JOB_ROOT=$root", "OWNER_CACHE_ROOT=$cache", "CARGO_TARGET_DIR=$cache/${{ inputs.workflow }}",
          "BUTLER_PERSISTENT_TARGET=$cache/${{ inputs.workflow }}",
          "CARGO_HOME=$env:USERPROFILE\.cargo", "RUSTUP_HOME=$env:USERPROFILE\.rustup",
          "PYTHONDONTWRITEBYTECODE=1", "CARGO_BUILD_JOBS=8", "RUSTC_WRAPPER=",
          "BUTLER_SECRET_STORE=file", "BUTLER_PLATFORM_SYSTEM_SECRETS=0", "BUTLER_APP_DISABLE_SHELL_REGISTRATION=1",
          "BUN_INSTALL_CACHE_DIR=$cache/bun",
          "HOME=$root/home", "BUTLER_DATA=$root/data", "LOCALAPPDATA=$root/local",
          "APPDATA=$root/roaming", "TEMP=$root/tmp", "TMP=$root/tmp",
          "npm_config_cache=$cache/npm", "NUGET_PACKAGES=$cache/nuget") >> $env:GITHUB_ENV
        exit 0
    - name: Verify or prepare pinned static ORT
      shell: pwsh
      working-directory: packages/butler-agent/rust
      run: |
        $cargoTarget = $env:CARGO_TARGET_DIR
        try {
          $env:CARGO_TARGET_DIR = Join-Path $env:OWNER_CACHE_ROOT 'ort-cache'
          $sdkArgs = @()
          if ('${{ inputs.require-prebuilt }}' -eq 'true') { $sdkArgs += '--require-prebuilt' }
          $prepared = python scripts/prepare-static-ort.py @sdkArgs
          if ($LASTEXITCODE -ne 0) { throw 'Static ORT preparation/hash verification failed' }
          $native = $prepared | ConvertFrom-Json
          @("ORT_LIB_PATH=$($native.ort_lib_path)", "PROTOC=$($native.protoc)",
            'ORT_PREFER_DYNAMIC_LINK=0', 'ORT_SKIP_DOWNLOAD=1') >> $env:GITHUB_ENV
        } finally { $env:CARGO_TARGET_DIR = $cargoTarget }
