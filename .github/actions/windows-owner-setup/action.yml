name: Prepare owner Windows build host
description: Installed tools, persistent verified ORT, isolated profile and registry sentinel
inputs:
  workflow:
    required: true
    description: Persistent Cargo cache namespace
runs:
  using: composite
  steps:
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - name: Isolate job profile and snapshot protocol registration
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        $root = Join-Path $env:RUNNER_TEMP ('butler-' + [guid]::NewGuid())
        New-Item -ItemType Directory "$root/home","$root/data","$root/local","$root/roaming","$root/tmp" | Out-Null
        & ./deploy/windows-protocol-snapshot.ps1 -Output "$root/protocol-before.json"
        @("OWNER_JOB_ROOT=$root", "CARGO_TARGET_DIR=C:\Users\yeonw\work\target\${{ inputs.workflow }}",
          "CARGO_HOME=$env:USERPROFILE\.cargo", "RUSTUP_HOME=$env:USERPROFILE\.rustup",
          "RUSTC_WRAPPER=sccache", "SCCACHE_DIR=C:\actions-cache\sccache",
          "SCCACHE_SERVER_PORT=$(Get-Random -Minimum 42000 -Maximum 49000)",
          "BUTLER_SECRET_STORE=file", "BUTLER_PLATFORM_SYSTEM_SECRETS=0", "BUN_INSTALL_CACHE_DIR=C:\actions-cache\bun",
          "HOME=$root/home", "BUTLER_DATA=$root/data", "LOCALAPPDATA=$root/local",
          "APPDATA=$root/roaming", "TEMP=$root/tmp", "TMP=$root/tmp") >> $env:GITHUB_ENV
        exit 0
    - name: Verify or prepare pinned static ORT
      shell: pwsh
      working-directory: packages/butler-agent/rust
      run: |
        $cargoTarget = $env:CARGO_TARGET_DIR
        try {
          $env:CARGO_TARGET_DIR = 'C:\Users\yeonw\work\ort-cache'
          $prepared = python scripts/prepare-static-ort.py
          if ($LASTEXITCODE -ne 0) { throw 'Static ORT preparation/hash verification failed' }
          $native = $prepared | ConvertFrom-Json
          @("ORT_LIB_PATH=$($native.ort_lib_path)", "PROTOC=$($native.protoc)",
            'ORT_PREFER_DYNAMIC_LINK=0', 'ORT_SKIP_DOWNLOAD=1') >> $env:GITHUB_ENV
        } finally { $env:CARGO_TARGET_DIR = $cargoTarget }
