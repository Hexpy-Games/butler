name: Build the standalone Agent archive
description: >-
  Builds the native Agent for the runner's own platform (darwin-arm64,
  linux-x64 or linux-arm64), then gates, packages and smokes its standalone
  archive with the release scripts into `out`. Select prebuilt ORT for regular
  CI or custom static ORT for tagged releases and nightly full install smoke.
  Shared by release and install smoke.

inputs:
  agent-artifact:
    description: Optional same-run compatible release Agent artifact.
    default: ""
  reuse-pr-agent:
    description: Look for a compatible successful exact-commit PR build on tags.
    default: "false"
  cache-key:
    description: The rust-cache shared key for this platform.
    required: true
  ort-mode:
    description: "prebuilt-ort for regular CI or static-ort for tagged releases and nightly full install smoke."
    required: false
    default: prebuilt-ort
  artifact-base-url:
    description: URL prefix the archive will be published under; recorded in the manifests.
    required: true
  out:
    description: Output directory, relative to the repository root.
    required: false
    default: dist/release/agent

outputs:
  platform:
    description: The platform label of the archive (for example linux-x64).
    value: ${{ steps.package.outputs.platform }}
  archive:
    description: Path of the archive.
    value: ${{ steps.package.outputs.archive }}

runs:
  using: composite
  steps:
    - name: Look for an exact-commit release Agent
      id: reuse
      if: inputs.reuse-pr-agent == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ORT_MODE: ${{ inputs.ort-mode }}
        RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}
      run: |
        platform="$(node -p 'process.platform + "-" + process.arch')"
        python3 "$GITHUB_WORKSPACE/.github/scripts/agent-provenance.py" reuse "$RUNNER_TEMP/reused-agent" "$platform" "$ORT_MODE" release "${GITHUB_REF_NAME#v}"
    - name: Set up Rust and ONNX Runtime
      if: inputs.agent-artifact == '' && steps.reuse.outputs.reused != 'true'
      uses: ./.github/actions/rust-agent-setup
      with:
        native-deps: ${{ inputs.ort-mode }}
        cache-key: ${{ inputs.cache-key }}
        cache-workspace-crates: 'true'

    - name: Set up Bun
      uses: ./.github/actions/bun-setup
      with:
        bun-version: 1.3.11

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.23.3
        cache: npm
        cache-dependency-path: packages/butler-app/client/ui/package-lock.json

    # The renderer ships in the Agent's resources (app-client/dist).
    - name: Build the App renderer
      shell: bash
      run: |
        set -euo pipefail
        python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" bun install --frozen-lockfile --ignore-scripts
        python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" npm --prefix packages/butler-app/client/ui run build

    - name: Build the native Agent
      if: inputs.agent-artifact == '' && steps.reuse.outputs.reused != 'true'
      shell: bash
      working-directory: packages/butler-agent/rust
      env:
        ORT_MODE: ${{ inputs.ort-mode }}
        BUTLER_MEMORY_IMPLEMENTATION_COMMIT: ${{ github.sha }}
        GITHUB_REF_NAME: ${{ github.event_name == 'pull_request' && 'v0.1.0-preview.99' || github.ref_name }}
      run: |
        set -euo pipefail
        case "$ORT_MODE" in
          static-ort)
            python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo build --release --locked -p butler-agent --bin butler-agent --no-default-features --features static-ort
            ;;
          prebuilt-ort)
            python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo build --release --locked -p butler-agent --bin butler-agent --no-default-features --features prebuilt-ort
            ;;
          *)
            printf 'Unsupported ONNX Runtime mode: %s\n' "$ORT_MODE" >&2
            exit 1
            ;;
        esac
        echo "BUTLER_NATIVE_AGENT_EXECUTABLE=$PWD/target/release/butler-agent" >> "$GITHUB_ENV"

    - uses: actions/download-artifact@v4
      if: inputs.agent-artifact != ''
      with:
        name: ${{ inputs.agent-artifact }}
        path: ${{ runner.temp }}/shared-agent
    - name: Use the shared release Agent
      if: inputs.agent-artifact != ''
      shell: bash
      run: |
        chmod +x "$RUNNER_TEMP/shared-agent/butler-agent"
        echo "BUTLER_NATIVE_AGENT_EXECUTABLE=$RUNNER_TEMP/shared-agent/butler-agent" >> "$GITHUB_ENV"

    - name: Package and smoke the archive
      id: package
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        BASE_URL: ${{ inputs.artifact-base-url }}
        GITHUB_REF_NAME: ${{ github.event_name == 'pull_request' && 'v0.1.0-preview.99' || github.ref_name }}
      run: |
        set -euo pipefail
        platform="$(node -p 'process.platform + "-" + process.arch')"
        payload="$RUNNER_TEMP/butler-native-agent-payload"
        scripts=packages/butler-agent/rust/scripts
        node packages/butler-app/client/electron/scripts/prepare-native-agent.mjs "${platform%%-*}" "${platform#*-}" "$payload"
        version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$payload/native-agent-manifest.json")"
        archive="$OUT/butler-agent-${version}-${platform}.tar.gz"
        url="$BASE_URL/$(basename "$archive")"
        mkdir -p "$OUT"
        python3 "$scripts/release-standalone-agent.py" gate --payload "$payload"
        python3 "$scripts/package-standalone-agent.py" --payload "$payload" --output "$archive" --artifact-url "$url"
        python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" python3 "$scripts/release-standalone-agent.py" smoke --archive "$archive" --artifact-url "$url"
        echo "platform=$platform" >> "$GITHUB_OUTPUT"
        echo "archive=$archive" >> "$GITHUB_OUTPUT"
