name: E2E stub tier
description: Run the real agent binary against replay cassettes on the current Rust job.
inputs:
  idle-only:
    description: Run only the complete PERF-IDLE libtest observation.
    default: "false"
  run-perf-idle:
    description: Run PERF-IDLE after the serial performance selection.
    default: "true"
  restore-embedding-model:
    description: Restore the model only for jobs that exercise embedding.
    default: "true"
  run-systemd:
    description: Probe the user manager only for jobs containing INS-14.
    default: "true"
  partition:
    description: Nextest partition in m/n form.
    required: false
    default: ""
  filter-file:
    description: File containing the producer-generated complete shard filter.
    default: ""
  filterset:
    description: Nextest filterset expression applied to the stub tier.
    required: false
    default: ""
  test-threads:
    description: Optional nextest test thread count.
    required: false
    default: ""
  release-profile:
    description: Build and run the E2E tests with Cargo's release profile.
    required: false
    default: "false"
  exclude-perf:
    description: Exclude perf_* wall-clock budget tests from this shared tier.
    required: false
    default: "true"
  enforce-budgets:
    description: Enforce budgets and select all binaries using the wall-clock helper.
    required: false
    default: "false"
  success-output:
    description: Optional nextest output mode for successful tests.
    required: false
    default: ""
  archive-file:
    description: Optional nextest archive to run without rebuilding test binaries.
    required: false
    default: ""
  agent-binary:
    description: Optional prebuilt butler-agent binary used by the E2E harness.
    required: false
    default: ""
  run-idle-disk:
    description: Run the separate IDLE-DISK check when its test file is present.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Restore embedding model cache
      if: inputs.restore-embedding-model == 'true'
      id: embedding-cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/e2e-models/bge-m3
        key: bge-m3-4de13258303883538bd53b696b452bf8099f0858

    - name: Fetch embedding model
      if: inputs.restore-embedding-model == 'true' && steps.embedding-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}
      run: |
        set -euo pipefail
        base=https://huggingface.co/Xenova/bge-m3/resolve/4de13258303883538bd53b696b452bf8099f0858
        dir=e2e-models/bge-m3
        mkdir -p "$dir/onnx"
        while read -r sha file; do
          curl -fsSL --retry 3 -o "$dir/$file" "$base/$file"
          if [ "$RUNNER_OS" = macOS ]; then
            echo "$sha  $dir/$file" | shasum -a 256 -c -
          else
            echo "$sha  $dir/$file" | sha256sum -c -
          fi
        done <<'LIST'
        6710678b12670bc442b99edc952c4d996ae309a7020c1fa0096dd245c2faf790 tokenizer.json
        7e4c1cc848840aeccdd763458c18dd525eb0f795c992e00ebe9c28554e7db2d4 tokenizer_config.json
        734a79bf12d388c1467a4e3ab625f45de7f6906cffcfb93a1eca1787504bed95 config.json
        0826f8c1ab9edf1801db86c61919d4d108e8bfc0b809ec823ad366882ff0b77d onnx/model_quantized.onnx
        LIST

    - name: Probe the systemd user manager
      if: runner.os == 'Linux' && inputs.run-systemd == 'true'
      id: systemd
      shell: bash
      run: |
        sudo loginctl enable-linger "$USER" || true
        uid="$(id -u)"
        export XDG_RUNTIME_DIR="/run/user/$uid"
        for _ in $(seq 1 30); do
          if systemctl --user show-environment >/dev/null 2>&1; then
            echo "available=1" >> "$GITHUB_OUTPUT"
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus" >> "$GITHUB_ENV"
            exit 0
          fi
          sleep 1
        done
        echo "available=0" >> "$GITHUB_OUTPUT"
        echo "::notice title=INS-14 SKIPPED::no systemd --user manager on this runner"

    - name: Restore agent binary permissions
      if: inputs.agent-binary != ''
      shell: bash
      env:
        AGENT_BINARY: ${{ inputs.agent-binary }}
      run: chmod +x "$AGENT_BINARY"

    - name: Run the stub tier
      if: inputs.idle-only != 'true'
      shell: bash
      working-directory: packages/butler-agent/rust
      env:
        PARTITION: ${{ inputs.partition }}
        TEST_FILTERSET: ${{ inputs.filterset }}
        FILTER_FILE: ${{ inputs.filter-file }}
        TEST_THREADS: ${{ inputs.test-threads }}
        RELEASE_PROFILE: ${{ inputs.release-profile }}
        EXCLUDE_PERF: ${{ inputs.exclude-perf }}
        ENFORCE_BUDGETS: ${{ inputs.enforce-budgets }}
        TEST_SUCCESS_OUTPUT: ${{ inputs.success-output }}
        ARCHIVE_FILE: ${{ inputs.archive-file }}
        BUTLER_E2E_EMBEDDING_ASSETS: ${{ runner.temp }}/e2e-models/bge-m3
        BUTLER_E2E_TIER: stub
        BUTLER_PROMPT_MAIN_RECORD: "0"
        BUTLER_E2E_SKIP_BUILD: "1"
        BUTLER_E2E_BIN: ${{ inputs.agent-binary }}
        BUTLER_E2E_SYSTEMD: ${{ steps.systemd.outputs.available }}
        BUTLER_E2E_REPORT: ${{ runner.temp }}/e2e-report.txt
      run: |
        set -euo pipefail
        if [ "$ENFORCE_BUDGETS" = 'true' ]; then
          if [ "$TEST_THREADS" != '1' ] || [ "$EXCLUDE_PERF" != 'false' ]; then
            echo "::error::enforce-budgets requires test-threads=1 and exclude-perf=false"
            exit 2
          fi
          export BUTLER_E2E_PERF=1
          TEST_FILTERSET="($(python3 "$GITHUB_WORKSPACE/.github/scripts/e2e-perf-filter.py")) and not test(/^(idle_resources|data_perf)::/)"
        elif [ "$ENFORCE_BUDGETS" = 'false' ]; then
          export BUTLER_E2E_PERF=0
        else
          echo "::error::enforce-budgets must be true or false"
          exit 2
        fi
        if [ -n "$FILTER_FILE" ]; then
          if [ "$ENFORCE_BUDGETS" = true ]; then
            TEST_FILTERSET="($TEST_FILTERSET) and ($(cat "$FILTER_FILE"))"
          else
            TEST_FILTERSET="$(cat "$FILTER_FILE")"
          fi
        fi
        filterset='package(=butler-e2e) and not test(idle_disk_writes_and_cpu_stay_bounded)'
        if [ -n "$TEST_FILTERSET" ]; then
          filterset="($TEST_FILTERSET) and $filterset"
        fi
        if [ "$EXCLUDE_PERF" = 'true' ]; then
          filterset="($filterset) and not test(/(^|::)perf_/)"
        fi
        # Bash 3.2 (macOS) treats empty arrays as unset with nounset.
        # Presence-guarded expansions below preserve zero arguments and quoting.
        nextest_profile_args=()
        if [ "$RELEASE_PROFILE" = 'true' ]; then
          nextest_profile_args=(--release)
        elif [ "$RELEASE_PROFILE" != 'false' ]; then
          echo "::error::release-profile must be true or false"
          exit 2
        fi
        nextest_partition_args=()
        if [ -n "$PARTITION" ]; then
          nextest_partition_args=(--partition "hash:$PARTITION")
        fi
        nextest_threads_args=()
        if [ -n "$TEST_THREADS" ]; then
          nextest_threads_args=(--test-threads="$TEST_THREADS")
        fi
        nextest_success_output_args=()
        if [ -n "$TEST_SUCCESS_OUTPUT" ]; then
          nextest_success_output_args=(--success-output="$TEST_SUCCESS_OUTPUT")
        fi
        isolate="$GITHUB_WORKSPACE/.github/scripts/isolated.py"
        if [ -n "$ARCHIVE_FILE" ]; then
          python3 "$isolate" cargo-nextest nextest list --archive-file "$ARCHIVE_FILE" --workspace-remap "$PWD" -E "$filterset" ${nextest_partition_args[@]+"${nextest_partition_args[@]}"}
          set +e
          python3 "$isolate" cargo-nextest nextest --config-file "$GITHUB_WORKSPACE/.config/nextest.toml" \
            run --no-fail-fast --retries 0 --archive-file "$ARCHIVE_FILE" \
            --workspace-remap "$PWD" \
            ${nextest_partition_args[@]+"${nextest_partition_args[@]}"} \
            ${nextest_threads_args[@]+"${nextest_threads_args[@]}"} \
            ${nextest_success_output_args[@]+"${nextest_success_output_args[@]}"} \
            -E "$filterset" \
            2>&1 | tee "$RUNNER_TEMP/e2e-stub.log"
          run_status=("${PIPESTATUS[@]}")
        else
          set +e
          python3 "$isolate" cargo nextest --config-file "$GITHUB_WORKSPACE/.config/nextest.toml" \
            run ${nextest_profile_args[@]+"${nextest_profile_args[@]}"} --locked --no-fail-fast --retries 0 -p butler-e2e \
            ${nextest_partition_args[@]+"${nextest_partition_args[@]}"} \
            ${nextest_threads_args[@]+"${nextest_threads_args[@]}"} \
            ${nextest_success_output_args[@]+"${nextest_success_output_args[@]}"} \
            -E "$filterset" \
            2>&1 | tee "$RUNNER_TEMP/e2e-stub.log"
          run_status=("${PIPESTATUS[@]}")
        fi
        set -e
        if [ "${run_status[1]}" -ne 0 ]; then exit "${run_status[1]}"; fi
        python3 "$isolate" python3 "$GITHUB_WORKSPACE/.github/scripts/check-nextest-status.py" "${run_status[0]}" "$RUNNER_TEMP/e2e-stub.log"

    # PERF-IDLE takes five minutes by design; its documented cargo-test runner
    # avoids nextest's three-minute per-test watchdog without changing budgets.
    - name: Run PERF-IDLE and owner-scale resource budgets
      if: inputs.enforce-budgets == 'true' && inputs.run-perf-idle == 'true'
      shell: bash
      working-directory: packages/butler-agent/rust
      env:
        BUTLER_E2E_TIER: perf
        BUTLER_E2E_PERF: "1"
        BUTLER_E2E_SKIP_BUILD: "1"
        BUTLER_E2E_BIN: ${{ inputs.agent-binary }}
        BUTLER_E2E_EMBEDDING_ASSETS: ${{ runner.temp }}/e2e-models/bge-m3
        ARCHIVE_FILE: ${{ inputs.archive-file }}
      run: |
        set -euo pipefail
        if [ -n "$ARCHIVE_FILE" ]; then
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" python3 "$GITHUB_WORKSPACE/.github/scripts/run-idle-archive.py" "$ARCHIVE_FILE"
        else
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --release --locked -p butler-e2e --test e2e idle_resources:: -- --nocapture --test-threads=1
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --release --locked -p butler-e2e --test e2e data_perf:: -- --nocapture --test-threads=1
        fi

    - name: Report IDLE-DISK counters
      if: >-
        always() && inputs.run-idle-disk == 'true' &&
        hashFiles('packages/butler-agent/rust/crates/butler-e2e/tests/e2e/idle_disk.rs') != ''
      shell: bash
      working-directory: packages/butler-agent/rust
      env:
        ARCHIVE_FILE: ${{ inputs.archive-file }}
        BUTLER_E2E_BIN: ${{ inputs.agent-binary }}
        BUTLER_E2E_EMBEDDING_ASSETS: ${{ runner.temp }}/e2e-models/bge-m3
        BUTLER_E2E_TIER: stub
        BUTLER_PROMPT_MAIN_RECORD: "0"
        BUTLER_E2E_SKIP_BUILD: "1"
      run: |
        isolate="$GITHUB_WORKSPACE/.github/scripts/isolated.py"
        if [ -n "$ARCHIVE_FILE" ]; then
          python3 "$isolate" cargo-nextest nextest run --archive-file "$ARCHIVE_FILE" --workspace-remap "$PWD" --no-fail-fast --retries 0 --nocapture -E 'test(idle_disk_writes_and_cpu_stay_bounded)'
        else
          python3 "$isolate" cargo test --locked -p butler-e2e --test e2e idle_disk:: -- --nocapture
        fi

    - name: Summarize
      if: always()
      env:
        PARTITION: ${{ inputs.partition }}
        TEST_FILTERSET: ${{ inputs.filterset }}
      shell: bash
      run: |
        {
          if [ -n "$PARTITION" ]; then
            selection="partition $PARTITION"
          else
            selection="filterset $TEST_FILTERSET"
          fi
          echo "### E2E stub tier ($RUNNER_OS $RUNNER_ARCH, $selection)"
          if [ -f "$RUNNER_TEMP/e2e-stub.log" ]; then
            grep -E '^(PASS|FAIL|SKIP|CANCEL)' "$RUNNER_TEMP/e2e-stub.log" | sed 's/^/    /' || true
          fi
          echo "Live scenarios: SKIPPED (tier: stub)."
        } >> "$GITHUB_STEP_SUMMARY"
