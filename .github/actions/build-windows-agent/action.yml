name: Build unsigned Windows Agent
description: Build and package the x64 browser-UI Agent preview
inputs:
  artifact-base-url:
    required: true
    description: Published archive base URL
  cache-key:
    required: true
    description: Cargo cache key
runs:
  using: composite
  steps:
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - uses: ./.github/actions/rust-agent-setup
      with:
        native-deps: prebuilt-ort
        cache-key: ${{ inputs.cache-key }}
    - uses: oven-sh/setup-bun@v2
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build renderer
      working-directory: ${{ github.workspace }}
      shell: pwsh
      run: |
        $env:HOME = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
        $env:BUTLER_DATA = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
        New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
        bun install --frozen-lockfile --ignore-scripts
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npm --prefix packages/butler-app/client/ui run build
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build unsigned release executable
      shell: pwsh
      working-directory: packages/butler-agent/rust
      run: |
        $env:CARGO_HOME = "$env:USERPROFILE/.cargo"
        $env:RUSTUP_HOME = "$env:USERPROFILE/.rustup"
        $env:HOME = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
        $env:BUTLER_DATA = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
        New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
        $env:RUSTFLAGS = '-C target-feature=+crt-static'
        cargo build --locked --release --target x86_64-pc-windows-msvc -p butler-agent --bin butler-agent
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $binary = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/butler-agent.exe"
        # A runner has development DLLs installed. Refuse a dependency they hide.
        $imports = & dumpbin /dependents $binary
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $imports | Write-Output
        foreach ($line in $imports) {
          if ($line.Trim() -match '(?i)^(onnxruntime|vcruntime|msvcp|concrt|ucrtbase).*\.dll$') {
            throw 'Agent has an unpackaged runtime dependency'
          }
        }
    - name: Package ZIP and shared Agent manifests
      working-directory: ${{ github.workspace }}
      shell: pwsh
      run: |
        $env:HOME = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
        $env:BUTLER_DATA = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
        New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
        python packages/butler-agent/rust/scripts/package-windows-agent.py `
          --binary "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/butler-agent.exe" `
          --resources packages/butler-agent/resources --renderer packages/butler-app/client/ui/dist `
          --output dist/release/agent --artifact-base-url '${{ inputs.artifact-base-url }}'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
