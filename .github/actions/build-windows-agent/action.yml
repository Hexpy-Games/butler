name: Build unsigned Windows Agent
description: Build and package the x64 browser-UI Agent preview
inputs:
  version:
    required: false
    default: ""
    description: Exact release version override for update packages
  artifact-base-url:
    required: true
    description: Published archive base URL
  cache-key:
    required: true
    description: Cargo cache key
  cargo-target-dir:
    required: false
    default: "../../../target/windows-release"
    description: Cargo target directory relative to the Rust workspace
  native-deps-artifact:
    required: false
    default: ""
    description: Verified static runtime prepared separately in this workflow
  profile:
    required: false
    default: release
    description: Cargo profile (release for tags, ci-fast for previews)
  owner-runner:
    required: false
    default: 'false'
    description: Use installed tools and persistent verified native cache
runs:
  using: composite
  steps:
    # Version overrides label fixtures; feature selection follows the original ref.
    - uses: ./.github/actions/product-features
    - uses: ilammy/msvc-dev-cmd@v1
      if: inputs.owner-runner != 'true'
      with:
        arch: x64
    - uses: actions/download-artifact@v4
      if: inputs.native-deps-artifact != ''
      with:
        name: ${{ inputs.native-deps-artifact }}
        path: ${{ runner.temp }}/windows-native-artifact
    - name: Restore native tree with its verified library layout
      if: inputs.native-deps-artifact != ''
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      run: |
        $root = $env:RUNNER_TEMP
        New-Item -ItemType Directory -Force "$root/ort-cache/native-deps" | Out-Null
        $ErrorActionPreference = 'Continue'
        tar -xf "$root/windows-native-artifact/windows-native-deps.tar.zst" -C "$root/ort-cache/native-deps" --use-compress-program 'zstd -d'
        $ErrorActionPreference = 'Stop'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: ./.github/actions/rust-agent-setup
      if: inputs.owner-runner != 'true'
      with:
        native-deps: static-ort
        artifact-cache-platform: windows-x64
        snapshot-profile: ${{ inputs.profile }}
        snapshot-target: x86_64-pc-windows-msvc
        cache-key: ${{ inputs.cache-key }}-target-v1
        cargo-target-dir: ${{ inputs.cargo-target-dir }}
        prepared-static-ort: ${{ inputs.native-deps-artifact != '' }}
    - uses: oven-sh/setup-bun@v2
      if: inputs.owner-runner != 'true'
    - uses: actions/setup-node@v4
      if: inputs.owner-runner != 'true'
      with:
        node-version: 22
    - name: Build renderer
      working-directory: ${{ github.workspace }}
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      run: |
        $profileRoot = if ($env:OWNER_JOB_ROOT) { $env:OWNER_JOB_ROOT } else { $env:RUNNER_TEMP }
        $env:HOME = Join-Path $profileRoot ([guid]::NewGuid())
        $env:BUTLER_DATA = Join-Path $profileRoot ([guid]::NewGuid())
        New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
        $ErrorActionPreference = 'Continue'
        bun install --frozen-lockfile --ignore-scripts
        $ErrorActionPreference = 'Stop'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $ErrorActionPreference = 'Continue'
        npm.cmd --prefix packages/butler-app/client/ui run build
        $ErrorActionPreference = 'Stop'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Build unsigned release executable
      env:
        GH_TOKEN: ${{ github.token }}
        BUTLER_MEMORY_IMPLEMENTATION_COMMIT: ${{ github.sha }}
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      working-directory: packages/butler-agent/rust
      run: |
        $env:CARGO_HOME = "$env:USERPROFILE/.cargo"
        $env:RUSTUP_HOME = "$env:USERPROFILE/.rustup"
        $profileRoot = if ($env:OWNER_JOB_ROOT) { $env:OWNER_JOB_ROOT } else { $env:RUNNER_TEMP }
        $env:HOME = Join-Path $profileRoot ([guid]::NewGuid())
        $env:BUTLER_DATA = Join-Path $profileRoot ([guid]::NewGuid())
        New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
        if ('${{ inputs.version }}') { $env:GITHUB_REF_NAME = 'v${{ inputs.version }}' }
        $env:RUSTFLAGS = '-C target-feature=+crt-static'
        if ('${{ inputs.profile }}' -eq 'release') {
          $env:CARGO_PROFILE_RELEASE_LTO = 'thin'
          $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = '1'
        }
        $env:TARGET_SNAPSHOT_PROFILE = '${{ inputs.profile }}'
        $env:TARGET_SNAPSHOT_FEATURES = 'butler-agent/static-ort'
        $env:CARGO_BUILD_TARGET = 'x86_64-pc-windows-msvc'
        # Owner setup bypasses rust-agent-setup; restore after setting exact flags.
        if ('${{ inputs.owner-runner }}' -eq 'true') {
          $ErrorActionPreference = 'Continue'
          $env:CARGO_TARGET_DIR = python "$env:GITHUB_WORKSPACE/.github/scripts/cargo-artifact-cache.py" target windows-x64 static-ort native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/cargo-artifact-cache.py" restore windows-x64 static-ort native
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        $ErrorActionPreference = 'Continue'
        cargo build --timings -j 8 --locked --profile ${{ inputs.profile }} --no-default-features --features static-ort --target x86_64-pc-windows-msvc -p butler-agent --bin butler-agent
        $ErrorActionPreference = 'Stop'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if ('${{ inputs.owner-runner }}' -eq 'true') {
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/cargo-artifact-cache.py" save-local windows-x64 static-ort native
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        $binary = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/${{ inputs.profile }}/butler-agent.exe"
        # A runner has development DLLs installed. Refuse a dependency they hide.
        $ErrorActionPreference = 'Continue'
        $imports = & dumpbin /dependents $binary
        $ErrorActionPreference = 'Stop'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $imports | Write-Output
        foreach ($line in $imports) {
          if ($line.Trim() -match '(?i)^(onnxruntime|vcruntime|msvcp|concrt|ucrtbase).*\.dll$') {
            throw 'Agent has an unpackaged runtime dependency'
          }
        }
    - name: Upload Cargo build timings
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: cargo-timings-build-windows-agent-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ inputs.version || github.run_attempt }}
        path: ${{ env.CARGO_TARGET_DIR || 'packages/butler-agent/rust/target' }}/cargo-timings/*.html
        if-no-files-found: error
        retention-days: 14
    - name: Package ZIP and shared Agent manifests
      working-directory: ${{ github.workspace }}
      shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
      run: |
        $profileRoot = if ($env:OWNER_JOB_ROOT) { $env:OWNER_JOB_ROOT } else { $env:RUNNER_TEMP }
        $env:HOME = Join-Path $profileRoot ([guid]::NewGuid())
        $env:BUTLER_DATA = Join-Path $profileRoot ([guid]::NewGuid())
        New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
        $ErrorActionPreference = 'Continue'
        python packages/butler-agent/rust/scripts/package-windows-agent.py `
          --binary "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/${{ inputs.profile }}/butler-agent.exe" `
          --resources packages/butler-agent/resources --renderer packages/butler-app/client/ui/dist `
          --output dist/release/agent --artifact-base-url '${{ inputs.artifact-base-url }}'
        $ErrorActionPreference = 'Stop'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
