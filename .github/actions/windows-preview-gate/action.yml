name: Windows preview completion evidence
description: Require the complete selected installed and hosted harness inventory
inputs:
  results:
    description: Producer and consumer job results
    required: true
runs:
  using: composite
  steps:
    - name: Isolate completion checks
      shell: pwsh
      run: |
        $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
        New-Item -ItemType Directory -Force "$root/home","$root/data" | Out-Null
        "WINDOWS_GATE_ROOT=$root" >> $env:GITHUB_ENV
        "HOME=$root/home" >> $env:GITHUB_ENV
        "BUTLER_DATA=$root/data" >> $env:GITHUB_ENV
    - name: Require all producer and verification jobs
      env:
        NEEDS_JSON: ${{ inputs.results }}
      shell: pwsh
      run: |
        $needs = ConvertFrom-Json $env:NEEDS_JSON -AsHashtable
        $selected = ConvertFrom-Json $needs.changes.outputs.jobs -AsHashtable
        foreach ($job in $needs.GetEnumerator() | Where-Object { $_.Key -ne 'changes' }) {
          $expected = if (!$selected[$job.Key]) { 'skipped' } else { 'success' }
          if ($job.Value.result -ne $expected) { throw "Incomplete Windows job: $($job.Key)=$($job.Value.result)" }
        }
    - uses: actions/download-artifact@v4
      with:
        pattern: windows-completed-*
        path: ${{ runner.temp }}/windows-completion
    - name: Require every selected verification harness
      env:
        NEEDS_JSON: ${{ inputs.results }}
      shell: pwsh
      run: |
        # Command matrix records cover both hosted/debug and installed/release binaries.
        # Integration rehydrates reused producers' records, so it requires them all.
        $harnesses = @{
          release = @('windows_startup_xml','installed_preview','windows_commands','projection_settlement')
          hosted = @('cli_surface','gateway_remote','gateway_pairing','cli_remote','windows_commands','project_workspace',
            'queue_notifications','queue_shutdown','migration','durable_configuration','service_supervision','service_diagnostics','local_zone')
        }
        $needs = ConvertFrom-Json $env:NEEDS_JSON -AsHashtable
        $selected = ConvertFrom-Json $needs.changes.outputs.jobs -AsHashtable
        $integration = $needs.changes.outputs.tier -eq 'integration'
        $expected = @($harnesses.Keys | Where-Object { $integration -or $selected[$_] } | ForEach-Object { $harnesses[$_] })
        $actual = @(Get-ChildItem "$env:RUNNER_TEMP/windows-completion" -Recurse -Filter completed-harnesses.txt -ErrorAction SilentlyContinue |
          ForEach-Object { Get-Content $_.FullName })
        if ($actual.Count -ne $expected.Count -or ($expected.Count -and (Compare-Object $expected $actual))) {
          throw "Incomplete verification: completed=$($actual -join ',')"
        }
        "Verified $($expected.Count) selected harness invocations: $($actual -join ',')"
    - name: Remove completion check directories
      if: always()
      shell: pwsh
      run: |
        Remove-Item $env:WINDOWS_GATE_ROOT,"$env:RUNNER_TEMP/windows-completion" -Recurse -Force -ErrorAction SilentlyContinue
