name: Rust agent setup
description: >-
  Pinned Rust toolchain, protoc, a prebuilt or custom static ONNX Runtime as
  needed, downloaded dependencies, and verified persistent main target snapshots.
  Every Rust agent job (and future E2E jobs that build the binary) starts here.
  The custom static recipe runs for release targets; CI/dev builds download
  prebuilt binaries, including for the Windows compile check.

inputs:
  restore-cargo-target:
    description: Restore Cargo compilation caches; archive-only consumers need none.
    default: 'true'
  snapshot-profile:
    description: Cargo profile for the target snapshot lane.
    default: ""
  snapshot-features:
    description: Exact feature invocation for the target snapshot lane.
    default: ""
  snapshot-target:
    description: Explicit Cargo target triple, when cross compiling.
    default: ""
  save-cargo-cache:
    description: Save downloaded Cargo dependencies on main; consumers restore only.
    default: "true"
  artifact-cache-platform:
    description: Native producer platform for the persistent target snapshot.
    default: ""
  artifact-cache-kind:
    description: Native production, debug workspace, or release E2E cache.
    default: native
  components:
    description: Extra rustup components, comma separated (for example "clippy").
    required: false
    default: ""
  native-deps:
    description: >-
      "protoc" for checks that do not link ORT, "prebuilt-ort" for CI/dev
      builds, or "static-ort" for release builds.
    required: true
  cache-workspace-crates:
    description: Compatibility input; complete target snapshots always retain workspace libraries.
    default: "false"
  cache-key:
    description: Compatibility input; downloads share the native-deps namespace.
    required: true
  cargo-target-dir:
    description: Cargo build directory relative to the Rust workspace for caching.
    required: false
    default: "target"
  prepared-static-ort:
    description: Require a restored static runtime instead of building one in this job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # SDK and Cargo snapshot identities must observe the selected Windows toolset.
    - uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
      with:
        arch: x64
    - uses: ./.github/actions/setup-oras
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.99.0
        components: ${{ inputs.components }}

    - name: Keep generated bytecode out of Cargo source inputs
      shell: bash
      run: echo 'PYTHONDONTWRITEBYTECODE=1' >> "$GITHUB_ENV"

    - name: Set up Python for the ORT recipe
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # The Lance build scripts need protoc. CI uses the pinned compiler tool
    # without compiling ONNX Runtime from source.
    - name: Prepare pinned protoc
      if: inputs.native-deps == 'protoc' || inputs.native-deps == 'prebuilt-ort'
      shell: bash
      working-directory: packages/butler-agent/rust
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/ort-cache
      run: |
        set -euo pipefail
        prepared="$(python scripts/prepare-static-ort.py --protoc-only)"
        echo "PROTOC=$(jq -r .protoc <<<"$prepared")" >> "$GITHUB_ENV"

    - name: Configure downloaded ONNX Runtime cache
      if: inputs.native-deps == 'prebuilt-ort'
      shell: bash
      env:
        ORT_BINARY_CACHE: ${{ runner.temp }}/ort-download-cache
      run: |
        mkdir -p "$ORT_BINARY_CACHE"
        echo "ORT_CACHE_DIR=$ORT_BINARY_CACHE" >> "$GITHUB_ENV"

    - name: Create downloaded ONNX Runtime cache directory
      if: inputs.native-deps != 'prebuilt-ort'
      shell: bash
      env:
        ORT_BINARY_CACHE: ${{ runner.temp }}/ort-download-cache
      run: mkdir -p "$ORT_BINARY_CACHE"

    # Stable key covers pinned inputs, flags, target and the complete recipe.
    - name: Fingerprint static ONNX Runtime
      if: inputs.native-deps == 'static-ort'
      id: ort
      shell: bash
      working-directory: packages/butler-agent/rust
      run: echo "fingerprint=$(python scripts/prepare-static-ort.py --fingerprint)" >> "$GITHUB_OUTPUT"

    - name: Prepare pinned static ONNX Runtime and protoc
      if: inputs.native-deps == 'static-ort'
      shell: bash
      working-directory: packages/butler-agent/rust
      env:
        GH_TOKEN: ${{ github.token }}
        ORT_CACHE_TARGET: ${{ runner.temp }}/ort-cache
        PREPARED_STATIC_ORT: ${{ inputs.prepared-static-ort }}
        ORT_FINGERPRINT: ${{ steps.ort.outputs.fingerprint }}
      run: |
        set -euo pipefail
        if [ "$PREPARED_STATIC_ORT" = "true" ] && [ ! -f "$ORT_CACHE_TARGET/native-deps/ort-$ORT_FINGERPRINT/complete.json" ]; then
          echo 'Prepared SDK toolset key differs; resolving this runner SDK or building locally.' >&2
        fi
        sdk_args=()
        if [ "$RUNNER_OS" != "Windows" ]; then sdk_args+=(--require-prebuilt); fi
        prepared="$(CARGO_TARGET_DIR="$ORT_CACHE_TARGET" python scripts/prepare-static-ort.py "${sdk_args[@]}")"
        echo "$prepared"
        {
          echo "ORT_LIB_PATH=$(jq -r .ort_lib_path <<<"$prepared")"
          echo "PROTOC=$(jq -r .protoc <<<"$prepared")"
          echo "ORT_PREFER_DYNAMIC_LINK=0"
          echo "ORT_SKIP_DOWNLOAD=1"
        } >> "$GITHUB_ENV"

    - name: Use mold on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y mold
        echo 'RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"

    - name: Configure Windows snapshot compiler flags
      if: runner.os == 'Windows' && inputs.snapshot-target != ''
      shell: bash
      env:
        SNAPSHOT_PROFILE: ${{ inputs.snapshot-profile }}
      run: |
        echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
        if [ "$SNAPSHOT_PROFILE" = release ]; then
          echo 'CARGO_PROFILE_RELEASE_LTO=thin' >> "$GITHUB_ENV"
          echo 'CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1' >> "$GITHUB_ENV"
        fi

    # The quota-limited cache holds downloaded dependencies only. Persistent
    # target outputs have one verified restore path, from verified GHCR OCI artifacts.
    - name: Cache Cargo downloads
      if: inputs.restore-cargo-target == 'true'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/butler-agent/rust -> ${{ inputs.cargo-target-dir }}
        shared-key: downloads-${{ inputs.native-deps }}
        cache-targets: false
        cache-bin: false
        cache-directories: ${{ runner.temp }}/ort-download-cache
        save-if: ${{ github.ref == 'refs/heads/main' && inputs.save-cargo-cache == 'true' }}
        cache-on-failure: false

    - name: Select Cargo target snapshot lane
      shell: bash
      env:
        SNAPSHOT_PLATFORM: ${{ inputs.artifact-cache-platform || (runner.os == 'Windows' && 'windows-x64' || runner.os == 'macOS' && 'darwin-arm64' || runner.arch == 'ARM64' && 'linux-arm64' || 'linux-x64') }}
        SNAPSHOT_PROFILE: ${{ inputs.snapshot-profile || (inputs.artifact-cache-kind == 'dev' && 'debug' || 'release') }}
        SNAPSHOT_FEATURES: ${{ inputs.snapshot-features || (inputs.artifact-cache-kind == 'perf' && 'butler-e2e/defaults' || inputs.artifact-cache-kind == 'dev' && (inputs.native-deps == 'static-ort' && 'workspace-no-defaults,butler-agent/static-ort' || 'workspace-defaults') || format('butler-agent/{0}', inputs.native-deps)) }}
        SNAPSHOT_TARGET: ${{ inputs.snapshot-target }}
      run: |
        echo "TARGET_SNAPSHOT_PLATFORM=$SNAPSHOT_PLATFORM" >> "$GITHUB_ENV"
        echo "TARGET_SNAPSHOT_PROFILE=$SNAPSHOT_PROFILE" >> "$GITHUB_ENV"
        echo "TARGET_SNAPSHOT_FEATURES=$SNAPSHOT_FEATURES" >> "$GITHUB_ENV"
        if [ -n "$SNAPSHOT_TARGET" ]; then echo "CARGO_BUILD_TARGET=$SNAPSHOT_TARGET" >> "$GITHUB_ENV"; fi

    - name: Restore persistent main Cargo snapshot and validated source freshness
      if: inputs.restore-cargo-target == 'true'
      shell: bash
      working-directory: packages/butler-agent/rust
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_MODE: ${{ inputs.native-deps }}
        CACHE_KIND: ${{ inputs.artifact-cache-kind }}
      run: python3 "$GITHUB_WORKSPACE/.github/scripts/cargo-artifact-cache.py" restore "$TARGET_SNAPSHOT_PLATFORM" "$CACHE_MODE" "$CACHE_KIND"
