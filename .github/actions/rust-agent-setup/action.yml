name: Rust agent setup
description: >-
  Pinned Rust toolchain, protoc, a prebuilt or custom static ONNX Runtime as
  needed, and a Cargo cache keyed per job.
  Every Rust agent job (and future E2E jobs that build the binary) starts here.
  The custom static recipe runs for release targets; CI/dev builds download
  prebuilt binaries, including for the Windows compile check.

inputs:
  components:
    description: Extra rustup components, comma separated (for example "clippy").
    required: false
    default: ""
  native-deps:
    description: >-
      "protoc" for checks that do not link ORT, "prebuilt-ort" for CI/dev
      builds, or "static-ort" for release builds.
    required: true
  cache-key:
    description: The rust-cache shared key; one per job so caches do not evict each other.
    required: true
  prepared-static-ort:
    description: Require a restored static runtime instead of building one in this job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.91.0
        components: ${{ inputs.components }}

    - name: Set up Python for the ORT recipe
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    # The Lance build scripts need protoc. CI uses the pinned compiler tool
    # without compiling ONNX Runtime from source.
    - name: Prepare pinned protoc
      if: inputs.native-deps == 'protoc' || inputs.native-deps == 'prebuilt-ort'
      shell: bash
      working-directory: packages/butler-agent/rust
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/ort-cache
      run: |
        set -euo pipefail
        prepared="$(python scripts/prepare-static-ort.py --protoc-only)"
        echo "PROTOC=$(jq -r .protoc <<<"$prepared")" >> "$GITHUB_ENV"

    - name: Configure downloaded ONNX Runtime cache
      if: inputs.native-deps == 'prebuilt-ort'
      shell: bash
      env:
        ORT_BINARY_CACHE: ${{ runner.temp }}/ort-download-cache
      run: |
        mkdir -p "$ORT_BINARY_CACHE"
        echo "ORT_CACHE_DIR=$ORT_BINARY_CACHE" >> "$GITHUB_ENV"

    - name: Create downloaded ONNX Runtime cache directory
      if: inputs.native-deps != 'prebuilt-ort'
      shell: bash
      env:
        ORT_BINARY_CACHE: ${{ runner.temp }}/ort-download-cache
      run: mkdir -p "$ORT_BINARY_CACHE"

    # The recipe's own fingerprint (target lock inputs, script, toolchain,
    # compiler/SDK, Python) is the cache key, one per target, so a runner
    # image update that changes none of them still hits the cache.
    - name: Fingerprint static ONNX Runtime
      if: inputs.native-deps == 'static-ort'
      id: ort
      shell: bash
      working-directory: packages/butler-agent/rust
      run: echo "fingerprint=$(python scripts/prepare-static-ort.py --fingerprint)" >> "$GITHUB_OUTPUT"

    - name: Restore static ONNX Runtime cache
      if: inputs.native-deps == 'static-ort' && inputs.prepared-static-ort != 'true'
      id: ort-cache
      uses: actions/cache/restore@v4
      with:
        # Outside the Cargo target so rust-cache and `cargo clean` never touch it.
        path: ${{ runner.temp }}/ort-cache/native-deps
        key: static-ort-${{ runner.os }}-${{ runner.arch }}-${{ steps.ort.outputs.fingerprint }}

    - name: Prepare pinned static ONNX Runtime and protoc
      if: inputs.native-deps == 'static-ort'
      shell: bash
      working-directory: packages/butler-agent/rust
      env:
        ORT_CACHE_TARGET: ${{ runner.temp }}/ort-cache
        PREPARED_STATIC_ORT: ${{ inputs.prepared-static-ort }}
        ORT_FINGERPRINT: ${{ steps.ort.outputs.fingerprint }}
      run: |
        set -euo pipefail
        if [ "$PREPARED_STATIC_ORT" = "true" ] && [ ! -f "$ORT_CACHE_TARGET/native-deps/ort-$ORT_FINGERPRINT/complete.json" ]; then
          echo 'Prepared static runtime does not match this runner toolchain/compiler image.' >&2
          exit 1
        fi
        prepared="$(CARGO_TARGET_DIR="$ORT_CACHE_TARGET" python scripts/prepare-static-ort.py)"
        echo "$prepared"
        {
          echo "ORT_LIB_PATH=$(jq -r .ort_lib_path <<<"$prepared")"
          echo "PROTOC=$(jq -r .protoc <<<"$prepared")"
          echo "ORT_PREFER_DYNAMIC_LINK=0"
          echo "ORT_SKIP_DOWNLOAD=1"
        } >> "$GITHUB_ENV"

    - name: Save static ONNX Runtime cache
      if: inputs.native-deps == 'static-ort' && inputs.prepared-static-ort != 'true' && steps.ort-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/ort-cache/native-deps
        key: ${{ steps.ort-cache.outputs.cache-primary-key }}

    - name: Cache Cargo build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: packages/butler-agent/rust
        shared-key: ${{ inputs.cache-key }}-${{ inputs.native-deps }}
        cache-directories: ${{ runner.temp }}/ort-download-cache
        cache-on-failure: true
