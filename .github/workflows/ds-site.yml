name: DS site

# Builds and checks the static Butler Design System viewer (leak check and smoke).
# It does not deploy: the viewer ships at https://butler.hexpy.games/ds/ from site.yml,
# the repository's one GitHub Pages deployment.

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "packages/butler-app/client/ui/**"
      - "tests/smoke/ds-site-*.ts"
      - "LICENSE"
      - ".github/workflows/ds-site.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ds-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/butler-app/client/ui/package-lock.json

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts

      - name: Build the DS site
        run: npm --prefix packages/butler-app/client/ui run build:ds-site

      - name: Leak check
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" bun run tests/smoke/ds-site-leak-check.ts

      - name: Font assets (slices, url() targets, OFL notices)
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" bun run tests/smoke/font-assets-check.ts packages/butler-app/client/ui/dist-ds-site

      - name: Share browser assets with isolated checks
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/playwright" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Smoke (overview + deep links, no foreign requests)
        timeout-minutes: 5
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" bun run tests/smoke/ds-site-smoke.ts

      # Sub-path build (/ds/), the one site.yml deploys at butler.hexpy.games/ds/.
      - name: Build the DS site under /ds/
        run: npm --prefix packages/butler-app/client/ui run build:ds-site:ds

      - name: Leak check (/ds/)
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" bun run tests/smoke/ds-site-leak-check.ts packages/butler-app/client/ui/dist-ds-site-ds

      - name: Font assets (/ds/)
        env:
          DS_SITE_BASE: /ds/
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" bun run tests/smoke/font-assets-check.ts packages/butler-app/client/ui/dist-ds-site-ds

      - name: Smoke (/ds/)
        timeout-minutes: 5
        env:
          DS_SITE_BASE: /ds/
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" bun run tests/smoke/ds-site-smoke.ts
