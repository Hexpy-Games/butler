name: DS site

# Publishes the Butler Design System viewer as a static site on GitHub Pages
# (https://butler-design.hexpy.games). Independent of the Rust and app release workflows.
# Pull requests only build and check; pushes to main (and manual runs) also deploy.

on:
  push:
    branches: [main]
    paths:
      - "packages/butler-app/client/ui/**"
      - "tests/smoke/ds-site-*.ts"
      - "LICENSE"
      - ".github/workflows/ds-site.yml"
  pull_request:
    paths:
      - "packages/butler-app/client/ui/**"
      - "tests/smoke/ds-site-*.ts"
      - "LICENSE"
      - ".github/workflows/ds-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ds-site-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/butler-app/client/ui/package-lock.json

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          npm --prefix packages/butler-app/client/ui ci

      - name: Build the DS site
        run: npm --prefix packages/butler-app/client/ui run build:ds-site

      - name: Leak check
        run: bun run tests/smoke/ds-site-leak-check.ts

      - name: Font assets (slices, url() targets, OFL notices)
        run: bun run tests/smoke/font-assets-check.ts packages/butler-app/client/ui/dist-ds-site

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Smoke (overview + deep links, no foreign requests)
        timeout-minutes: 5
        run: bun run tests/smoke/ds-site-smoke.ts

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/butler-app/client/ui/dist-ds-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
