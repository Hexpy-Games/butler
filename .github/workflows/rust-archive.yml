name: Shared Rust archive
on:
  workflow_call:
    inputs:
      runner:
        type: string
        default: ubuntu-24.04
      platform:
        type: string
        default: linux-x64
      clippy:
        type: boolean
        default: false
      ort-mode:
        type: string
        default: prebuilt-ort
permissions:
  contents: read
  actions: read
jobs:
  build:
    name: Build archives (${{ inputs.platform }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "8"
      BUTLER_MEMORY_IMPLEMENTATION_COMMIT: ${{ github.sha }}
      # Read-only build provenance must not refresh the index it tracks.
      GIT_OPTIONAL_LOCKS: "0"
    defaults:
      run:
        working-directory: packages/butler-agent/rust
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-agent-setup
        with:
          components: clippy
          native-deps: ${{ inputs.ort-mode }}
          cache-key: archive-${{ inputs.platform }}
          cache-workspace-crates: "true"
          artifact-cache-platform: ${{ inputs.platform }}
          artifact-cache-kind: dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # These four libraries allow panic/unwrap/expect and dead-code lints
      # under test-support. --all-targets enables it through dev dependencies;
      # retain their feature-free production check. Other ordinary libraries
      # and binaries are covered by the workspace all-targets invocation.
      - name: Clippy strict production libraries and all targets
        if: inputs.clippy
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo clippy -p butler-turn -p butler-models -p butler-runtime -p butler-ledger --lib --locked --keep-going -- -D warnings
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Build the complete workspace once
        env:
          ORT_MODE: ${{ inputs.ort-mode }}
          BUILD_VERSION_REF: ${{ github.event_name == 'pull_request' && 'v0.1.0-preview.99' || github.ref_name }}
        run: |
          export GITHUB_REF_NAME="$BUILD_VERSION_REF"
          args=()
          if [ "$ORT_MODE" = static-ort ]; then
            args=(--no-default-features --features butler-agent/static-ort)
          fi
          mkdir -p "$RUNNER_TEMP/rust-archive"
          # nextest builds test harnesses, not the Agent CLI. Build all targets
          # together so the ordinary Agent and every test share dependencies.
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo build --workspace --all-targets --locked -j 8 "${args[@]}"
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo nextest archive --workspace --all-targets --locked "${args[@]}" --archive-file "$RUNNER_TEMP/rust-archive/tests.tar.zst"
      - name: Archive tests and record every selection
        env:
          ORT_MODE: ${{ inputs.ort-mode }}
          BUILD_VERSION_REF: ${{ github.event_name == 'pull_request' && 'v0.1.0-preview.99' || github.ref_name }}
        run: |
          export GITHUB_REF_NAME="$BUILD_VERSION_REF"
          isolate="$GITHUB_WORKSPACE/.github/scripts/isolated.py"
          args=(--archive-file "$RUNNER_TEMP/rust-archive/tests.tar.zst" --workspace-remap "$PWD")
          python3 "$isolate" cargo nextest list "${args[@]}" --message-format json > "$RUNNER_TEMP/rust-archive/list.json"
          perf_filter="$(python3 "$GITHUB_WORKSPACE/.github/scripts/e2e-perf-filter.py")"
          python3 "$isolate" cargo nextest list "${args[@]}" --message-format json -E "package(=butler-e2e) and ($perf_filter)" > "$RUNNER_TEMP/rust-archive/perf-list.json"
          python3 "$GITHUB_WORKSPACE/.github/scripts/balance-e2e.py" "$RUNNER_TEMP/rust-archive/list.json" "$RUNNER_TEMP/rust-archive" "$RUNNER_TEMP/rust-archive/perf-list.json"
          python3 "$isolate" python3 "$GITHUB_WORKSPACE/.github/scripts/test-ci-invariants.py" "$RUNNER_TEMP/rust-archive"
          cp target/debug/butler-agent "$RUNNER_TEMP/rust-archive/butler-agent"
      - name: Run doctests when present
        env:
          ORT_MODE: ${{ inputs.ort-mode }}
          BUILD_VERSION_REF: ${{ github.event_name == 'pull_request' && 'v0.1.0-preview.99' || github.ref_name }}
        run: |
          export GITHUB_REF_NAME="$BUILD_VERSION_REF"
          args=()
          if [ "$ORT_MODE" = static-ort ]; then
            args=(--no-default-features --features butler-agent/static-ort)
          fi
          if grep -rqE '^[[:space:]]*//[/!][[:space:]]*```' crates; then
            python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --workspace --doc --locked -j 8 "${args[@]}"
          fi
      - name: Record native Agent provenance
        env:
          PLATFORM: ${{ inputs.platform }}
          ORT_MODE: ${{ inputs.ort-mode }}
          RELEASE_VERSION: ${{ github.event_name == 'pull_request' && '0.1.0-preview.99' || github.ref_name }}
        run: |
          version="$RELEASE_VERSION"
          if [[ "$version" != v[0-9]* && "$version" != 0.1.0-preview.99 ]]; then version=0.1.0-dev; fi
          version="${version#v}"
          python3 "$GITHUB_WORKSPACE/.github/scripts/agent-provenance.py" record "$RUNNER_TEMP/rust-archive" "$PLATFORM" "$ORT_MODE" dev "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: rust-${{ inputs.platform }}
          path: ${{ runner.temp }}/rust-archive/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 1
      - name: Preserve successful Cargo outputs outside the shared cache quota
        id: cargo-cache
        env:
          CACHE_PLATFORM: ${{ inputs.platform }}
          CACHE_MODE: ${{ inputs.ort-mode }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/cargo-artifact-cache.py" record "$CACHE_PLATFORM" "$CACHE_MODE" dev
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cargo-cache.outputs.name }}
          path: ${{ runner.temp }}/cargo-build-cache/*
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
