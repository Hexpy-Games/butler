name: Cargo target main lanes
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: cargo-target-main
  cancel-in-progress: false
jobs:
  build:
    name: Build target snapshot ${{ matrix.profile }} ${{ matrix.mode }} ${{ matrix.platform.owner && 'owner' || 'hosted' }} (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: linux-x64, runner: ubuntu-24.04}
          - {name: linux-arm64, runner: ubuntu-24.04-arm}
          - {name: darwin-arm64, runner: macos-15}
          - {name: windows-x64, runner: windows-latest}
        profile: [release, debug]
        mode: [prebuilt-ort, static-ort]
        include:
          - platform: {name: windows-x64, runner: windows-latest}
            profile: ci-fast
            mode: static-ort
          - platform: {name: linux-x64, runner: ubuntu-24.04}
            profile: release
            mode: protoc
            kind: perf
          - platform: {name: linux-arm64, runner: ubuntu-24.04-arm}
            profile: release
            mode: protoc
            kind: perf
          - platform: {name: darwin-arm64, runner: macos-15}
            profile: release
            mode: protoc
            kind: perf
          - platform: {name: windows-x64, runner: [self-hosted, butler-win], owner: true}
            profile: ci-fast
            mode: static-ort
          - platform: {name: windows-x64, runner: [self-hosted, butler-win], owner: true}
            profile: debug
            mode: static-ort
    env:
      CARGO_BUILD_JOBS: '8'
      TARGET_SNAPSHOT_RUNNER_KIND: ${{ matrix.platform.owner && 'owner' || 'hosted' }}
      BUTLER_MEMORY_IMPLEMENTATION_COMMIT: ${{ github.sha }}
      CARGO_TARGET_DIR: ${{ matrix.platform.name == 'windows-x64' && format('{0}/target/windows-release', github.workspace) || format('{0}/packages/butler-agent/rust/target', github.workspace) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      # One lane per host. Use the same verified setup as consumers.
      - uses: ./.github/actions/windows-owner-setup
        if: matrix.platform.owner == true
        with:
          workflow: windows-agent-v1
          require-prebuilt: 'true'
      - uses: ./.github/actions/rust-agent-setup
        if: matrix.platform.owner != true
        with:
          native-deps: ${{ matrix.mode }}
          artifact-cache-platform: ${{ matrix.platform.name }}
          artifact-cache-kind: ${{ matrix.kind || (matrix.profile == 'debug' && 'dev' || 'native') }}
          snapshot-profile: ${{ matrix.profile }}
          snapshot-target: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-msvc' || '' }}
          cache-key: target-main
          save-cargo-cache: 'false'
      - name: Build and record the profile and feature lane
        id: lane
        working-directory: packages/butler-agent/rust
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_PLATFORM: ${{ matrix.platform.name }}
          SNAPSHOT_PROFILE: ${{ matrix.profile }}
          SNAPSHOT_MODE: ${{ matrix.mode }}
          SNAPSHOT_KIND: ${{ matrix.kind || (matrix.profile == 'debug' && 'dev' || 'native') }}
        run: python "$GITHUB_WORKSPACE/.github/scripts/isolated.py" python "$GITHUB_WORKSPACE/.github/scripts/cargo-target-lanes.py"
      - name: Upload successful lane snapshots for the restricted publisher
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.lane.outputs.name }}
          path: ${{ runner.temp }}/cargo-build-cache/*
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
      - name: Upload every lane's Cargo build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-target-main-${{ matrix.platform.name }}-${{ matrix.profile }}-${{ matrix.mode }}-${{ matrix.platform.owner && 'owner' || 'hosted' }}
          path: ${{ runner.temp }}/cargo-target-timings/**/*.html
          retention-days: 14
          if-no-files-found: error
      - name: Verify owner registration and clean the isolated job profile
        if: always() && matrix.platform.owner == true
        shell: pwsh
        run: ./deploy/windows-owner-cleanup.ps1
