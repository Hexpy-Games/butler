name: E2E

# Real-binary end-to-end scenarios (packages/butler-agent/rust/crates/butler-e2e).
# - Linux/macOS stub tiers consume the shared archives inside rust-quality.yml.
# - e2e-live: once per release push, or on demand on a release branch.
#   Missing credentials fail closed and block the tag.

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      workflow: e2e.yml

  e2e-live:
    needs: changes
    if: needs.changes.outputs.tier == 'integration'
    name: E2E live tier
    runs-on: macos-latest
    timeout-minutes: 150
    environment: live-e2e
    defaults:
      run:
        working-directory: packages/butler-agent/rust
    env:
      BUTLER_E2E_PROVIDER: openai-subscription
      BUTLER_E2E_MODEL: openai/gpt-6-luna@max
      BUTLER_E2E_MODEL_MATRIX: openai/gpt-6-luna@max
      BUTLER_E2E_LIVE_MAX_TURNS: "40"
    steps:
      - name: Check for a live credential
        id: credential
        working-directory: ${{ github.workspace }}
        env:
          CODEX_AUTH_SECRET: ${{ secrets.BUTLER_E2E_CODEX_AUTH_JSON }}
          API_KEY_SECRET: ${{ secrets.BUTLER_E2E_API_KEY }}
        run: |
          if [ -n "$CODEX_AUTH_SECRET" ] || [ -n "$API_KEY_SECRET" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Live E2E credentials are required for integration"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.credential.outputs.available == 'true'

      - name: Set up Rust and prebuilt ONNX Runtime
        if: steps.credential.outputs.available == 'true'
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: prebuilt-ort
          cache-key: e2e

      - name: Install the credential
        if: steps.credential.outputs.available == 'true'
        env:
          CODEX_AUTH_SECRET: ${{ secrets.BUTLER_E2E_CODEX_AUTH_JSON }}
          API_KEY_SECRET: ${{ secrets.BUTLER_E2E_API_KEY }}
        run: |
          umask 077
          if [ -n "$CODEX_AUTH_SECRET" ]; then
            printf '%s' "$CODEX_AUTH_SECRET" > "$RUNNER_TEMP/codex-auth.json"
            echo "BUTLER_E2E_CODEX_AUTH_JSON=$RUNNER_TEMP/codex-auth.json" >> "$GITHUB_ENV"
          fi
          if [ -n "$API_KEY_SECRET" ]; then
            echo "::add-mask::$API_KEY_SECRET"
            echo "BUTLER_E2E_API_KEY_ENV=BUTLER_E2E_API_KEY_VALUE" >> "$GITHUB_ENV"
            echo "BUTLER_E2E_API_KEY_VALUE=$API_KEY_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Build the agent binary under test
        if: steps.credential.outputs.available == 'true'
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo build --locked -p butler-agent --bin butler-agent

      - name: Run the live tier
        if: steps.credential.outputs.available == 'true'
        env:
          BUTLER_E2E_TIER: live
          BUTLER_E2E_SKIP_BUILD: "1"
          BUTLER_E2E_REPORT: ${{ runner.temp }}/e2e-live-report.txt
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --locked -p butler-e2e --test e2e live:: -- --ignored --test-threads=1

      - name: Summarize
        if: always() && steps.credential.outputs.available == 'true'
        run: |
          {
            echo "### E2E live tier ($BUTLER_E2E_PROVIDER, $BUTLER_E2E_MODEL)"
            sed 's/^/    /' "$RUNNER_TEMP/e2e-live-report.txt" 2>/dev/null || echo "no report"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the credential
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/codex-auth.json"
