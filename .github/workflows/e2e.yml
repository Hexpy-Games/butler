name: E2E

# Real-binary end-to-end scenarios (packages/butler-agent/rust/crates/butler-e2e).
# - Linux/macOS stub tiers consume the shared archives inside rust-quality.yml.
# - e2e-live: once per release push, or on demand on a release branch.
#   Missing credentials fail closed and block the tag.

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      record_cassettes:
        description: Record the LIVE-09 baseline on the owner integration runner
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      workflow: e2e.yml

  e2e-live:
    needs: changes
    # Explicit recording dispatch is an integration operation, never PR smoke.
    if: needs.changes.outputs.tier == 'integration' || (github.event_name == 'workflow_dispatch' && inputs.record_cassettes)
    name: E2E live tier
    runs-on: [self-hosted, Windows, X64, butler-win]
    timeout-minutes: 150
    environment: live-e2e
    concurrency:
      group: butler-live-e2e-oauth-profile
      cancel-in-progress: false
    defaults:
      run:
        working-directory: packages/butler-agent/rust
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
    env:
      BUTLER_E2E_PROVIDER: openai-subscription
      BUTLER_E2E_MODEL: openai/gpt-6-luna@max
      BUTLER_E2E_MODEL_MATRIX: openai/gpt-6-luna@max
      BUTLER_E2E_LIVE_MAX_TURNS: "40"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/windows-owner-setup
        with:
          workflow: e2e-live

      - name: Install the live credential
        id: credential
        working-directory: ${{ github.workspace }}
        env:
          RECORD_CASSETTES: ${{ github.event_name == 'workflow_dispatch' && inputs.record_cassettes }}
          CODEX_AUTH_SECRET: ${{ secrets.BUTLER_E2E_CODEX_AUTH_JSON }}
          API_KEY_SECRET: ${{ secrets.BUTLER_E2E_API_KEY }}
        run: |
          $profile = Join-Path $env:USERPROFILE '.butler-e2e-auth/auth.json'
          if ($env:RECORD_CASSETTES -eq 'true' -and !(Test-Path -LiteralPath $profile -PathType Leaf)) {
            throw 'Cassette recording requires the persistent owner OAuth profile'
          }
          if (Test-Path -LiteralPath $profile -PathType Leaf) {
            # Mask before exporting; the dedicated file is refreshed in place.
            Write-Output "::add-mask::$profile"
            Write-Output 'Persistent live OAuth profile exists'
            "BUTLER_E2E_CODEX_AUTH_JSON=$profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($env:CODEX_AUTH_SECRET) {
            $path = Join-Path $env:OWNER_JOB_ROOT 'codex-auth.json'
            [IO.File]::WriteAllText($path, $env:CODEX_AUTH_SECRET, (New-Object Text.UTF8Encoding($false)))
            "BUTLER_E2E_CODEX_AUTH_JSON=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($env:API_KEY_SECRET) {
            Write-Output "::add-mask::$env:API_KEY_SECRET"
            @('BUTLER_E2E_PROVIDER=openai', 'BUTLER_E2E_API_KEY_ENV=BUTLER_E2E_API_KEY_VALUE',
              "BUTLER_E2E_API_KEY_VALUE=$env:API_KEY_SECRET") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Output '::error::Live E2E requires credentials. One-time PowerShell setup: $env:CODEX_HOME = "$HOME\.butler-e2e-auth"; npx -y @openai/codex login'
            exit 1
          }
          'available=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore Windows debug snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SNAPSHOT_PROFILE: debug
          TARGET_SNAPSHOT_FEATURES: workspace-no-defaults,butler-agent/static-ort
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/cargo-artifact-cache.py" restore windows-x64 static-ort dev
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the agent binary under test
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo build --timings -j 8 --locked --no-default-features --features static-ort --target x86_64-pc-windows-msvc -p butler-agent --bin butler-agent
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUTLER_E2E_BIN=$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/butler-agent.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Cargo build timings
        if: ${{ always() && steps.credential.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-e2e-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.CARGO_TARGET_DIR }}/cargo-timings/*.html
          if-no-files-found: error
          retention-days: 14

      - name: Inspect the dedicated profile gate
        if: github.event_name == 'workflow_dispatch' && inputs.record_cassettes
        run: |
          $path = $env:BUTLER_E2E_CODEX_AUTH_JSON + '.lock'
          if (Test-Path -LiteralPath $path) {
            $item = Get-Item -LiteralPath $path -Force
            "OAuth gate: directory=$($item.PSIsContainer) attributes=$($item.Attributes)"
            $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User
            $acl = Get-Acl -LiteralPath $path
            "OAuth gate: owner_is_runner=$($acl.GetOwner([Security.Principal.SecurityIdentifier]).Value -eq $sid.Value)"
            try {
              $file = [IO.File]::Open($path, [IO.FileMode]::Open, [IO.FileAccess]::ReadWrite, [IO.FileShare]'ReadWrite, Delete')
              try { $file.Lock(0, [long]::MaxValue); 'OAuth gate: open and lock succeeded' }
              finally { $file.Dispose() }
            } catch { "OAuth gate: open/lock HRESULT=$($_.Exception.HResult)" }
          } else { 'OAuth gate: missing' }

      - name: Verify both provider stream orders with stub replay
        if: github.event_name != 'workflow_dispatch' || !inputs.record_cassettes
        env:
          BUTLER_E2E_TIER: stub
          BUTLER_E2E_RECORD: "0"
          BUTLER_E2E_SKIP_BUILD: "1"
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e stream_orders:: -- --test-threads=1
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify persistent profile refresh with a stub
        env:
          BUTLER_E2E_TIER: stub
          BUTLER_E2E_SKIP_BUILD: "1"
          BUTLER_E2E_RECORD: "0"
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e setup_oauth::dedicated_codex_profile_refresh_survives_restart -- --test-threads=1
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the live tier
        env:
          BUTLER_E2E_RECORD: ${{ github.event_name == 'workflow_dispatch' && inputs.record_cassettes && '1' || '0' }}
          BUTLER_E2E_RECORD_OUTPUT: ${{ env.OWNER_JOB_ROOT }}/recorded-cassettes/LIVE-09
          BUTLER_E2E_TIER: live
          BUTLER_E2E_SKIP_BUILD: "1"
          BUTLER_E2E_REPORT: ${{ env.OWNER_JOB_ROOT }}/e2e-live-report.txt
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          # Diagnose access to the sibling gate without locking or modifying
          # the persistent profile, exposing paths, ACL identities or tokens.
          $gate = "$env:BUTLER_E2E_CODEX_AUTH_JSON.lock"
          Write-Output "::add-mask::$gate"
          if (Test-Path -LiteralPath $gate -PathType Leaf) {
            foreach ($access in @([IO.FileAccess]::Read, [IO.FileAccess]::ReadWrite)) {
              try {
                $handle = [IO.File]::Open($gate, [IO.FileMode]::Open, $access,
                  ([IO.FileShare]::ReadWrite -bor [IO.FileShare]::Delete))
                $handle.Dispose()
                Write-Output "OAuth gate open: access=$access accepted=true"
              } catch {
                $cause = $_.Exception
                while ($cause.InnerException) { $cause = $cause.InnerException }
                $code = $cause.HResult -band 0xffff
                Write-Output "OAuth gate open: access=$access accepted=false code=$code"
              }
            }
          }
          $ErrorActionPreference = 'Continue'
          $filter = 'live::'
          if ($env:BUTLER_E2E_RECORD -eq '1') { $filter = 'live::live_09_cassette_drift' }
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e $filter -- --ignored --test-threads=1
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify cassette scrub before upload
        if: success() && github.event_name == 'workflow_dispatch' && inputs.record_cassettes
        run: |
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" python "$env:GITHUB_WORKSPACE/.github/scripts/cassette-scrub.py" "$env:OWNER_JOB_ROOT/recorded-cassettes/LIVE-09"
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload recorded cassettes only
        if: success() && github.event_name == 'workflow_dispatch' && inputs.record_cassettes
        uses: actions/upload-artifact@v4
        with:
          name: live-09-cassettes
          path: ${{ env.OWNER_JOB_ROOT }}/recorded-cassettes/LIVE-09/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Summarize
        if: always() && steps.credential.outputs.available == 'true'
        run: |
          "### E2E live tier ($env:BUTLER_E2E_PROVIDER, $env:BUTLER_E2E_MODEL)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $report = Join-Path $env:OWNER_JOB_ROOT 'e2e-live-report.txt'
          if (Test-Path $report) {
            Get-Content $report | ForEach-Object { "    $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            'no report' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Check owner registration and remove job profile
        if: always() && env.OWNER_JOB_ROOT != ''
        working-directory: ${{ github.workspace }}
        run: ./deploy/windows-owner-cleanup.ps1
