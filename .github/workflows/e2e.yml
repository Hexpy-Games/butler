name: E2E

# Real-binary end-to-end scenarios (packages/butler-agent/rust/crates/butler-e2e).
# - Linux/macOS stub tiers consume the shared archives inside rust-quality.yml.
# - e2e-live: once per release push, or on demand on a release branch.
#   Missing credentials fail closed and block the tag.

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      workflow: e2e.yml

  e2e-live:
    needs: changes
    if: needs.changes.outputs.tier == 'integration'
    name: E2E live tier
    runs-on: [self-hosted, Windows, X64, butler-win, butler-win-release]
    timeout-minutes: 150
    environment: live-e2e
    concurrency:
      group: butler-live-e2e-oauth-profile
      cancel-in-progress: false
    defaults:
      run:
        working-directory: packages/butler-agent/rust
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
    env:
      # The live provider and model are `live-e2e` environment variables, so
      # switching providers is a settings change; an API-key provider's key
      # is the `BUTLER_E2E_API_KEY` secret.
      BUTLER_E2E_PROVIDER: ${{ vars.BUTLER_E2E_LIVE_PROVIDER }}
      BUTLER_E2E_MODEL: ${{ vars.BUTLER_E2E_LIVE_MODEL }}
      BUTLER_E2E_LIVE_MAX_TURNS: "40"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/windows-runner-setup
        with:
          workflow: e2e-live

      - name: Install the live credential
        id: credential
        working-directory: ${{ github.workspace }}
        env:
          API_KEY_SECRET: ${{ secrets.BUTLER_E2E_API_KEY }}
        run: |
          if (-not $env:BUTLER_E2E_PROVIDER) { Write-Output '::error::Set the live-e2e variable BUTLER_E2E_LIVE_PROVIDER'; exit 1 }
          if (-not $env:BUTLER_E2E_MODEL) { Write-Output '::error::Set the live-e2e variable BUTLER_E2E_LIVE_MODEL'; exit 1 }
          Write-Output "Live provider: $env:BUTLER_E2E_PROVIDER, model: $env:BUTLER_E2E_MODEL"
          $authDir = Join-Path $HOME '.butler-e2e-auth/auth'
          $profile = Join-Path $authDir 'chatgpt.json'
          if ($env:BUTLER_E2E_PROVIDER -ne 'openai-subscription') {
            if (-not $env:API_KEY_SECRET) {
              Write-Output '::error::Set the live-e2e secret BUTLER_E2E_API_KEY'
              exit 1
            }
            Write-Output "::add-mask::$env:API_KEY_SECRET"
            @('BUTLER_E2E_API_KEY_ENV=BUTLER_E2E_API_KEY_VALUE',
              "BUTLER_E2E_API_KEY_VALUE=$env:API_KEY_SECRET") | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif (Test-Path -LiteralPath $profile -PathType Leaf) {
            # Use the runner's registration in place; never copy rotating tokens.
            Write-Output "::add-mask::$authDir"
            Write-Output 'Persistent ChatGPT sign-in exists'
            "BUTLER_E2E_CHATGPT_AUTH_DIR=$authDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Output '::error::openai-subscription requires a one-time setup: butler auth login --data "$HOME\.butler-e2e-auth"'
            exit 1
          }
          'available=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore Windows debug snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SNAPSHOT_PROFILE: debug
          TARGET_SNAPSHOT_FEATURES: workspace-no-defaults,butler-agent/static-ort
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/cargo-artifact-cache.py" restore windows-x64 static-ort dev
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the agent binary under test
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo build --timings -j 8 --locked --no-default-features --features static-ort,butler-agent/e2e-fixtures,butler-platform/test-support --target x86_64-pc-windows-msvc -p butler-agent --bin butler-agent -p butler-platform --bin butler-sandbox
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "BUTLER_E2E_BIN=$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/butler-agent.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload Cargo build timings
        if: ${{ always() && steps.credential.outputs.available == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-e2e-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.CARGO_TARGET_DIR }}/cargo-timings/*.html
          if-no-files-found: error
          retention-days: 14

      - name: Verify both provider stream orders with stub replay
        env:
          BUTLER_E2E_TIER: stub
          BUTLER_E2E_RECORD: "0"
          BUTLER_E2E_SKIP_BUILD: "1"
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e stream_orders:: -- --test-threads=1
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify ChatGPT token refresh with a stub
        env:
          BUTLER_E2E_TIER: stub
          BUTLER_E2E_SKIP_BUILD: "1"
          BUTLER_E2E_RECORD: "0"
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e chatgpt_session::siwc_08_token_refresh_survives_restart -- --test-threads=1
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run the live tier
        env:
          BUTLER_E2E_RECORD: "0"
          BUTLER_E2E_TIER: live
          BUTLER_E2E_SKIP_BUILD: "1"
          BUTLER_E2E_REPORT: ${{ env.RUNNER_JOB_ROOT }}/e2e-live-report.txt
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          # Diagnose access to the sibling gate without locking or modifying
          # the persistent profile, exposing paths, ACL identities or tokens.
          if ($env:BUTLER_E2E_CHATGPT_AUTH_DIR) {
            $gate = Join-Path $env:BUTLER_E2E_CHATGPT_AUTH_DIR 'chatgpt.json.lock'
            Write-Output "::add-mask::$gate"
            if (Test-Path -LiteralPath $gate -PathType Leaf) {
              foreach ($access in @([IO.FileAccess]::Read, [IO.FileAccess]::ReadWrite)) {
                try {
                  $handle = [IO.File]::Open($gate, [IO.FileMode]::Open, $access,
                    ([IO.FileShare]::ReadWrite -bor [IO.FileShare]::Delete))
                  $handle.Dispose()
                  Write-Output "OAuth gate open: access=$access accepted=true"
                } catch {
                  $cause = $_.Exception
                  while ($cause.InnerException) { $cause = $cause.InnerException }
                  $code = $cause.HResult -band 0xffff
                  Write-Output "OAuth gate open: access=$access accepted=false code=$code"
                }
              }
            }
          }
          # Name the required contracts and the paired shop acceptance explicitly.
          # On-demand hedge evaluations keep their separate selection.
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e -- --ignored --test-threads=1 live::live_01_ live::live_02_ live::live_03_ live::live_04_ live::live_05_ live::live_06_ live::live_07_ live::live_08_ live::live_10_ live::live_siwc_ live::browse_shop::
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Summarize
        if: always() && steps.credential.outputs.available == 'true'
        run: |
          "### E2E live tier ($env:BUTLER_E2E_PROVIDER, $env:BUTLER_E2E_MODEL)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $report = Join-Path $env:RUNNER_JOB_ROOT 'e2e-live-report.txt'
          if (Test-Path $report) {
            Get-Content $report | ForEach-Object { "    $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            'no report' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Check runner registration and remove job profile
        if: always() && env.RUNNER_JOB_ROOT != ''
        working-directory: ${{ github.workspace }}
        run: ./deploy/windows-self-hosted-cleanup.ps1
