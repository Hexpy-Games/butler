name: Branch name
on:
  pull_request:
permissions:
  contents: read
jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PR head branch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/branch-name.py "$HEAD_BRANCH"
