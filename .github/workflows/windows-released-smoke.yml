name: Verify published Windows preview
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      from-tag:
        type: string
        default: ''
    secrets:
      BUTLER_E2E_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Published preview tag to install
        required: true
        type: string
      from-tag:
        description: Published baseline to update through the real published feed
        required: false
        type: string
permissions:
  contents: read
jobs:
  verify:
    name: Install and use the released Windows asset
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download, verify, install and recover legacy data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v0\.1\.0-preview\.\d+$') { throw 'Expected a preview tag' }
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory $profile | Out-Null
          $env:HOME = Join-Path $profile 'home'
          $env:BUTLER_DATA = Join-Path $profile 'data'
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            $assets = Join-Path $profile 'assets'
            gh release download $env:RELEASE_TAG --dir $assets --pattern 'ButlerSetup-*-x64.exe*' --pattern '*-windows-x64-portable.zip*'
            if ($LASTEXITCODE) { throw 'Released asset download failed' }
            bun install --frozen-lockfile --ignore-scripts
            if ($LASTEXITCODE) { throw 'Dependency installation failed' }
            bun run packages/butler-app/scripts/windows/released-install-smoke.ts $assets $env:RELEASE_TAG
            if ($LASTEXITCODE) { throw 'Published installer smoke failed' }
            $archive = @(Get-ChildItem $assets/*-windows-x64-portable.zip)
            if ($archive.Count -ne 1) { throw 'Expected one released portable archive' }
            $expected = (Get-Content ($archive[0].FullName + '.sha256')).Split(' ')[0]
            if ((Get-FileHash $archive[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Portable checksum mismatch' }
            Expand-Archive $archive[0].FullName (Join-Path $profile 'portable')
            bun run packages/butler-app/scripts/windows/legacy-data-smoke.ts (Join-Path $profile 'portable/Butler-win32-x64/Butler.exe')
            if ($LASTEXITCODE) { throw 'Published legacy-data recovery smoke failed' }
          } finally { Remove-Item -Recurse -Force $profile }
      - name: Update the published baseline through the published manifest and nupkg
        if: inputs.from-tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          BASELINE_TAG: ${{ inputs.from-tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($tag in @($env:RELEASE_TAG,$env:BASELINE_TAG)) {
            if ($tag -notmatch '^v0\.1\.0-preview\.\d+$') { throw 'Expected preview tags' }
          }
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          $env:HOME = Join-Path $profile 'home'
          $env:BUTLER_DATA = Join-Path $profile 'data'
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            $baseline = Join-Path $profile 'baseline'
            $candidate = Join-Path $profile 'candidate'
            gh release download $env:BASELINE_TAG --dir $baseline --pattern 'ButlerSetup-*-x64.exe*'
            if ($LASTEXITCODE) { throw 'Baseline installer download failed' }
            gh release download $env:RELEASE_TAG --dir $candidate --pattern 'app-update-manifest.json' --pattern 'RELEASES' --pattern '*-full.nupkg'
            if ($LASTEXITCODE) { throw 'Published update feed download failed' }
            bun install --frozen-lockfile --ignore-scripts
            if ($LASTEXITCODE) { throw 'Dependency installation failed' }
            $env:BUTLER_WINDOWS_SMOKE_FROM = $env:BASELINE_TAG.Substring(1)
            $env:BUTLER_WINDOWS_SMOKE_TO = $env:RELEASE_TAG.Substring(1)
            $env:BUTLER_WINDOWS_SMOKE_MANIFEST = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/app-update-manifest.json"
            bun run packages/butler-app/scripts/windows/installer-smoke.ts $baseline $candidate
            if ($LASTEXITCODE) { throw 'Published preview update failed' }
          } finally { Remove-Item -Recurse -Force $profile }

  # The uncached debug harness build takes about 15 minutes on a hosted
  # runner. It needs no credentials, so it runs beside the install check and
  # the live job spends its own budget on the turn alone.
  harness:
    name: Build the E2E harness for the released live chat
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: protoc
          cache-key: released-windows-live
      - name: Compile the existing E2E harness
        shell: pwsh
        working-directory: packages/butler-agent/rust
        run: |
          $ErrorActionPreference = 'Stop'
          $messages = python ../../../.github/scripts/isolated.py cargo test --locked -p butler-e2e --test e2e --no-run --message-format=json
          if ($LASTEXITCODE) { throw 'E2E harness build failed' }
          $executables = @($messages | ForEach-Object { $_ | ConvertFrom-Json } | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'e2e' -and $_.profile.test } | ForEach-Object executable)
          if ($executables.Count -ne 1) { throw 'Expected one E2E harness executable' }
          $out = Join-Path $env:RUNNER_TEMP 'released-live-harness'
          New-Item -ItemType Directory $out | Out-Null
          Copy-Item $executables[0] (Join-Path $out 'e2e.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: released-windows-live-harness
          path: ${{ runner.temp }}/released-live-harness/e2e.exe
          retention-days: 1
          if-no-files-found: error

  real-chat:
    name: Released Windows real folder chat (live model)
    needs: harness
    runs-on: windows-latest
    environment: live-e2e
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: released-windows-live-harness
          path: ${{ runner.temp }}/released-live-harness
      - name: Verify and use the published Agent for one real folder turn
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          API_KEY_SECRET: ${{ secrets.BUTLER_E2E_API_KEY }}
          BUTLER_E2E_PROVIDER: ${{ vars.BUTLER_E2E_LIVE_PROVIDER }}
          BUTLER_E2E_MODEL: ${{ vars.BUTLER_E2E_LIVE_MODEL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v0\.1\.0-preview\.\d+$') { throw 'Expected a preview tag' }
          if (!$env:BUTLER_E2E_PROVIDER) { throw 'Set the live-e2e variable BUTLER_E2E_LIVE_PROVIDER' }
          if (!$env:BUTLER_E2E_MODEL) { throw 'Set the live-e2e variable BUTLER_E2E_LIVE_MODEL' }
          $subscription = $env:BUTLER_E2E_PROVIDER -eq 'openai-subscription'
          $authDir = Join-Path $HOME '.butler-e2e-auth/auth'
          if ($subscription -and !(Test-Path -LiteralPath (Join-Path $authDir 'chatgpt.json') -PathType Leaf)) {
            throw 'openai-subscription needs a one-time setup: butler auth login --data "$HOME\.butler-e2e-auth"'
          }
          if (!$subscription -and !$env:API_KEY_SECRET) { throw 'Set the live-e2e secret BUTLER_E2E_API_KEY' }
          Write-Output "Live provider: $env:BUTLER_E2E_PROVIDER, model: $env:BUTLER_E2E_MODEL"
          $root = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory $root | Out-Null
          try {
            $assets = Join-Path $root 'assets'
            gh release download $env:RELEASE_TAG --dir $assets --pattern 'butler-agent-*-windows-x64.zip*'
            if ($LASTEXITCODE) { throw 'Released Agent download failed' }
            $archive = @(Get-ChildItem $assets/*-windows-x64.zip)
            if ($archive.Count -ne 1) { throw 'Expected one released Agent archive' }
            $expected = (Get-Content ($archive[0].FullName + '.sha256')).Split(' ')[0]
            if ((Get-FileHash $archive[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Agent checksum mismatch' }
            Expand-Archive $archive[0].FullName (Join-Path $root 'agent')
            $binary = @(Get-ChildItem "$root/agent" -Recurse -Filter butler-agent.exe)
            if ($binary.Count -ne 1) { throw 'Expected one released Agent executable' }
            $env:BUTLER_E2E_BIN = $binary[0].FullName
            $env:BUTLER_E2E_SKIP_BUILD = '1'
            $env:BUTLER_E2E_TIER = 'live'
            $env:BUTLER_E2E_LIVE_MAX_TURNS = '1'
            $env:BUTLER_E2E_RELEASED_VERSION = $env:RELEASE_TAG.Substring(1)
            if ($subscription) {
              $env:BUTLER_E2E_CHATGPT_AUTH_DIR = $authDir
            } else {
              $env:BUTLER_E2E_API_KEY_ENV = 'API_KEY_SECRET'
            }
            $env:BUTLER_SECRET_STORE = 'file'
            $env:BUTLER_PLATFORM_SYSTEM_SECRETS = '0'
            $env:BUTLER_APP_DISABLE_SHELL_REGISTRATION = '1'
            $env:LOCALAPPDATA = Join-Path $root 'local'
            $env:APPDATA = Join-Path $root 'roaming'
            New-Item -ItemType Directory $env:LOCALAPPDATA,$env:APPDATA | Out-Null
            $version = python .github/scripts/isolated.py $env:BUTLER_E2E_BIN --version
            if ($LASTEXITCODE -or $version -notmatch [regex]::Escape($env:BUTLER_E2E_RELEASED_VERSION)) { throw 'Released binary version mismatch' }
            $harness = Join-Path $env:RUNNER_TEMP 'released-live-harness/e2e.exe'
            Push-Location packages/butler-agent/rust
            try {
              $env:BUTLER_E2E_WORKSPACE_ROOT = (Get-Location).Path
              python ../../../.github/scripts/isolated.py $harness downloads_live::released_windows_folder_real_chat --exact --test-threads=1 --nocapture
              if ($LASTEXITCODE) { throw 'Released real folder chat failed' }
            } finally { Pop-Location }
          } finally { Remove-Item -Recurse -Force $root }
