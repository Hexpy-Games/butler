name: Rust quality

# The PR gate stays on Linux. Platform checks and full install smoke run in
# post-merge-ci.yml, with path-filtered macOS and Windows checks on relevant PRs.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rust-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  CARGO_BUILD_JOBS: "8"

defaults:
  run:
    working-directory: packages/butler-agent/rust

jobs:
  changes:
    name: Detect Rust gate changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'true' || steps.paths.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.before || github.event.repository.default_branch }}
          predicate-quantifier: every
          filters: |
            rust:
              - '**'
              - '!plans/**'
              - '!docs/**'
              - '!**/docs/**'
              - '!**/*.md'

  source:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Format and source rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Check formatting
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$(mktemp -d)" BUTLER_DATA="$(mktemp -d)"
          cargo fmt --all -- --check
      - name: Check Rust source rules
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$(mktemp -d)" BUTLER_DATA="$(mktemp -d)"
          cargo run --locked -p butler-source-check -- .

  linux-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Clippy (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Set up Rust and prebuilt ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          components: clippy
          native-deps: prebuilt-ort
          cache-key: pr-linux-x64-clippy
      - name: Clippy production targets
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$(mktemp -d)" BUTLER_DATA="$(mktemp -d)"
          cargo clippy --workspace --lib --bins --locked --keep-going -- -D warnings
      - name: Clippy all targets
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$(mktemp -d)" BUTLER_DATA="$(mktemp -d)"
          cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

  linux-tests:
    name: Tests (Linux x64, archive)
    needs: linux-e2e-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: e2e-linux-x64
          path: ${{ runner.temp }}/e2e-artifact
      - name: Run workspace tests from the archive
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$(mktemp -d)" BUTLER_DATA="$(mktemp -d)"
          cargo nextest --config-file "$GITHUB_WORKSPACE/.config/nextest.toml" run \
            --archive-file "$RUNNER_TEMP/e2e-artifact/nextest-archive.tar.zst" \
            --workspace-remap "$PWD" --no-fail-fast --retries 0 --test-threads 8 \
            -E 'not binary(=e2e)'

  linux-e2e-archive:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Build workspace archive (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_STRIP: symbols
      CARGO_PROFILE_TEST_STRIP: symbols
    steps:
      - uses: actions/checkout@v4
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Set up Rust and prebuilt ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: prebuilt-ort
          cache-key: pr-linux-x64-e2e
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the agent binary under test
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$(mktemp -d)" BUTLER_DATA="$(mktemp -d)"
          cargo build --locked -p butler-agent --bin butler-agent
      - name: Build and archive workspace tests
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$(mktemp -d)" BUTLER_DATA="$(mktemp -d)"
          cargo nextest archive --locked --workspace --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
      - name: Run doctests when present
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          export HOME="$(mktemp -d)" BUTLER_DATA="$(mktemp -d)"
          if grep -rqE '^[[:space:]]*//[/!][[:space:]]*```' crates; then
            cargo test --workspace --doc --locked
          fi
      - name: Prepare the E2E artifact
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-artifact"
          cp "$RUNNER_TEMP/nextest-archive.tar.zst" "$RUNNER_TEMP/e2e-artifact/nextest-archive.tar.zst"
          gzip -1 -c target/debug/butler-agent > "$RUNNER_TEMP/e2e-artifact/butler-agent.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-linux-x64
          path: ${{ runner.temp }}/e2e-artifact/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux-e2e:
    name: ${{ matrix.job_name }}
    needs: linux-e2e-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - job_name: "E2E stub (Linux x64 1/6)"
            partition: "1/6"
            filterset: "not test(/::ins_/)"
            embedding_model: true
            systemd: false
            idle_disk: true
          - job_name: "E2E stub (Linux x64 2/6)"
            partition: "2/6"
            filterset: "not test(/::ins_/)"
            embedding_model: true
            systemd: false
            idle_disk: false
          - job_name: "E2E stub (Linux x64 3/6)"
            partition: "3/6"
            filterset: "not test(/::ins_/)"
            embedding_model: true
            systemd: false
            idle_disk: false
          - job_name: "E2E stub (Linux x64 4/6)"
            partition: "4/6"
            filterset: "not test(/::ins_/)"
            embedding_model: true
            systemd: false
            idle_disk: false
          - job_name: "E2E stub (Linux x64 5/6)"
            partition: "5/6"
            filterset: "not test(/::ins_/)"
            embedding_model: true
            systemd: false
            idle_disk: false
          - job_name: "E2E stub (Linux x64 6/6)"
            partition: "6/6"
            filterset: "not test(/::ins_/)"
            embedding_model: true
            systemd: false
            idle_disk: false
          - job_name: "E2E INS-02 (Linux x64)"
            partition: ""
            filterset: "test(/::ins_02_/)"
            embedding_model: false
            systemd: false
            idle_disk: false
          - job_name: "E2E INS-14 (Linux x64)"
            partition: ""
            filterset: "test(/::ins_14_/)"
            embedding_model: false
            systemd: true
            idle_disk: false
          - job_name: "E2E install remainder (Linux x64)"
            partition: ""
            filterset: "test(/::ins_/) and not test(/::ins_(02|14)_/)"
            embedding_model: false
            systemd: false
            idle_disk: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: e2e-linux-x64
          path: ${{ runner.temp }}/e2e-artifact
      - name: Run E2E stub tier
        uses: ./.github/actions/e2e-stub
        with:
          partition: ${{ matrix.partition }}
          filterset: ${{ matrix.filterset }}
          archive-file: ${{ runner.temp }}/e2e-artifact/nextest-archive.tar.zst
          agent-binary: ${{ runner.temp }}/e2e-artifact/butler-agent
          run-idle-disk: ${{ matrix.idle_disk }}
          run-systemd: ${{ matrix.systemd }}
          restore-embedding-model: ${{ matrix.embedding_model }}
      - name: Assert runner home untouched
        if: always()
        uses: ./.github/actions/assert-home-untouched

  pr-gate:
    name: PR gate
    if: always()
    needs: [changes, source, linux-clippy, linux-tests, linux-e2e-archive, linux-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Require all gated jobs or a docs-only change
        working-directory: ${{ runner.temp }}
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          jobs = json.loads(os.environ["RESULTS"])
          assert jobs["changes"]["result"] == "success", jobs
          expected = "success" if jobs["changes"]["outputs"]["rust"] == "true" else "skipped"
          assert all(job["result"] == expected for name, job in jobs.items() if name != "changes"), jobs
          PY

  nightly-issue:
    name: Report nightly failure
    if: >-
      always() &&
      (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      (contains(needs.*.result, 'failure'))
    needs: [source, linux-clippy, linux-tests, linux-e2e-archive, linux-e2e]
    runs-on: ubuntu-latest
    concurrency:
      group: ci-failure-report-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update issue
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_LABEL: ${{ github.event_name == 'schedule' && 'nightly' || 'main push' }}
        run: |
          title='Nightly Rust CI failure'
          body="The $EVENT_LABEL Rust CI failed: $RUN_URL"
          number="$(gh issue list --state open --limit 1000 --json number,title --jq '.[] | select(.title == "Nightly Rust CI failure") | .number' | head -1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
