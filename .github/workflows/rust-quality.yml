name: Rust quality

# Production and all-targets Clippy use the same -D warnings flag. The
# production invocation is retained inside each job because dev-dependency
# test-support features can relax lints when --all-targets is selected.
on:
  push:
    branches: [main]
    paths:
      - "packages/butler-agent/rust/**"
      - "packages/butler-agent/resources/**"
      - "deploy/**"
      - "packages/butler-npm/**"
      - ".github/workflows/release.yml"
      - ".github/actions/build-agent-archive/**"
      - "packages/butler-app/client/electron/scripts/prepare-native-agent.mjs"
      - "packages/butler-agent/rust/docs/install-layout.md"
      - ".github/workflows/rust-quality.yml"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/install-smoke.yml"
      - ".github/workflows/windows.yml"
      - ".github/workflows/linux-packages.yml"
      - "packages/butler-app/scripts/release/**"
      - ".github/actions/rust-agent-setup/**"
      - ".github/actions/e2e-stub/**"
  pull_request:
    paths:
      - "packages/butler-agent/rust/**"
      - "packages/butler-agent/resources/**"
      - ".github/workflows/rust-quality.yml"
      - ".github/workflows/e2e.yml"
      - ".github/workflows/windows.yml"
      - ".github/actions/rust-agent-setup/**"
      - ".github/actions/e2e-stub/**"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: rust-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

defaults:
  run:
    working-directory: packages/butler-agent/rust

jobs:
  source:
    name: Format and source rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      windows: ${{ steps.paths.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect Windows-relevant PR changes
        id: paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            windows:
              - 'packages/butler-agent/rust/crates/butler-platform/**'
              - 'packages/butler-agent/rust/crates/butler-agent/src/host/service/**'
              - 'packages/butler-agent/rust/crates/butler-agent/src/host/cli.rs'
              - 'packages/butler-agent/rust/crates/butler-agent/src/host/cli/**'
              - 'packages/butler-agent/rust/crates/butler-agent/src/main.rs'
              - 'packages/butler-agent/rust/Cargo.lock'
              - '.github/workflows/rust-quality.yml'
              - '.github/workflows/windows.yml'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust source rules
        run: cargo run --locked -p butler-source-check -- .

  rust-checks:
    name: Rust checks (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux x64, runner: ubuntu-latest }
          - { platform: macOS arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and prebuilt ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          components: clippy
          native-deps: prebuilt-ort
          cache-key: pr-${{ runner.os }}-${{ runner.arch }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Clippy production targets
        run: cargo clippy --workspace --lib --bins --locked --keep-going -- -D warnings
      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Run doctests when present
        run: |
          if grep -rqE '^[[:space:]]*//[/!][[:space:]]*```' crates; then
            cargo test --workspace --doc --locked
          fi
      - name: Build the agent binary under test
        run: cargo build --locked -p butler-agent --bin butler-agent
      - name: Run E2E stub tier
        uses: ./.github/actions/e2e-stub
      # TODO(#322): replace this hook with assert-home-untouched when PR #322 lands.
      - name: Assert runner home untouched
        if: always()
        shell: bash
        run: test ! -e "$HOME/.butler"

  linux-arm64:
    name: Rust checks (Linux arm64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-agent-setup
        with:
          components: clippy
          native-deps: prebuilt-ort
          cache-key: full-linux-arm64
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Clippy production targets
        run: cargo clippy --workspace --lib --bins --locked --keep-going -- -D warnings
      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Assert runner home untouched
        if: always()
        shell: bash
        run: test ! -e "$HOME/.butler"

  windows-check:
    # Windows is not ported: the host and CLI are unix-only and main.rs prints
    # "not yet available". This compile check only reports how far the
    # workspace is from building; its failures never fail the workflow.
    name: Windows compile check (x86_64-pc-windows-msvc)
    needs: source
    if: >-
      always() && (github.event_name != 'pull_request' || needs.source.outputs.windows == 'true')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/butler-agent/rust
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust and protoc
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: prebuilt-ort
          cache-key: windows-check

      - name: Check the workspace
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --workspace --locked --keep-going --target x86_64-pc-windows-msvc \
            --message-format short 2>&1 | tee "$RUNNER_TEMP/windows-check.log"

      # Groups the errors by crate, file and code so the port can be planned
      # from the run summary.
      - name: Summarize
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          python - "$RUNNER_TEMP/windows-check.log" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, os, re, sys
          pattern = re.compile(r"^(?P<file>[^:\s][^:]*):\d+:\d+: (?P<kind>error|warning)(?:\[(?P<code>\w+)\])?: (?P<text>.*)$")
          errors, files, crates, codes = 0, collections.Counter(), collections.Counter(), collections.Counter()
          failed = []
          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = []
          for line in lines:
              if line.startswith("error: could not compile"):
                  failed.append(line.removeprefix("error: could not compile ").strip())
              match = pattern.match(line)
              if not match or match["kind"] != "error":
                  continue
              path = match["file"].replace("\\", "/")
              errors += 1
              files[path] += 1
              parts = path.split("/")
              crates[parts[1] if parts[0] == "crates" and len(parts) > 1 else parts[0]] += 1
              codes[match["code"] or match["text"][:60]] += 1
          print("### Windows compile check (x86_64-pc-windows-msvc)")
          print(f"Outcome: **{os.environ.get('OUTCOME', 'unknown')}**, {errors} errors.")
          if failed:
              print("\nCould not compile (crates that depend on these were not checked):\n")
              print("\n".join(f"- {item}" for item in failed))
          for title, counter, limit in (("crate", crates, 20), ("file", files, 40), ("error", codes, 20)):
              if counter:
                  print(f"\n| Errors | By {title} |\n| ---: | --- |")
                  print("\n".join(f"| {count} | `{name}` |" for name, count in counter.most_common(limit)))
          PY

  install-full:
    name: Full install smoke
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/install-smoke.yml

  nightly-issue:
    name: Report nightly failure
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    needs: [source, rust-checks, linux-arm64, windows-check, install-full]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly Rust CI failure'
          body="The nightly Rust CI failed: $RUN_URL"
          number="$(gh issue list --state open --limit 1000 --json number,title --jq '.[] | select(.title == "Nightly Rust CI failure") | .number' | head -1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
