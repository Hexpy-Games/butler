name: Rust quality

# The PR gate stays on Linux. Platform checks and full install smoke run in
# post-merge-ci.yml, with path-filtered macOS and Windows checks on relevant PRs.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

defaults:
  run:
    working-directory: packages/butler-agent/rust

jobs:
  source:
    name: Format and source rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust source rules
        run: cargo run --locked -p butler-source-check -- .

  linux-clippy:
    name: Clippy (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Set up Rust and prebuilt ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          components: clippy
          native-deps: prebuilt-ort
          cache-key: pr-linux-x64-clippy
      - name: Clippy production targets
        run: cargo clippy --workspace --lib --bins --locked --keep-going -- -D warnings
      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

  linux-tests:
    name: Tests (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Set up Rust and prebuilt ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: prebuilt-ort
          cache-key: pr-linux-x64-tests
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run tests
        run: cargo nextest --config-file "$GITHUB_WORKSPACE/.config/nextest.toml" run --workspace --locked --no-fail-fast
      - name: Run doctests when present
        run: |
          if grep -rqE '^[[:space:]]*//[/!][[:space:]]*```' crates; then
            cargo test --workspace --doc --locked
          fi

  linux-e2e-archive:
    name: Build E2E archive (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Set up Rust and prebuilt ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: prebuilt-ort
          cache-key: pr-linux-x64-e2e
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Build the agent binary under test
        run: cargo build --locked -p butler-agent --bin butler-agent
      - name: Build and archive E2E tests
        run: cargo nextest archive --locked -p butler-e2e --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
      - name: Prepare the E2E artifact
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-artifact"
          cp "$RUNNER_TEMP/nextest-archive.tar.zst" "$RUNNER_TEMP/e2e-artifact/nextest-archive.tar.zst"
          cp target/debug/butler-agent "$RUNNER_TEMP/e2e-artifact/butler-agent"
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-linux-x64
          path: ${{ runner.temp }}/e2e-artifact/*
          if-no-files-found: error
          retention-days: 1

  linux-e2e:
    name: E2E stub (Linux x64 ${{ matrix.shard }}/3)
    needs: linux-e2e-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 1, idle_disk: true }
          - { shard: 2, idle_disk: false }
          - { shard: 3, idle_disk: false }
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: e2e-linux-x64
          path: ${{ runner.temp }}/e2e-artifact
      - name: Run E2E stub tier
        uses: ./.github/actions/e2e-stub
        with:
          partition: ${{ matrix.shard }}/3
          archive-file: ${{ runner.temp }}/e2e-artifact/nextest-archive.tar.zst
          agent-binary: ${{ runner.temp }}/e2e-artifact/butler-agent
          run-idle-disk: ${{ matrix.idle_disk }}
      - name: Assert runner home untouched
        if: always()
        uses: ./.github/actions/assert-home-untouched

  macos-arm64:
    name: Rust checks (macOS arm64)
    needs: source
    if: >-
      always() && (github.event_name != 'pull_request' || needs.source.outputs.macos == 'true')
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and prebuilt ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          components: clippy
          native-deps: prebuilt-ort
          cache-key: pr-macos-arm64
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Clippy production targets
        run: cargo clippy --workspace --lib --bins --locked --keep-going -- -D warnings
      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Run doctests when present
        run: |
          if grep -rqE '^[[:space:]]*//[/!][[:space:]]*```' crates; then
            cargo test --workspace --doc --locked
          fi
      - name: Build the agent binary under test
        run: cargo build --locked -p butler-agent --bin butler-agent
      - name: Run E2E stub tier
        uses: ./.github/actions/e2e-stub
        with:
          partition: 1/1
          run-idle-disk: "true"
      - name: Assert runner home untouched
        if: always()
        uses: ./.github/actions/assert-home-untouched

  linux-arm64:
    name: Rust checks (Linux arm64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - uses: ./.github/actions/rust-agent-setup
        with:
          components: clippy
          native-deps: prebuilt-ort
          cache-key: full-linux-arm64
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Clippy production targets
        run: cargo clippy --workspace --lib --bins --locked --keep-going -- -D warnings
      - name: Clippy all targets
        run: cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: Assert runner home untouched
        if: always()
        uses: ./.github/actions/assert-home-untouched

  windows-check:
    # Windows is not ported: the host and CLI are unix-only and main.rs prints
    # "not yet available". This compile check only reports how far the
    # workspace is from building; its failures never fail the workflow.
    name: Windows compile check (x86_64-pc-windows-msvc)
    needs: source
    outputs:
      compile: ${{ steps.check.outcome }}
    if: >-
      always() && (github.event_name != 'pull_request' || needs.source.outputs.windows == 'true')
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/butler-agent/rust
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust and protoc
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: prebuilt-ort
          cache-key: windows-check

      - name: Check the workspace
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --workspace --locked --keep-going --target x86_64-pc-windows-msvc \
            --message-format short 2>&1 | tee "$RUNNER_TEMP/windows-check.log"

      # Groups the errors by crate, file and code so the port can be planned
      # from the run summary.
      - name: Summarize
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          python - "$RUNNER_TEMP/windows-check.log" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, os, re, sys
          pattern = re.compile(r"^(?P<file>[^:\s][^:]*):\d+:\d+: (?P<kind>error|warning)(?:\[(?P<code>\w+)\])?: (?P<text>.*)$")
          errors, files, crates, codes = 0, collections.Counter(), collections.Counter(), collections.Counter()
          failed = []
          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = []
          for line in lines:
              if line.startswith("error: could not compile"):
                  failed.append(line.removeprefix("error: could not compile ").strip())
              match = pattern.match(line)
              if not match or match["kind"] != "error":
                  continue
              path = match["file"].replace("\\", "/")
              errors += 1
              files[path] += 1
              parts = path.split("/")
              crates[parts[1] if parts[0] == "crates" and len(parts) > 1 else parts[0]] += 1
              codes[match["code"] or match["text"][:60]] += 1
          print("### Windows compile check (x86_64-pc-windows-msvc)")
          print(f"Outcome: **{os.environ.get('OUTCOME', 'unknown')}**, {errors} errors.")
          if failed:
              print("\nCould not compile (crates that depend on these were not checked):\n")
              print("\n".join(f"- {item}" for item in failed))
          for title, counter, limit in (("crate", crates, 20), ("file", files, 40), ("error", codes, 20)):
              if counter:
                  print(f"\n| Errors | By {title} |\n| ---: | --- |")
                  print("\n".join(f"| {count} | `{name}` |" for name, count in counter.most_common(limit)))
          PY

  install-full:
    name: Full install smoke
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/install-smoke.yml

  nightly-issue:
    name: Report nightly failure
    if: >-
      always() &&
      (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      (contains(needs.*.result, 'failure') || needs.windows-check.outputs.compile == 'failure')
    needs: [source, linux-clippy, linux-tests, linux-e2e-archive, linux-e2e, macos-arm64, linux-arm64, windows-check, install-full]
    runs-on: ubuntu-latest
    concurrency:
      group: ci-failure-report-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_LABEL: ${{ github.event_name == 'schedule' && 'nightly' || 'main push' }}
        run: |
          title='Nightly Rust CI failure'
          body="The $EVENT_LABEL Rust CI failed: $RUN_URL"
          number="$(gh issue list --state open --limit 1000 --json number,title --jq '.[] | select(.title == "Nightly Rust CI failure") | .number' | head -1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
