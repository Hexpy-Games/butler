name: Rust quality

# Fast checks (format, source rules, clippy) run on every PR. Tests need the
# static ONNX Runtime and a full debug build, so they run on pushes to main,
# on PRs into main, and on stacked PRs labelled `full-ci`; intermediate stacked
# PRs are re-verified when the stack lands on a PR into main.
on:
  push:
    branches: [main]
    paths:
      - "packages/butler-agent/rust/**"
      - ".github/workflows/rust-quality.yml"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "packages/butler-agent/rust/**"
      - ".github/workflows/rust-quality.yml"

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

defaults:
  run:
    working-directory: packages/butler-agent/rust

jobs:
  source:
    name: Format and source rules
    # Adding an unrelated label must not re-run the workflow.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # File size caps, domain architecture and the function-length ratchet
      # (per-crate source-check-baseline.txt). Builds only syn.
      - name: Check Rust source rules
        run: cargo run --locked -p butler-source-check -- .

  clippy:
    # Test builds enable the crates' test-support features, which relax
    # fixture lints (unwrap/expect/panic, dead code) on the libraries, so the
    # production targets are linted in their own feature set. The two passes
    # run in parallel rather than one after the other.
    name: Clippy (${{ matrix.pass }})
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    # The agent (and its protobuf build scripts) target macOS arm64 only.
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - pass: production
            targets: --lib --bins
          - pass: all-targets
            targets: --all-targets
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: clippy

      - name: Set up Python for the ORT recipe
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Checking never links ORT; the Lance build scripts only need protoc.
      - name: Prepare pinned protoc
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ort-cache
        run: |
          set -euo pipefail
          prepared="$(python scripts/prepare-static-ort-macos-arm64.py --protoc-only)"
          echo "PROTOC=$(jq -r .protoc <<<"$prepared")" >> "$GITHUB_ENV"

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/butler-agent/rust
          shared-key: clippy-${{ matrix.pass }}
          cache-on-failure: true

      - name: Run Clippy
        run: cargo clippy --workspace ${{ matrix.targets }} --locked -- -D warnings

  test:
    name: Tests
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (github.event_name == 'push' || github.base_ref == 'main' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0

      - name: Set up Python for the ORT recipe
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The recipe's own fingerprint (lock, script, toolchain, SDK, clang,
      # Python) is the cache key, so a runner image update that changes none
      # of them still hits the cache.
      - name: Fingerprint static ONNX Runtime
        id: ort
        run: echo "fingerprint=$(python scripts/prepare-static-ort-macos-arm64.py --fingerprint)" >> "$GITHUB_OUTPUT"

      - name: Restore static ONNX Runtime cache
        id: ort-cache
        uses: actions/cache/restore@v4
        with:
          # Outside the Cargo target so rust-cache and `cargo clean` never touch it.
          path: ${{ runner.temp }}/ort-cache/native-deps
          key: static-ort-${{ runner.os }}-${{ runner.arch }}-${{ steps.ort.outputs.fingerprint }}

      - name: Prepare pinned static ONNX Runtime and protoc
        env:
          ORT_CACHE_TARGET: ${{ runner.temp }}/ort-cache
        run: |
          set -euo pipefail
          prepared="$(CARGO_TARGET_DIR="$ORT_CACHE_TARGET" python scripts/prepare-static-ort-macos-arm64.py)"
          echo "$prepared"
          {
            echo "ORT_LIB_PATH=$(jq -r .ort_lib_path <<<"$prepared")"
            echo "PROTOC=$(jq -r .protoc <<<"$prepared")"
            echo "ORT_PREFER_DYNAMIC_LINK=0"
            echo "ORT_SKIP_DOWNLOAD=1"
          } >> "$GITHUB_ENV"

      - name: Save static ONNX Runtime cache
        if: steps.ort-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ort-cache/native-deps
          key: ${{ steps.ort-cache.outputs.cache-primary-key }}

      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/butler-agent/rust
          shared-key: test
          cache-on-failure: true

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build tests
        run: cargo nextest run --workspace --locked --no-run

      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast

      # nextest does not run doctests; the crates currently have none.
      - name: Run doctests
        run: |
          if grep -rqE '^[[:space:]]*//[/!][[:space:]]*```' crates; then
            cargo test --workspace --doc --locked
          else
            echo "No documentation code blocks; no doctests to run."
          fi
