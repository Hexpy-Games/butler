name: Rust quality

# One required gate covers the selected Linux, macOS, UI and site checks.
# Windows ownership remains in the existing Windows workflows.
on:
  push:
    branches: [main]
    paths-ignore: [README.md, CONTRIBUTING.md, 'assets/readme/**']
  pull_request:
    paths-ignore: [README.md, CONTRIBUTING.md, 'assets/readme/**']
  merge_group:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: rust-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

defaults:
  run:
    working-directory: packages/butler-agent/rust

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: 'true'
      ui: ${{ steps.paths.outputs.ui }}
      site: ${{ steps.paths.outputs.site }}
      ds: ${{ steps.paths.outputs.ds }}
      package: ${{ github.event_name == 'pull_request' && steps.paths.outputs.package || 'false' }}
      install: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && 'true' || steps.paths.outputs.install }}
      linux-package: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push') && 'true' || steps.paths.outputs.linux-package }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.before || github.event.repository.default_branch }}
          filters: |
            rust:
              - 'packages/butler-agent/rust/**/!(*.md)'
              - 'packages/butler-agent/resources/**/!(*.md)'
              - 'VERSION'
              - '.config/nextest.toml'
              - '.github/scripts/**'
              - '.github/actions/e2e-stub/**'
              - '.github/actions/rust-agent-setup/**'
              - '.github/workflows/rust-*.yml'
            ui:
              - 'packages/**/*.{ts,tsx,js,jsx,mjs}'
              - 'packages/**/package.json'
              - 'packages/butler-app/client/ui/**/*.css'
              - 'tests/**'
              - 'tools/**/*.{ts,js,mjs}'
              - '{package.json,bun.lock,bunfig.toml,tsconfig*.json}'
              - '.github/workflows/bun-unit.yml'
              - '.github/actions/assert-home-untouched/**'
            site:
              - 'packages/butler-site/**'
              - 'packages/butler-app/client/ui/**'
              - 'tests/smoke/ds-site-*.ts'
              - '{LICENSE,VERSION,package.json,bun.lock}'
              - '.github/workflows/site*.yml'
            ds:
              - 'packages/butler-app/client/ui/**'
              - 'tests/smoke/ds-site-*.ts'
              - '{LICENSE,package.json,bun.lock}'
              - '.github/workflows/ds-site.yml'
            package:
              - '.github/workflows/macos-app-package.yml'
              - '.github/workflows/{native-agent,macos-update-fixtures,rust-quality}.yml'
              - '.github/workflows/release*.yml'
              - '.github/actions/rust-agent-setup/**'
              - 'packages/butler-app/client/electron/**'
              - 'packages/butler-app/scripts/release/**'
              - 'deploy/**'
              - 'tests/smoke/packaged-app-update.ts'
              - 'tests/smoke/app-update-choice-smoke.ts'
              - 'tests/smoke/app-update-work-stream.ts'
              - 'tests/support/update-work-fixture.ts'
              - 'tests/support/electron-page-cdp.ts'
              - 'packages/butler-app/client/ui/src/components/settings/Update*'
              - 'packages/butler-agent/rust/crates/butler-platform/src/app_update.rs'
              - 'packages/butler-agent/rust/crates/butler-agent/build.rs'
              - 'packages/butler-agent/rust/crates/butler-agent/src/host/cli/app_update.rs'
              - 'packages/butler-agent/rust/crates/butler-runtime/src/operations/update*'
              - 'packages/butler-agent/rust/crates/butler-runtime/src/operations/update/**'
              - '{bun.lock,**/package.json}'
            linux-package:
              - '.github/workflows/{linux-packages,release}.yml'
              - '.github/actions/rust-agent-setup/**'
              - 'packages/butler-agent/rust/Cargo.lock'
              - 'packages/butler-agent/rust/crates/{butler-agent,butler-gateway,butler-memory}/Cargo.toml'
              - 'packages/butler-agent/rust/scripts/prepare-static-ort.py'
              - 'packages/butler-app/scripts/release/**'
              - 'packages/butler-app/client/electron/**'
              - 'deploy/**'
              - '{bun.lock,**/package.json}'
            install:
              - '.github/workflows/install-smoke.yml'
              - '.github/workflows/{release*,npm-publish,linux-packages}.yml'
              - '.github/actions/build-agent-archive/**'
              - 'packages/butler-app/scripts/release/**'
              - 'deploy/**'
              - 'packages/butler-npm/**'
              - 'packages/butler-agent/rust/scripts/*standalone*'
              - 'packages/butler-app/client/electron/scripts/prepare-native-agent.mjs'

  source:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Format and source rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt
      - name: Check formatting
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo fmt --all -- --check
      - name: Check Rust source rules
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo run --locked -p butler-source-check -- .

  linux-clippy:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    name: Clippy (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Set up Rust and prebuilt ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          components: clippy
          native-deps: prebuilt-ort
          cache-key: pr-linux-x64-clippy
      - name: Clippy production targets
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo clippy --workspace --lib --bins --locked --keep-going -- -D warnings
      - name: Clippy all targets
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings

  linux-native:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.linux-package == 'true' || needs.changes.outputs.install == 'true'
    uses: ./.github/workflows/native-agent.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x64
      ort-mode: ${{ github.event_name == 'schedule' && 'static-ort' || 'prebuilt-ort' }}

  linux-archive:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.linux-package == 'true' || needs.changes.outputs.install == 'true'
    uses: ./.github/workflows/rust-archive.yml
    with:
      ort-mode: prebuilt-ort

  linux-perf-archive:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-perf-archive.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x64

  linux-perf:
    needs: [changes, linux-perf-archive, linux-native]
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x64
      performance-only: true

  linux-tests:
    needs: [changes, linux-archive]
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml

  linux-arm64-native:
    needs: changes
    if: needs.changes.outputs.linux-package == 'true' || needs.changes.outputs.install == 'true' || (github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true')
    uses: ./.github/workflows/native-agent.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64
      ort-mode: ${{ github.event_name == 'schedule' && 'static-ort' || 'prebuilt-ort' }}

  linux-arm64-archive:
    needs: changes
    if: needs.changes.outputs.linux-package == 'true' || needs.changes.outputs.install == 'true' || (github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true')
    uses: ./.github/workflows/rust-archive.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64
      ort-mode: prebuilt-ort
      clippy: true

  linux-arm64-perf-archive:
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-perf-archive.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64

  linux-arm64-perf:
    needs: [changes, linux-arm64-perf-archive, linux-arm64-native]
    if: github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64
      performance-only: true

  linux-arm64-tests:
    needs: [changes, linux-arm64-archive]
    if: github.event_name != 'pull_request' && needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64

  linux-package-x64:
    permissions:
      contents: read
      actions: read
      issues: write
    needs: [changes, linux-native]
    if: needs.changes.outputs.linux-package == 'true'
    uses: ./.github/workflows/linux-packages.yml
    with:
      shared-agents: true
      label: x64
      platforms: '[{"target":"linux-x64","runner":"ubuntu-24.04","formats":"--format=deb --format=pacman"}]'
      smokes: '[{"target":"linux-x64","runner":"ubuntu-24.04","format":"deb","image":"ubuntu:24.04"},{"target":"linux-x64","runner":"ubuntu-24.04","format":"deb","image":"debian:trixie"},{"target":"linux-x64","runner":"ubuntu-24.04","format":"pacman","image":"archlinux:base-20260927.0.600689@sha256:eb8f6dcc89a38977c9735f10fcf6ae4afe496283e7008eb7a3420cdba31fbd04"}]'

  linux-package-arm64:
    permissions:
      contents: read
      actions: read
      issues: write
    needs: [changes, linux-arm64-native]
    if: needs.changes.outputs.linux-package == 'true'
    uses: ./.github/workflows/linux-packages.yml
    with:
      shared-agents: true
      label: arm64
      platforms: '[{"target":"linux-arm64","runner":"ubuntu-24.04-arm","formats":"--format=deb"}]'
      smokes: '[{"target":"linux-arm64","runner":"ubuntu-24.04-arm","format":"deb","image":"ubuntu:24.04"}]'


  macos-native:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.package == 'true' || needs.changes.outputs.install == 'true'
    uses: ./.github/workflows/native-agent.yml
    with:
      runner: macos-15
      platform: darwin-arm64
      ort-mode: static-ort

  macos-updates:
    needs: changes
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/macos-update-fixtures.yml

  macos-archive:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.package == 'true' || needs.changes.outputs.install == 'true'
    uses: ./.github/workflows/rust-archive.yml
    with:
      runner: macos-15
      platform: darwin-arm64
      ort-mode: prebuilt-ort
      clippy: true

  macos-perf-archive:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-perf-archive.yml
    with:
      runner: macos-15
      platform: darwin-arm64

  macos-perf:
    needs: [changes, macos-perf-archive, macos-native]
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: macos-15
      platform: darwin-arm64
      performance-only: true

  macos-tests:
    needs: [changes, macos-archive]
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/rust-tests.yml
    with:
      runner: macos-15
      platform: darwin-arm64

  macos-package:
    needs: [changes, macos-native, macos-updates]
    if: needs.changes.outputs.package == 'true'
    uses: ./.github/workflows/macos-app-package.yml
    with:
      agent-artifact: agent-payload-darwin-arm64
      update-agent-artifact: macos-update-agent-builds

  install-x64:
    needs: [changes, linux-native]
    if: needs.changes.outputs.install == 'true'
    uses: ./.github/workflows/install-smoke.yml
    with:
      shared-agents: true
      merge-manifests: false
      label: x64
      platforms: '[{"platform":"linux-x64","runner":"ubuntu-24.04"}]'

  install-arm64:
    needs: [changes, linux-arm64-native]
    if: needs.changes.outputs.install == 'true'
    uses: ./.github/workflows/install-smoke.yml
    with:
      shared-agents: true
      merge-manifests: false
      label: arm64
      platforms: '[{"platform":"linux-arm64","runner":"ubuntu-24.04-arm"}]'

  install-macos:
    needs: [changes, macos-native]
    if: needs.changes.outputs.install == 'true'
    uses: ./.github/workflows/install-smoke.yml
    with:
      shared-agents: true
      merge-manifests: false
      label: macos
      platforms: '[{"platform":"darwin-arm64","runner":"macos-15"}]'

  install-merge:
    needs: [changes, install-x64, install-arm64, install-macos]
    if: needs.changes.outputs.install == 'true'
    uses: ./.github/workflows/merge-agent-manifests.yml


  ui:
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    uses: ./.github/workflows/bun-unit.yml

  site:
    needs: changes
    if: needs.changes.outputs.site == 'true' && github.event_name != 'push'
    uses: ./.github/workflows/site-check.yml

  ds:
    needs: changes
    if: needs.changes.outputs.ds == 'true' && github.event_name != 'push'
    uses: ./.github/workflows/ds-site.yml

  gate:
    name: gate
    if: always()
    needs: [changes, source, linux-clippy, linux-native, linux-perf-archive, linux-perf, macos-native, macos-updates, macos-perf-archive, macos-perf, linux-arm64-native, linux-arm64-perf-archive, linux-arm64-perf, linux-archive, linux-tests, macos-archive, macos-tests, macos-package, linux-arm64-archive, linux-arm64-tests, linux-package-x64, linux-package-arm64, install-x64, install-arm64, install-macos, install-merge, ui, site, ds]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected check
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/check-gate.py
  windows-check:
    # Windows is not ported: the host and CLI are unix-only and main.rs prints
    # "not yet available". This compile check only reports how far the
    # workspace is from building; its failures never fail the workflow.
    name: Windows compile check (x86_64-pc-windows-msvc)
    needs: source
    outputs:
      compile: ${{ steps.check.outcome }}
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/butler-agent/rust
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust and protoc
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: prebuilt-ort
          cache-key: windows-check

      - name: Check the workspace
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --workspace --locked --keep-going --target x86_64-pc-windows-msvc \
            --message-format short 2>&1 | tee "$RUNNER_TEMP/windows-check.log"

      # Groups the errors by crate, file and code so the port can be planned
      # from the run summary.
      - name: Summarize
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          python - "$RUNNER_TEMP/windows-check.log" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, os, re, sys
          pattern = re.compile(r"^(?P<file>[^:\s][^:]*):\d+:\d+: (?P<kind>error|warning)(?:\[(?P<code>\w+)\])?: (?P<text>.*)$")
          errors, files, crates, codes = 0, collections.Counter(), collections.Counter(), collections.Counter()
          failed = []
          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = []
          for line in lines:
              if line.startswith("error: could not compile"):
                  failed.append(line.removeprefix("error: could not compile ").strip())
              match = pattern.match(line)
              if not match or match["kind"] != "error":
                  continue
              path = match["file"].replace("\\", "/")
              errors += 1
              files[path] += 1
              parts = path.split("/")
              crates[parts[1] if parts[0] == "crates" and len(parts) > 1 else parts[0]] += 1
              codes[match["code"] or match["text"][:60]] += 1
          print("### Windows compile check (x86_64-pc-windows-msvc)")
          print(f"Outcome: **{os.environ.get('OUTCOME', 'unknown')}**, {errors} errors.")
          if failed:
              print("\nCould not compile (crates that depend on these were not checked):\n")
              print("\n".join(f"- {item}" for item in failed))
          for title, counter, limit in (("crate", crates, 20), ("file", files, 40), ("error", codes, 20)):
              if counter:
                  print(f"\n| Errors | By {title} |\n| ---: | --- |")
                  print("\n".join(f"| {count} | `{name}` |" for name, count in counter.most_common(limit)))
          PY

  nightly-issue:
    name: Report nightly failure
    if: >-
      always() &&
      (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      (contains(needs.*.result, 'failure') || needs.windows-check.outputs.compile == 'failure')
    needs: [gate, windows-check]
    runs-on: ubuntu-latest
    concurrency:
      group: ci-failure-report-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update issue
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_LABEL: ${{ github.event_name == 'schedule' && 'nightly' || 'main push' }}
        run: |
          title='Nightly Rust CI failure'
          body="The $EVENT_LABEL Rust CI failed: $RUN_URL"
          number="$(gh issue list --state open --limit 1000 --json number,title --jq '.[] | select(.title == "Nightly Rust CI failure") | .number' | head -1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
