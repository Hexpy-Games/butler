name: Rust quality

# Tiers, fastest first:
# - source (every PR): format and source rules, Ubuntu, ~1 min.
# - clippy (every PR): production and all-targets passes in parallel; only
#   protoc, no ONNX Runtime build.
# - test (pushes to main, PRs into main, stacked PRs labelled `full-ci`):
#   cargo-nextest over the workspace with the static ONNX Runtime.
# - linux-clippy (every PR) and linux-test (as test): the same clippy passes
#   and tests on Linux x64 and arm64, each with its own pinned ORT cache;
#   non-blocking until the platform port lands.
# - windows-check (every PR): `cargo check` for x86_64-pc-windows-msvc; it
#   reports what does not compile yet and never fails the workflow.
# Future tiers plug in the same way: an E2E stub tier is one more job here
# (`uses: ./.github/actions/rust-agent-setup` with `native-deps: ort`, then
# build the agent binary and run the stub scenarios), and the live tier (real
# providers, secrets) belongs in its own workflow triggered by `schedule` and
# `workflow_dispatch`, so PR runs never see its secrets.
on:
  push:
    branches: [main]
    paths:
      - "packages/butler-agent/rust/**"
      - ".github/workflows/rust-quality.yml"
      - ".github/actions/rust-agent-setup/**"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "packages/butler-agent/rust/**"
      - ".github/workflows/rust-quality.yml"
      - ".github/actions/rust-agent-setup/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

defaults:
  run:
    working-directory: packages/butler-agent/rust

jobs:
  source:
    name: Format and source rules
    # Adding an unrelated label must not re-run the workflow.
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.91.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      # File size caps, domain architecture and the production function-length ratchet
      # (per-crate source-check-baseline.txt). Builds only syn.
      - name: Check Rust source rules
        run: cargo run --locked -p butler-source-check -- .

  clippy:
    # Test builds enable the crates' test-support features, which relax
    # fixture lints (unwrap/expect/panic, dead code) on the libraries, so the
    # production targets are linted in their own feature set. The two passes
    # run in parallel rather than one after the other.
    name: Clippy (${{ matrix.pass }})
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    # The agent (and its protobuf build scripts) target macOS arm64 only.
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - pass: production
            targets: --lib --bins
          - pass: all-targets
            targets: --all-targets
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust and protoc
        uses: ./.github/actions/rust-agent-setup
        with:
          components: clippy
          native-deps: protoc
          cache-key: clippy-${{ matrix.pass }}

      - name: Run Clippy
        run: cargo clippy --workspace ${{ matrix.targets }} --locked -- -D warnings

  test:
    name: Tests
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (github.event_name != 'pull_request' || github.base_ref == 'main' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust and the static ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: ort
          cache-key: test

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build tests
        run: cargo nextest run --workspace --locked --no-run

      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast

      # nextest does not run doctests; the crates currently have none.
      - name: Run doctests
        run: |
          if grep -rqE '^[[:space:]]*//[/!][[:space:]]*```' crates; then
            cargo test --workspace --doc --locked
          else
            echo "No documentation code blocks; no doctests to run."
          fi

  # Portability tiers. The agent ships on macOS arm64 only; these jobs track
  # how far the workspace is from building and passing on Linux and Windows.
  # Format and source rules are platform-independent and stay in `source`.
  # The Linux jobs are non-blocking (continue-on-error) until the platform
  # port (crates/butler-platform, stage 0 onward) fixes the known Linux
  # failures; then drop continue-on-error and make them required.
  linux-clippy:
    name: Linux clippy (${{ matrix.target }}, ${{ matrix.pass }})
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64]
        pass: [production, all-targets]
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - pass: production
            targets: --lib --bins
          - pass: all-targets
            targets: --all-targets
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust and protoc
        uses: ./.github/actions/rust-agent-setup
        with:
          components: clippy
          native-deps: protoc
          cache-key: clippy-${{ matrix.pass }}-${{ matrix.target }}

      - name: Run Clippy
        run: cargo clippy --workspace ${{ matrix.targets }} --locked -- -D warnings

  linux-test:
    name: Linux tests (${{ matrix.target }})
    if: >-
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci') &&
      (github.event_name != 'pull_request' || github.base_ref == 'main' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      # The static ORT build needs more than 8 GiB free while it runs, next to
      # the test build; drop preinstalled SDKs these jobs never use.
      - name: Free disk space
        working-directory: /
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust and the static ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: ort
          cache-key: test-${{ matrix.target }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build tests
        run: cargo nextest run --workspace --locked --no-run

      - name: Run tests
        run: cargo nextest run --workspace --locked --no-fail-fast

  windows-check:
    # Windows is not ported: the host and CLI are unix-only and main.rs prints
    # "not yet available". This compile check only reports how far the
    # workspace is from building; its failures never fail the workflow.
    name: Windows compile check (x86_64-pc-windows-msvc)
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/butler-agent/rust
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust and protoc
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: protoc
          cache-key: windows-check

      - name: Check the workspace
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo check --workspace --locked --keep-going --target x86_64-pc-windows-msvc \
            --message-format short 2>&1 | tee "$RUNNER_TEMP/windows-check.log"

      # Groups the errors by crate, file and code so the port can be planned
      # from the run summary.
      - name: Summarize
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          python - "$RUNNER_TEMP/windows-check.log" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, os, re, sys
          pattern = re.compile(r"^(?P<file>[^:\s][^:]*):\d+:\d+: (?P<kind>error|warning)(?:\[(?P<code>\w+)\])?: (?P<text>.*)$")
          errors, files, crates, codes = 0, collections.Counter(), collections.Counter(), collections.Counter()
          failed = []
          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = []
          for line in lines:
              if line.startswith("error: could not compile"):
                  failed.append(line.removeprefix("error: could not compile ").strip())
              match = pattern.match(line)
              if not match or match["kind"] != "error":
                  continue
              path = match["file"].replace("\\", "/")
              errors += 1
              files[path] += 1
              parts = path.split("/")
              crates[parts[1] if parts[0] == "crates" and len(parts) > 1 else parts[0]] += 1
              codes[match["code"] or match["text"][:60]] += 1
          print("### Windows compile check (x86_64-pc-windows-msvc)")
          print(f"Outcome: **{os.environ.get('OUTCOME', 'unknown')}**, {errors} errors.")
          if failed:
              print("\nCould not compile (crates that depend on these were not checked):\n")
              print("\n".join(f"- {item}" for item in failed))
          for title, counter, limit in (("crate", crates, 20), ("file", files, 40), ("error", codes, 20)):
              if counter:
                  print(f"\n| Errors | By {title} |\n| ---: | --- |")
                  print("\n".join(f"| {count} | `{name}` |" for name, count in counter.most_common(limit)))
          PY
