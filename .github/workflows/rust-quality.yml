name: Rust quality
run-name: >-
  ${{ contains(fromJSON('["labeled", "unlabeled", "edited"]'), github.event.action) && format('Gate re-evaluation #{0}', github.run_id) || format('CI #{0}', github.run_id) }}

# One required gate covers the selected Linux, macOS, UI and site checks.
# Windows compile, signing policy and licenses share this selection and gate.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/release/') && format('integration-{0}', github.ref) || github.event_name == 'workflow_dispatch' && format('rust-quality-dispatch-{0}', github.run_id) || contains(fromJSON('["labeled", "unlabeled", "edited"]'), github.event.action) && format('rust-quality-metadata-{0}', github.head_ref || github.ref_name) || format('rust-quality-{0}', github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/release/') }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

defaults:
  run:
    working-directory: packages/butler-agent/rust

jobs:
  changes:
    # Metadata re-evaluations run gate and DS approval; they cannot cancel a full CI run.
    if: ${{ !contains(fromJSON('["labeled", "unlabeled", "edited"]'), github.event.action) }}
    uses: ./.github/workflows/ci-changes.yml
    with:
      workflow: rust-quality.yml

  windows-check:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['windows-check']
    uses: ./.github/workflows/rust-windows-check.yml

  shellcheck:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['shellcheck']
    name: shellcheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/isolated.py shellcheck deploy/macos/*.sh
      - run: python3 .github/scripts/isolated.py deploy/macos/policy-selftest.sh

  # Every invariant class except the compiled-inventory Coverage proof, which
  # the archive jobs run; lint runs the WindowsSafety class on every PR.
  ci-invariants:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['ci-invariants']
    name: ci-invariants
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/isolated.py python3 .github/scripts/test-ci-invariants.py --policy

  selftest:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['selftest']
    uses: ./.github/workflows/macos-selftest.yml

  linux-clippy:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['linux-clippy']
    uses: ./.github/workflows/rust-clippy.yml

  linux-native:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['linux-native']
    uses: ./.github/workflows/native-agent.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x64
      # Match the trusted main snapshot; a different ORT mode forces cold PR builds.
      perf-fixture: ${{ needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['linux-perf'] }}
      ort-mode: static-ort

  linux-archive:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['linux-archive']
    uses: ./.github/workflows/rust-archive.yml
    with:
      fixtures: ${{ needs.changes.outputs.tier == 'integration' || github.event_name != 'pull_request' }}
      ort-mode: prebuilt-ort
      smoke-in-place: ${{ github.event_name == 'pull_request' }}
      tool-e2e: ${{ needs.changes.outputs.tool-e2e == 'true' }}

  linux-perf-archive:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['linux-perf-archive']
    uses: ./.github/workflows/rust-perf-archive.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x64

  linux-perf:
    needs: [changes, linux-perf-archive, linux-native, linux-archive]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['linux-perf']
    uses: ./.github/workflows/rust-tests.yml
    with:
      workspace: ${{ fromJSON(needs.changes.outputs.parts)['linux-perf'].workspace }}
      e2e-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['linux-perf'].e2e) }}
      perf-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['linux-perf'].perf) }}
      runner: ubuntu-24.04
      platform: linux-x64
      performance-only: true

  linux-tests:
    needs: [changes, linux-archive]
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['linux-tests']
    uses: ./.github/workflows/rust-tests.yml
    with:
      workspace: ${{ fromJSON(needs.changes.outputs.parts)['linux-tests'].workspace }}
      e2e-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['linux-tests'].e2e) }}
      perf-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['linux-tests'].perf) }}
      e2e: ${{ needs.changes.outputs.tier == 'integration' }}

  linux-arm64-native:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['linux-arm64-native']
    uses: ./.github/workflows/native-agent.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64
      perf-fixture: ${{ needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['linux-arm64-perf'] }}
      ort-mode: static-ort

  linux-arm64-archive:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['linux-arm64-archive']
    uses: ./.github/workflows/rust-archive.yml
    with:
      fixtures: ${{ needs.changes.outputs.tier == 'integration' || github.event_name != 'pull_request' }}
      runner: ubuntu-24.04-arm
      platform: linux-arm64
      ort-mode: prebuilt-ort
      clippy: true

  linux-arm64-perf-archive:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['linux-arm64-perf-archive']
    uses: ./.github/workflows/rust-perf-archive.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64

  linux-arm64-perf:
    needs: [changes, linux-arm64-perf-archive, linux-arm64-native, linux-arm64-archive]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['linux-arm64-perf']
    uses: ./.github/workflows/rust-tests.yml
    with:
      workspace: ${{ fromJSON(needs.changes.outputs.parts)['linux-arm64-perf'].workspace }}
      e2e-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['linux-arm64-perf'].e2e) }}
      perf-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['linux-arm64-perf'].perf) }}
      runner: ubuntu-24.04-arm
      platform: linux-arm64
      performance-only: true

  linux-arm64-tests:
    needs: [changes, linux-arm64-archive]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['linux-arm64-tests']
    uses: ./.github/workflows/rust-tests.yml
    with:
      workspace: ${{ fromJSON(needs.changes.outputs.parts)['linux-arm64-tests'].workspace }}
      e2e-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['linux-arm64-tests'].e2e) }}
      perf-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['linux-arm64-tests'].perf) }}
      runner: ubuntu-24.04-arm
      platform: linux-arm64

  linux-package-x64:
    permissions:
      contents: read
      actions: read
      issues: write
    needs: [changes, linux-native]
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['linux-package-x64']
    uses: ./.github/workflows/linux-packages.yml
    with:
      shared-agents: true
      label: x64
      platforms: '[{"target":"linux-x64","runner":"ubuntu-24.04","formats":"--format=deb --format=pacman"}]'
      smokes: '[{"target":"linux-x64","runner":"ubuntu-24.04","format":"deb","image":"ubuntu:24.04"},{"target":"linux-x64","runner":"ubuntu-24.04","format":"deb","image":"debian:trixie"},{"target":"linux-x64","runner":"ubuntu-24.04","format":"pacman","image":"archlinux:base-20260927.0.600689@sha256:eb8f6dcc89a38977c9735f10fcf6ae4afe496283e7008eb7a3420cdba31fbd04"}]'

  linux-package-arm64:
    permissions:
      contents: read
      actions: read
      issues: write
    needs: [changes, linux-arm64-native]
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['linux-package-arm64']
    uses: ./.github/workflows/linux-packages.yml
    with:
      shared-agents: true
      label: arm64
      platforms: '[{"target":"linux-arm64","runner":"ubuntu-24.04-arm","formats":"--format=deb"}]'
      smokes: '[{"target":"linux-arm64","runner":"ubuntu-24.04-arm","format":"deb","image":"ubuntu:24.04"}]'


  macos-native:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['macos-native']
    uses: ./.github/workflows/native-agent.yml
    with:
      runner: macos-15
      platform: darwin-arm64
      perf-fixture: ${{ needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['macos-perf'] }}
      ort-mode: static-ort

  macos-updates:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['macos-updates']
    uses: ./.github/workflows/macos-update-fixtures.yml

  macos-archive:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['macos-archive']
    uses: ./.github/workflows/rust-archive.yml
    with:
      fixtures: ${{ needs.changes.outputs.tier == 'integration' || github.event_name != 'pull_request' }}
      runner: macos-15
      platform: darwin-arm64
      ort-mode: prebuilt-ort
      clippy: true

  macos-perf-archive:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['macos-perf-archive']
    uses: ./.github/workflows/rust-perf-archive.yml
    with:
      runner: macos-15
      platform: darwin-arm64

  macos-perf:
    needs: [changes, macos-perf-archive, macos-native, macos-archive]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['macos-perf']
    uses: ./.github/workflows/rust-tests.yml
    with:
      workspace: ${{ fromJSON(needs.changes.outputs.parts)['macos-perf'].workspace }}
      e2e-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['macos-perf'].e2e) }}
      perf-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['macos-perf'].perf) }}
      runner: macos-15
      platform: darwin-arm64
      performance-only: true

  macos-tests:
    needs: [changes, macos-archive]
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['macos-tests']
    uses: ./.github/workflows/rust-tests.yml
    with:
      workspace: ${{ fromJSON(needs.changes.outputs.parts)['macos-tests'].workspace }}
      e2e-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['macos-tests'].e2e) }}
      perf-shards: ${{ toJSON(fromJSON(needs.changes.outputs.parts)['macos-tests'].perf) }}
      e2e: ${{ needs.changes.outputs.tier == 'integration' }}
      runner: macos-15
      platform: darwin-arm64

  macos-package:
    needs: [changes, macos-native, macos-updates]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['macos-package']
    uses: ./.github/workflows/macos-app-package.yml
    with:
      candidate-version: ${{ needs.changes.outputs.candidate }}
      agent-artifact: agent-payload-darwin-arm64
      update-agent-artifact: macos-update-agent-builds

  install-x64:
    needs: [changes, linux-native]
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['install-x64']
    uses: ./.github/workflows/install-smoke.yml
    with:
      shared-agents: true
      merge-manifests: false
      label: x64
      platforms: '[{"platform":"linux-x64","runner":"ubuntu-24.04"}]'

  install-arm64:
    needs: [changes, linux-arm64-native, install-x64]
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['install-arm64']
    uses: ./.github/workflows/install-smoke.yml
    with:
      # install-x64 lints the install scripts.
      lint: false
      shared-agents: true
      merge-manifests: false
      label: arm64
      platforms: '[{"platform":"linux-arm64","runner":"ubuntu-24.04-arm"}]'

  install-macos:
    needs: [changes, macos-native, install-x64]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['install-macos']
    uses: ./.github/workflows/install-smoke.yml
    with:
      # install-x64 lints the install scripts.
      lint: false
      shared-agents: true
      merge-manifests: false
      label: macos
      platforms: '[{"platform":"darwin-arm64","runner":"macos-15"}]'

  install-merge:
    needs: [changes, install-x64, install-arm64, install-macos]
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['install-merge']
    uses: ./.github/workflows/merge-agent-manifests.yml


  ui:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['ui']
    uses: ./.github/workflows/bun-unit.yml
    with:
      macos-native: ${{ needs.changes.outputs.tier == 'integration' || fromJSON(needs.changes.outputs.parts).ui.macos }}

  site:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['site']
    uses: ./.github/workflows/site-check.yml

  ds:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs)['ds']
    uses: ./.github/workflows/ds-site.yml

  ds-approval:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/ds-approval.yml

  lint:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.jobs).lint
    name: Repository and CI lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.licenses == 'true' || needs.changes.outputs.tier == 'integration'
        with:
          node-version: 24
      - name: Validate locked inventory, notices and disclosure
        if: needs.changes.outputs.licenses == 'true' || needs.changes.outputs.tier == 'integration'
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/isolated.py node deploy/licenses/generate.mjs --check
          python3 .github/scripts/isolated.py node deploy/licenses/check.mjs
          python3 .github/scripts/isolated.py python3 deploy/licenses/check-disclosure.py
      - name: Whitespace lint
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        working-directory: ${{ github.workspace }}
        run: |
          if [[ -z "$BASE" || "$BASE" =~ ^0+$ ]]; then BASE=HEAD; fi
          python3 .github/scripts/isolated.py git diff --check "$BASE" HEAD
      - name: Keep work documents in the Project Ledger
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/work-docs-lint.py
      - name: Validate workflow selection invariants
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/isolated.py python3 .github/scripts/test-ci-changes.py
          python3 .github/scripts/isolated.py python3 .github/scripts/test-ci-tool-path.py
          python3 .github/scripts/isolated.py python3 .github/scripts/test-live-e2e-config.py
      - name: Validate main failure follow-up
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/isolated.py python3 .github/scripts/test-ci-main-failure.py
          python3 .github/scripts/isolated.py python3 .github/scripts/test-ci-main-gate.py
      - name: Validate PR receipt reuse
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/isolated.py python3 .github/scripts/test-ci-smoke-reuse.py
          python3 .github/scripts/isolated.py python3 .github/scripts/test-ci-pr-workspace.py
          python3 .github/scripts/isolated.py python3 .github/scripts/test-ci-fixture-scope.py
      - name: Guard shared Windows runner resources
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/test-ci-invariants.py --windows-safety
      - uses: ./.github/actions/setup-oras
      - name: Verify Cargo snapshot and native dependency contracts
        working-directory: ${{ github.workspace }}
        run: |
          python3 .github/scripts/isolated.py python3 .github/scripts/test-cargo-target.py
          python3 .github/scripts/isolated.py python3 .github/scripts/test-cargo-target-walk-back.py
          python3 .github/scripts/isolated.py python3 .github/scripts/test-cargo-units.py
          python3 .github/scripts/isolated.py python3 .github/scripts/test-runner-cache.py
          python3 .github/scripts/isolated.py python3 .github/scripts/test-native-deps.py
          python3 .github/scripts/isolated.py python3 .github/scripts/test-host-links.py
      - name: Validate release publication recovery
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/test-recover-release.py
      - name: Validate integration proof and branch policy
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          states=$(mktemp "$RUNNER_TEMP/workflow-states.XXXXXX")
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100" > "$states"
          python3 .github/scripts/isolated.py python3 .github/scripts/test-integration-proof.py --active-workflows "$states"
      - name: Lint GitHub workflows
        working-directory: ${{ github.workspace }}
        run: |
          lint_dir=$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")
          trap 'rm -rf "$lint_dir"' EXIT
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.11/actionlint_1.7.11_linux_amd64.tar.gz -o "$lint_dir/actionlint.tar.gz"
          tar -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          python3 .github/scripts/isolated.py "$lint_dir/actionlint" -shellcheck= -pyflakes=

  gate:
    name: ${{ github.event_name == 'workflow_dispatch' && 'dispatch gate' || 'gate' }}
    if: always()
    # Full CI runs take 15-45 min (recent main runs 2-44 min incl. queueing); the metadata
    # re-evaluation waits for one, so allow 2x the slowest recent run.
    timeout-minutes: 90
    needs: [changes, lint, windows-check, shellcheck, ci-invariants, selftest, linux-clippy, linux-native, linux-perf-archive, linux-perf, macos-native, macos-updates, macos-perf-archive, macos-perf, linux-arm64-native, linux-arm64-perf-archive, linux-arm64-perf, linux-archive, linux-tests, macos-archive, macos-tests, macos-package, linux-arm64-archive, linux-arm64-tests, linux-package-x64, linux-package-arm64, install-x64, install-arm64, install-macos, install-merge, ui, site, ds, ds-approval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish successful inputs
        if: always() && needs.changes.result == 'success'
        uses: ./.github/actions/ci-input-receipt
        with:
          results: ${{ toJSON(needs) }}
          groups: '{"workflows": ["lint", "ci-invariants"], "rust": ["linux-clippy", "linux-native", "linux-archive", "linux-tests", "linux-perf-archive", "linux-perf", "macos-native", "macos-archive", "macos-tests", "macos-perf-archive", "macos-perf", "linux-arm64-archive", "linux-arm64-tests", "linux-arm64-perf-archive", "linux-arm64-perf", "windows-check"], "ui": ["ui"], "site": ["site"], "ds": ["ds"], "package": ["macos-native", "macos-archive", "macos-updates", "macos-package", "shellcheck", "selftest"], "linux-package": ["linux-native", "linux-arm64-native", "linux-package-x64", "linux-package-arm64", "linux-archive", "linux-arm64-archive"], "install": ["linux-native", "linux-arm64-native", "macos-native", "install-x64", "install-arm64", "install-macos", "install-merge", "linux-archive", "linux-arm64-archive", "macos-archive"], "licenses": ["lint"], "signing": ["shellcheck", "selftest"]}'
          workflow: rust-quality.yml
      - name: Require main recovery or a permitted bypass
        if: always() && github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/ci-main-gate.py
      - name: Preserve existing quality result on metadata edits
        if: always() && github.event_name == 'pull_request' && contains(fromJSON('["labeled", "unlabeled", "edited"]'), github.event.action)
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/ci-main-gate.py quality
      - name: Require every selected check
        if: always() && !contains(fromJSON('["labeled", "unlabeled", "edited"]'), github.event.action)
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/check-gate.py
      - name: Require DS approval
        if: always() && github.event_name == 'pull_request'
        env:
          RESULT: ${{ needs.ds-approval.result }}
        run: test "$RESULT" = success

  # Emit compatibility contexts only where a ruleset still requires them:
  # release ruleset 24548681 (until preview.13); main 17887396 requires gate only.
  # Dispatch is diagnostic and must never post required legacy contexts.
  legacy-gates:
    name: ${{ matrix.context }}
    if: always() && ((github.event_name == 'pull_request' && startsWith(github.base_ref, 'release/')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')))
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        context: ['post-merge-ci gate', 'licenses gate', 'macos-signing gate']
    runs-on: ubuntu-latest
    steps:
      - name: Require consolidated gate
        working-directory: ${{ runner.temp }}
        env:
          RESULT: ${{ needs.gate.result }}
        run: test "$RESULT" = success
