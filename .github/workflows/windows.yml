name: Butler Windows Package

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  package-build:
    name: Windows package build
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/butler-app/client/electron/package-lock.json
            packages/butler-app/client/ui/package-lock.json
      - name: Install package dependencies
        run: ./packages/butler-app/scripts/windows/run-windows-ci.ps1 -Mode Setup
      - name: Build and verify Windows package artifacts
        run: ./packages/butler-app/scripts/windows/run-windows-ci.ps1 -Mode Package
      - name: Retain Windows package-build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: butler-windows-package-${{ github.sha }}
          path: ~/.butler-release-validation/win32-x64/
          if-no-files-found: error
          retention-days: 7
