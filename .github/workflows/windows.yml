# Disabled manually in Actions settings; not a release gate.
# Windows release evidence: windows-preview-smoke.yml, windows-installer.yml, e2e.yml.
name: Butler Windows Desktop Source

on:
  push:
    branches: ['release/**']
  pull_request:
permissions:
  actions: read
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      workflow: windows.yml

  desktop-source:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && ((needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['desktop-source']) || (needs.changes.outputs.tier != 'integration' && (needs.changes.outputs.ui == 'true' || needs.changes.outputs.package == 'true')))
    name: Windows Electron and UI checks
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: ./.github/actions/product-features
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/butler-app/client/electron/package-lock.json
            packages/butler-app/client/ui/package-lock.json
      - name: Install package dependencies
        run: ./packages/butler-app/scripts/windows/run-windows-ci.ps1 -Mode Setup
      - name: Check Electron and UI source
        run: ./packages/butler-app/scripts/windows/run-windows-ci.ps1 -Mode Quality
      - name: Build UI assets
        run: npm.cmd --prefix packages/butler-app/client/ui run build

  gate:
    name: windows gate
    if: always()
    needs: [changes, desktop-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish successful inputs
        if: always() && needs.changes.result == 'success'
        uses: ./.github/actions/ci-input-receipt
        with:
          results: ${{ toJSON(needs) }}
          groups: '{"ui": ["desktop-source"], "package": ["desktop-source"]}'
          workflow: windows.yml
      - name: Require selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          CHECK_GROUPS: '{"desktop-source": ["ui", "package"]}'
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/ci-check-selected.py
