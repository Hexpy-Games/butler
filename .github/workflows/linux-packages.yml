name: Linux packages

# Linux App packages (#260 Linux track): the Electron App with the bundled
# native Butler Agent (prebuilt ORT in CI, portable static ORT on tagged
# releases, #261) as a DEB for x64 and arm64 and an Arch package for x64. Every
# package is installed in a clean distribution container and its agent is run
# headless (start, /health, stop).
# Artifacts only: nothing is published to a GitHub Release.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/linux-packages.yml"
      - ".github/actions/rust-agent-setup/**"
      - "packages/butler-agent/rust/Cargo.lock"
      - "packages/butler-agent/rust/crates/butler-agent/Cargo.toml"
      - "packages/butler-agent/rust/crates/butler-gateway/Cargo.toml"
      - "packages/butler-agent/rust/crates/butler-memory/Cargo.toml"
      - "packages/butler-agent/rust/scripts/prepare-static-ort.py"
      - "packages/butler-app/scripts/release/package-linux-app.ts"
      - "packages/butler-app/scripts/release/linux-package-smoke.sh"
      - "packages/butler-app/client/electron/scripts/prepare-native-agent.mjs"
      - "packages/butler-app/client/electron/bundled-native-agent.mjs"

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            formats: --format=deb --format=pacman
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            formats: --format=deb
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust and the selected ONNX Runtime
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'static-ort' || 'prebuilt-ort' }}
          cache-key: package-${{ matrix.target }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: |
            packages/butler-app/client/electron/package-lock.json
            packages/butler-app/client/ui/package-lock.json

      - name: Install package tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot libarchive-tools pacman-package-manager zstd
          command -v dpkg-deb makepkg readelf

      - name: Install App client dependencies and build the renderer
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          npm --prefix packages/butler-app/client/electron ci
          npm --prefix packages/butler-app/client/ui ci
          npm --prefix packages/butler-app/client/ui run build

      # The payload producer accepts this binary and does not rebuild the agent.
      - name: Build the native agent
        working-directory: packages/butler-agent/rust
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            cargo build --release --locked -p butler-agent --bin butler-agent --no-default-features --features static-ort
          else
            cargo build --release --locked -p butler-agent --bin butler-agent --no-default-features --features prebuilt-ort
          fi
          echo "BUTLER_NATIVE_AGENT_EXECUTABLE=$PWD/target/release/butler-agent" >> "$GITHUB_ENV"

      - name: Package the App
        run: |
          bun run packages/butler-app/scripts/release/package-linux-app.ts \
            --platform=${{ matrix.target }} ${{ matrix.formats }} --out=dist/release/app-linux

      - name: Inspect the packages
        run: |
          set -euo pipefail
          cd dist/release/app-linux
          sha256sum -c ./*.sha256
          for deb in ./*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb" | grep -E ' \./(usr/bin/butler-app|opt/butler/Butler-linux-[a-z0-9]+/resources/bundled-agent/bin/butler-agent)$'
          done
          for pkg in ./*.pkg.tar.zst; do
            [ -e "$pkg" ] || continue
            bsdtar -tf "$pkg" | grep -qx '.PKGINFO'
            bsdtar -tf "$pkg" | grep -qx 'opt/butler/Butler-linux-x64/resources/bundled-agent/bin/butler-agent'
          done
          ls -l

      - name: Upload the packages
        uses: actions/upload-artifact@v4
        with:
          name: butler-app-${{ matrix.target }}
          path: dist/release/app-linux/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Install smoke (${{ matrix.image }}, ${{ matrix.target }} ${{ matrix.format }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, format: deb, image: "ubuntu:24.04" }
          - { target: linux-x64, runner: ubuntu-24.04, format: deb, image: "debian:trixie" }
          - { target: linux-x64, runner: ubuntu-24.04, format: pacman, image: "archlinux:base-20260927.0.600689@sha256:eb8f6dcc89a38977c9735f10fcf6ae4afe496283e7008eb7a3420cdba31fbd04" }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, format: deb, image: "ubuntu:24.04" }
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the packages
        uses: actions/download-artifact@v4
        with:
          name: butler-app-${{ matrix.target }}
          path: ${{ runner.temp }}/packages

      - name: Install the package in a clean container and run the agent headless
        env:
          IMAGE: ${{ matrix.image }}
          FORMAT: ${{ matrix.format }}
        run: |
          set -euo pipefail
          case "$FORMAT" in
            deb) pattern='butler-app-*.deb' ;;
            pacman) pattern='butler-app-*.pkg.tar.zst' ;;
          esac
          package="$(cd "$RUNNER_TEMP/packages" && ls $pattern)"
          docker run --rm \
            -v "$RUNNER_TEMP/packages:/packages:ro" \
            -v "$PWD/packages/butler-app/scripts/release:/smoke:ro" \
            "$IMAGE" sh /smoke/linux-package-smoke.sh "/packages/$package"

  report-failure:
    name: Report main or nightly failure
    if: >-
      always() &&
      (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      contains(needs.*.result, 'failure')
    needs: [package, smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: ci-failure-report-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update issue
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_LABEL: ${{ github.event_name == 'schedule' && 'nightly' || 'main push' }}
        run: |
          title='Nightly Rust CI failure'
          body="The $EVENT_LABEL Linux package checks failed: $RUN_URL"
          number="$(gh issue list --state open --limit 1000 --json number,title --jq '.[] | select(.title == "Nightly Rust CI failure") | .number' | head -1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
