name: Publish pinned native dependencies
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packages/butler-agent/rust/scripts/prepare-static-ort.py
      - packages/butler-agent/rust/scripts/static_ort_*.py
      - packages/butler-agent/rust/scripts/static-ort-key-compat.json
      - packages/butler-agent/rust/scripts/static-ort.lock.json
      - packages/butler-agent/rust/rust-toolchain.toml
      - .github/workflows/native-deps.yml
      - packages/butler-agent/rust/scripts/ci_oci.py
permissions:
  contents: read
  packages: write
concurrency:
  group: native-deps-publisher
  cancel-in-progress: false
jobs:
  publish:
    name: Publish ${{ matrix.label }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            label: linux-x64
            owner: false
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            label: linux-arm64
            owner: false
          - target: macos-arm64
            runner: macos-15
            label: macos-arm64
            owner: false
          - target: windows-x64
            runner: windows-latest
            label: windows-hosted
            owner: false
          - target: windows-x64
            runner: [self-hosted, Windows, X64, butler-win]
            label: windows-owner
            owner: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        env:
          # Process scope only; the runner service policy remains unchanged.
          PSExecutionPolicyPreference: Bypass
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        if: ${{ !matrix.owner }}
        with:
          toolchain: 1.91.0
      - name: Set up owner Rust in workspace cache
        if: matrix.owner
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        run: |
          $tools = Join-Path $env:GITHUB_WORKSPACE 'target/windows-owner/toolchains'
          $env:CARGO_HOME = Join-Path $tools 'cargo'
          $env:RUSTUP_HOME = Join-Path $tools 'rustup'
          $rustup = Join-Path $env:CARGO_HOME 'bin/rustup.exe'
          if (!(Test-Path $rustup)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest -UseBasicParsing 'https://win.rustup.rs/x86_64' -OutFile $installer
            & $installer --default-toolchain none --no-modify-path --profile minimal -y
            if ($LASTEXITCODE -ne 0) { throw 'Owner Rust bootstrap failed' }
          }
          & $rustup toolchain install 1.91.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Pinned owner Rust toolchain installation failed' }
          & $rustup default 1.91.0
          if ($LASTEXITCODE -ne 0) { throw 'Pinned owner Rust toolchain selection failed' }
          @("CARGO_HOME=$env:CARGO_HOME", "RUSTUP_HOME=$env:RUSTUP_HOME") |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $env:CARGO_HOME 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: ./.github/actions/setup-oras
      - name: Build once and publish verified SDK
        if: ${{ !matrix.owner }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TARGET: ${{ matrix.target }}
          # Owner SDK cache stays inside this runner's own workspace (#557).
          CARGO_TARGET_DIR: ${{ matrix.owner && format('{0}/target/windows-owner/native-deps', github.workspace) || format('{0}/ort-cache', runner.temp) }}
          PYTHONDONTWRITEBYTECODE: '1'
          RUSTC_WRAPPER: ''
        run: |
          python .github/scripts/isolated.py python .github/scripts/ci-store-publish.py native-deps "$NATIVE_TARGET"
      - name: Build and publish owner-toolset SDK
        if: matrix.owner
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_TARGET: ${{ matrix.target }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-owner/native-deps
          PYTHONDONTWRITEBYTECODE: '1'
          RUSTC_WRAPPER: ''
        run: |
          python .github/scripts/isolated.py python .github/scripts/ci-store-publish.py native-deps $env:NATIVE_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Native SDK publication failed' }
