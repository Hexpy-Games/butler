name: Archived Rust tests
on:
  workflow_call:
    inputs:
      workspace:
        type: boolean
        default: true
      e2e-shards:
        type: string
        default: '[1,2,3,4,5,6,"ins-02","ins-14","install"]'
      perf-shards:
        type: string
        default: '[1,2,3]'
      e2e:
        type: boolean
        default: true
      performance-only:
        type: boolean
        default: false
      runner:
        type: string
        default: ubuntu-24.04
      platform:
        type: string
        default: linux-x64
permissions:
  contents: read
jobs:
  browser-fixtures:
    if: ${{ !inputs.performance-only && inputs.e2e && inputs.platform == 'darwin-arm64' }}
    name: Offline browser fixtures
    runs-on: ${{ inputs.runner }}
    env:
      BUTLER_EXPECT_SANDBOX: ${{ startsWith(inputs.platform, 'linux-') && 'linux' || startsWith(inputs.platform, 'darwin-') && 'macos' || 'unavailable' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-setup
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v4
        with:
          name: rust-${{ inputs.platform }}
          path: ${{ runner.temp }}/rust-archive
      - name: Prepare the existing Agent and Electron UI
        run: |
          chmod +x "$RUNNER_TEMP/rust-archive/butler-agent" "$RUNNER_TEMP/rust-archive/window-capture"
          python3 .github/scripts/isolated.py bun install --frozen-lockfile
          # Keep Electron's first-install stdout out of the executable path below.
          python3 .github/scripts/isolated.py node packages/butler-app/client/electron/node_modules/electron/install.js
          python3 .github/scripts/isolated.py bun run app:ui:build
      - name: Run canvas and route fixtures with stub model responses
        env:
          BUTLER_NATIVE_AGENT_EXECUTABLE: ${{ runner.temp }}/rust-archive/butler-agent
          BUTLER_WINDOW_CAPTURE_EXECUTABLE: ${{ runner.temp }}/rust-archive/window-capture
          BUTLER_E2E_TIER: stub
        run: |
          BUTLER_SMOKE_ELECTRON_EXECUTABLE="$(node -p "require('./packages/butler-app/client/electron/node_modules/electron')")"
          export BUTLER_SMOKE_ELECTRON_EXECUTABLE
          python3 .github/scripts/isolated.py bun tests/smoke/app-legacy-data-smoke.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/canvas"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-canvas-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/route"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-route-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/batch"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-batch-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/round2"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-round2-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/still-lifecycle"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-still-lifecycle-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/still-delivery"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-still-delivery-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/still-timeline"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-still-timeline-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/gaps"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-gaps-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/busy"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-busy-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/handoff-visible"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-handoff-visible-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/site-data"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-site-data-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/agent-mute"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-agent-mute-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/paint"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-paint-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/efficiency"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-efficiency-electron.ts
          export BUTLER_BROWSER_EVIDENCE="$RUNNER_TEMP/browser-fixtures/icons"
          python3 .github/scripts/isolated.py bun tests/smoke/browser-icons-electron.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-fixtures-${{ inputs.platform }}
          path: ${{ runner.temp }}/browser-fixtures
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: ./.github/actions/assert-home-untouched
  app-flows:
    if: ${{ !inputs.performance-only && inputs.e2e && inputs.platform == 'darwin-arm64' }}
    name: App user flows (${{ inputs.platform }} ${{ matrix.part }})
    runs-on: ${{ inputs.runner }}
    env:
      BUTLER_EXPECT_SANDBOX: macos
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [ui-core, ui-settings, ui-work, browser-tabs, browser-shell, browser-input]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bun-setup
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: actions/download-artifact@v4
        with:
          name: rust-${{ inputs.platform }}
          path: ${{ runner.temp }}/rust-archive
      - name: Prepare the existing Agent and Electron UI
        run: |
          chmod +x "$RUNNER_TEMP/rust-archive/butler-agent" "$RUNNER_TEMP/rust-archive/window-capture" "$RUNNER_TEMP/rust-archive/e2e-task-graph"
          python3 .github/scripts/isolated.py bun install --frozen-lockfile
          python3 .github/scripts/isolated.py node packages/butler-app/client/electron/node_modules/electron/install.js
          python3 .github/scripts/isolated.py bun run app:ui:build
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/butler-smoke-browsers"
          python3 .github/scripts/isolated.py bunx playwright install chromium
      - name: Run App user flows with stub model responses
        env:
          PART: ${{ matrix.part }}
          BUTLER_NATIVE_AGENT_EXECUTABLE: ${{ runner.temp }}/rust-archive/butler-agent
          BUTLER_FIRST_RUN_NATIVE_AGENT_EXECUTABLE: ${{ runner.temp }}/rust-archive/butler-agent
          BUTLER_WINDOW_CAPTURE_EXECUTABLE: ${{ runner.temp }}/rust-archive/window-capture
          BUTLER_TASK_GRAPH_BUILDER_EXECUTABLE: ${{ runner.temp }}/rust-archive/e2e-task-graph
          BUTLER_E2E_TIER: stub
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/butler-smoke-browsers"
          BUTLER_SMOKE_ELECTRON_EXECUTABLE="$(node -p "require('./packages/butler-app/client/electron/node_modules/electron')")"
          export BUTLER_SMOKE_ELECTRON_EXECUTABLE
          smoke() {
            local name="$1" variable
            local evidence="$RUNNER_TEMP/app-flows/$name"
            mkdir -p "$evidence"
            for variable in BUTLER_BROWSER_EVIDENCE BUTLER_SMOKE_EVIDENCE BUTLER_SMOKE_SCREENSHOTS \
              BUTLER_SIGNIN_HANDOFF_EVIDENCE BUTLER_WAIT_HANDOFF_EVIDENCE BUTLER_COMPOSER_FOLD_OUT \
              HOOK_SCREENSHOTS BUTLER_TRACE_SHOTS HOOK_PROMPT_SCREENSHOTS \
              BUTLER_CLEAR_CHAT_SHOTS BUTLER_SETTINGS_BUGS_OUT BUTLER_ANSWER_EVIDENCE \
              BUTLER_SECURITY_BIND_SHOTS BUTLER_APPROVAL_ACTIVITY_SHOTS BUTLER_IMPORT_EVIDENCE \
              BUTLER_COMPOSER_MODEL_SHOTS BUTLER_LOGS_SHOTS BUTLER_OVERVIEW_SCREENSHOTS; do
              export "$variable=$evidence"
            done
            python3 .github/scripts/isolated.py bun "tests/smoke/$name.ts"
          }
          case "$PART" in
            ui-core)
              smoke open-source-licenses-smoke
              smoke hooks-settings-smoke
              smoke sidebar-group-drop
              smoke app-canon-board-smoke
              smoke composer-model-fallback-smoke
              smoke sidebar-new-chat-smoke
              smoke settings-trace-smoke
              smoke browser-wait-handoff-smoke
              smoke app-question-continuation-smoke
              smoke approval-activity-smoke
              smoke app-output-viewer-smoke
              smoke app-canon-progress-smoke
              ;;
            ui-settings)
              smoke app-security-pairing-smoke
              smoke app-full-reset-smoke
              smoke schedule-ux-smoke
              smoke settings-security-approvals-smoke
              smoke sidebar-drag-scroll
              smoke sidebar-add-menu-smoke
              smoke settings-bugs-smoke
              smoke app-usage-subtask-share-smoke
              smoke app-delegated-work-smoke
              smoke answer-blocks-ui
              smoke block-scraps-ui
              smoke documents-ui
              smoke composer-fold-smoke
              ;;
            ui-work)
              smoke app-ask-user-smoke
              smoke app-branch-actions-smoke
              smoke app-consent-smoke
              smoke general-clear-chat-smoke
              smoke app-security-bind-error-smoke
              smoke settings-logs-smoke
              smoke app-sidebar-unread-smoke
              smoke signin-handoff-smoke
              smoke app-canon-sidebar-smoke
              smoke hook-prompt-smoke
              smoke app-live-delegation-smoke
              smoke app-session-subtasks-smoke
              smoke app-canon-tags-smoke
              ;;
            browser-tabs)
              smoke browser-tab-move-electron
              smoke app-open-in-app-smoke
              smoke app-attachment-viewer-smoke
              smoke app-attachment-thumbnails-smoke
              smoke first-run-redesign-smoke
              smoke browser-agent-electron
              smoke browser-file-picker-electron
              smoke browser-ownership-electron
              smoke browser-library-electron
              smoke browser-journey-electron
              smoke app-task-graph-smoke
              ;;
            browser-input)
              smoke browser-pick-native-electron
              smoke browser-selection-electron
              smoke browser-pointer-input-electron
              smoke browser-scrap-native-electron
              smoke links-open-inapp-electron
              smoke library-organize-electron
              ;;
            browser-shell)
              smoke browser-wait-durable-electron
              smoke provider-signin-external-electron
              smoke browser-import-oneclick
              smoke app-first-run-setup-smoke
              smoke browser-popups-dialogs-electron
              smoke browser-control-electron
              smoke browser-downloads-electron
              smoke browser-shell-electron
              smoke browser-capture-detach-electron
              smoke browser-area-electron
              smoke browser-history-electron
              smoke browser-preview-app
              ;;
          esac
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-flows-${{ inputs.platform }}-${{ matrix.part }}
          path: ${{ runner.temp }}/app-flows
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: ./.github/actions/assert-home-untouched
  workspace:
    if: ${{ !inputs.performance-only && inputs.workspace }}
    runs-on: ${{ inputs.runner }}
    env:
      BUTLER_EXPECT_SANDBOX: ${{ startsWith(inputs.platform, 'linux-') && 'linux' || startsWith(inputs.platform, 'darwin-') && 'macos' || 'unavailable' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: rust-${{ inputs.platform }}
          path: ${{ runner.temp }}/rust-archive
      - name: List and run workspace tests without rebuilding
        working-directory: packages/butler-agent/rust
        run: |
          isolate="$GITHUB_WORKSPACE/.github/scripts/isolated.py"
          args=(--archive-file "$RUNNER_TEMP/rust-archive/tests.tar.zst" --workspace-remap "$PWD" -E 'not package(=butler-e2e)')
          python3 "$isolate" cargo-nextest nextest list "${args[@]}"
          python3 "$isolate" cargo-nextest nextest --config-file "$GITHUB_WORKSPACE/.config/nextest.toml" run "${args[@]}" --no-fail-fast --retries 0
  e2e:
    if: ${{ !inputs.performance-only && inputs.e2e && inputs.e2e-shards != '[]' }}
    name: E2E (${{ inputs.platform }} ${{ matrix.shard }})
    runs-on: ${{ inputs.runner }}
    env:
      BUTLER_EXPECT_SANDBOX: ${{ startsWith(inputs.platform, 'linux-') && 'linux' || startsWith(inputs.platform, 'darwin-') && 'macos' || 'unavailable' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.e2e-shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: rust-${{ inputs.platform }}
          path: ${{ runner.temp }}/rust-archive
      # The answer-blocks fixture table also runs its TypeScript contract.
      - uses: ./.github/actions/bun-setup
      - name: Install the TypeScript contract dependencies
        run: python3 .github/scripts/isolated.py bun install --frozen-lockfile
      - name: Select measured shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # Preserve nextest's original CPU-based default, capped for this graph.
          # Eight simultaneous Agents oversubscribe the smaller macOS runners.
          echo "E2E_THREADS=$(python3 -c 'import os; print(min(8, os.cpu_count() or 1))')" >> "$GITHUB_ENV"
          if [ "$SHARD" = install ]; then
            echo 'test(/::ins_/) and not test(/::ins_02_/) and not test(/::ins_14_/)' > "$RUNNER_TEMP/rust-archive/install.txt"
          elif [ "$SHARD" = ins-02 ] || [ "$SHARD" = ins-14 ]; then
            number="${SHARD#ins-}"
            echo "test(/::ins_${number}_/)" > "$RUNNER_TEMP/rust-archive/install.txt"
          else
            cp "$RUNNER_TEMP/rust-archive/shard-$SHARD.txt" "$RUNNER_TEMP/rust-archive/install.txt"
          fi
      - name: Supply the prebuilt web read probe
        run: |
          chmod +x "$RUNNER_TEMP/rust-archive/web-access-smoke"
          echo "BUTLER_E2E_WEB_PROBE_BIN=$RUNNER_TEMP/rust-archive/web-access-smoke" >> "$GITHUB_ENV"
      - uses: ./.github/actions/e2e-stub
        with:
          archive-file: ${{ runner.temp }}/rust-archive/tests.tar.zst
          agent-binary: ${{ runner.temp }}/rust-archive/butler-agent
          filter-file: ${{ runner.temp }}/rust-archive/install.txt
          restore-embedding-model: ${{ !contains(fromJSON('["install", "ins-02", "ins-14"]'), matrix.shard) }}
          run-systemd: ${{ matrix.shard == 'ins-14' }}
          run-idle-disk: ${{ matrix.shard == 1 }}
          test-threads: ${{ env.E2E_THREADS }}
      - if: always()
        uses: ./.github/actions/assert-home-untouched
  perf:
    if: inputs.performance-only && inputs.perf-shards != '[]'
    name: Performance (${{ inputs.platform }} ${{ matrix.shard }})
    runs-on: ${{ inputs.runner }}
    env:
      BUTLER_EXPECT_SANDBOX: ${{ startsWith(inputs.platform, 'linux-') && 'linux' || startsWith(inputs.platform, 'darwin-') && 'macos' || 'unavailable' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.perf-shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@v4
        with:
          name: perf-rust-${{ inputs.platform }}
          path: ${{ runner.temp }}/rust-archive
      - uses: actions/download-artifact@v4
        with:
          name: rust-${{ inputs.platform }}
          path: ${{ runner.temp }}/fault-agent
      - name: Supply the existing Agent with debug fault hooks
        run: |
          chmod +x "$RUNNER_TEMP/fault-agent/butler-agent"
          echo "BUTLER_E2E_FAULT_BIN=$RUNNER_TEMP/fault-agent/butler-agent" >> "$GITHUB_ENV"
      # Budgeted browser preview scenarios start their fixture servers with Bun.
      - uses: ./.github/actions/bun-setup
      - uses: actions/download-artifact@v4
        with:
          name: agent-perf-fixture-${{ inputs.platform }}
          path: ${{ runner.temp }}/perf-agent
      - uses: ./.github/actions/e2e-stub
        with:
          archive-file: ${{ runner.temp }}/rust-archive/tests.tar.zst
          # The shipped native recipe plus only the e2e-fixtures feature.
          agent-binary: ${{ runner.temp }}/perf-agent/butler-agent
          enforce-budgets: "true"
          exclude-perf: "false"
          filter-file: ${{ format('{0}/rust-archive/perf-{1}.txt', runner.temp, matrix.shard) }}
          run-systemd: "false"
          test-threads: "1"
          success-output: final
      - if: always()
        uses: ./.github/actions/assert-home-untouched

      - name: Report session-view p95
        if: always()
        env:
          PERF_LOG: ${{ runner.temp }}/e2e-stub.log
          PLATFORM: ${{ inputs.platform }}
          FILTER_FILE: ${{ runner.temp }}/rust-archive/perf-${{ matrix.shard }}.txt
        shell: bash
        run: |
          python3 - "$PERF_LOG" <<'PY'
          import os
          import pathlib
          import re
          import sys

          log_path = pathlib.Path(sys.argv[1])
          if 'perf_01_' not in pathlib.Path(os.environ['FILTER_FILE']).read_text():
              sys.exit(0)
          text = log_path.read_text(errors="replace") if log_path.exists() else ""
          values = re.findall(r"session-view p95 ([0-9]+(?:\.[0-9]+)?)(ns|µs|μs|ms|s)", text)
          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not values:
              summary = f"### E2E perf ({os.environ['PLATFORM']})\n\nSession-view p95: unavailable. Target: 50 ms; hard gate: under 50 ms.\n"
              with summary_path.open("a") as output:
                  output.write(summary)
              print("::error::PERF-01 did not report a session-view p95 measurement")
              sys.exit(1)

          value, unit = values[-1]
          p95_ms = float(value) * {"ns": 1e-6, "µs": 1e-3, "μs": 1e-3, "ms": 1, "s": 1e3}[unit]
          summary = (
              f"### E2E perf ({os.environ['PLATFORM']})\n\n"
              f"Session-view p95: **{p95_ms:.3f} ms**. Target: **50 ms**; hard gate: **under 50 ms**.\n"
          )
          with summary_path.open("a") as output:
              output.write(summary)
          print(summary, end="")
          if p95_ms > 50:
              print(f"::warning::PERF-01 session-view p95 {p95_ms:.3f} ms exceeds the 50 ms target")
          PY
