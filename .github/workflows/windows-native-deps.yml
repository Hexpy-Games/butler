name: Prepare Windows native dependencies

on:
  workflow_call:

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare pinned static ORT
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-native-deps
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: static-ort
          cache-key: windows-native-deps
      # Preserve the recipe's archives, output hashes and complete marker.
      # Consumers verify them again; a cold build stays out of the Agent job.
      # upload-artifact traverses symlinks with Node stat, which cannot read
      # FlatBuffers' Windows source-tree links. Tar preserves the full verified
      # cache (including ort-sys' _deps link) without that traversal.
      - name: Archive verified native dependency cache
        shell: bash
        run: |
          set -euo pipefail
          export HOME=$(mktemp -d) BUTLER_DATA=$(mktemp -d)
          cache_root="$(cygpath -u "$RUNNER_TEMP")"
          tar -czf "$cache_root/windows-native-deps.tar.gz" -C "$cache_root/ort-cache" native-deps
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-deps
          path: ${{ runner.temp }}/windows-native-deps.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
