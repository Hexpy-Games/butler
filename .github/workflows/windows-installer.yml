name: Windows Squirrel install and update
on:
  workflow_dispatch:
    inputs:
      hosted-only:
        description: Build and verify on disposable GitHub-hosted runners only
        required: false
        type: boolean
        default: false
      native-cache:
        description: Task Cargo cache namespace on the native Windows build host
        required: false
        type: string
      candidate-version:
        description: Exact preview candidate (empty keeps the synthetic .90 to .91 check)
        required: false
        type: string
      baseline-tag:
        description: Published preview to additionally install and update to the candidate
        required: false
        type: string
      reuse-run:
        description: Completed BUILD run to reuse after product-source equality verification
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !inputs.reuse-run }}
    name: Build Windows Squirrel artifacts
    runs-on: ${{ inputs.hosted-only && 'windows-latest' || fromJSON('["self-hosted", "butler-win"]') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-owner-setup
        if: ${{ !inputs.hosted-only }}
        with:
          workflow: ${{ inputs.native-cache || 'windows-agent-v1' }}
      - uses: ./.github/actions/build-windows-agent
        with:
          owner-runner: ${{ inputs.hosted-only && 'false' || 'true' }}
          profile: ci-fast
          cache-key: windows-installer
          version: ${{ inputs.candidate-version && '0.1.0-preview.0' || '0.1.0-preview.90' }}
          artifact-base-url: http://127.0.0.1/unused
      - uses: ./.github/actions/package-windows-app
        with:
          owner-runner: ${{ inputs.hosted-only && 'false' || 'true' }}
          version: ${{ inputs.candidate-version && '0.1.0-preview.0' || '0.1.0-preview.90' }}
      - name: Preserve the first packages
        shell: pwsh
        run: |
          Move-Item dist/release/app-windows dist/release/app-windows-first
          Move-Item dist/release/agent dist/release/agent-first
      - uses: ./.github/actions/build-windows-agent
        with:
          owner-runner: ${{ inputs.hosted-only && 'false' || 'true' }}
          profile: ci-fast
          cache-key: windows-installer
          version: ${{ inputs.candidate-version || '0.1.0-preview.91' }}
          artifact-base-url: http://127.0.0.1/unused
      - uses: ./.github/actions/package-windows-app
        with:
          owner-runner: ${{ inputs.hosted-only && 'false' || 'true' }}
          version: ${{ inputs.candidate-version || '0.1.0-preview.91' }}
      - name: Compile existing public update E2Es without running them
        shell: pwsh
        run: ./deploy/windows-installer-contracts.ps1 -Mode Build
      - name: Pack every installer fixture with complete checksums
        shell: pwsh
        run: python .github/scripts/isolated.py python deploy/windows-installer-transport.py pack dist/release dist/release/installer-transport
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-preview
          path: dist/release/installer-transport/
          if-no-files-found: error
          compression-level: 0
      - name: Verify owner registration and clean job profile
        if: ${{ always() && !inputs.hosted-only }}
        shell: pwsh
        run: ./deploy/windows-owner-cleanup.ps1

  verify:
    name: Verify Windows install update uninstall
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.reuse-run) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable package sources before reuse
        if: inputs.reuse-run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse-run }}
        run: ./deploy/windows-installer-reuse.ps1 -RunId $env:REUSE_RUN
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse-run || github.run_id }}
          name: windows-installer-preview
          path: dist/release/installer-transport
      - name: Reconstruct and verify every original fixture byte
        shell: pwsh
        run: python .github/scripts/isolated.py python deploy/windows-installer-transport.py restore dist/release dist/release/installer-transport
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run existing public update E2Es from built artifacts
        shell: pwsh
        run: ./deploy/windows-installer-contracts.ps1 -Mode Verify
      - name: Prove Squirrel ordering and real install/update/uninstall
        shell: pwsh
        env:
          BUTLER_WINDOWS_SMOKE_FROM: ${{ inputs.candidate-version && '0.1.0-preview.0' || '0.1.0-preview.90' }}
          BUTLER_WINDOWS_SMOKE_TO: ${{ inputs.candidate-version || '0.1.0-preview.91' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory $profile | Out-Null
          $env:HOME = Join-Path $profile 'home'
          $env:BUTLER_DATA = Join-Path $profile 'data'
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            bun install --frozen-lockfile --ignore-scripts
            if ($LASTEXITCODE) { throw 'Dependency installation failed' }
            ./packages/butler-app/scripts/windows/verify-squirrel-version.ps1 -Squirrel packages/butler-app/client/electron/node_modules/electron-winstaller/vendor/Squirrel.exe
            bun run packages/butler-app/scripts/windows/installer-smoke.ts dist/release/app-windows-first dist/release/app-windows
            if ($LASTEXITCODE) { throw 'Installer/update smoke failed' }
          } finally { Remove-Item -Recurse -Force $profile }
      - name: Update the published baseline through Settings to this candidate
        if: inputs.baseline-tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_TAG: ${{ inputs.baseline-tag }}
          BUTLER_WINDOWS_SMOKE_TO: ${{ inputs.candidate-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BASELINE_TAG -notmatch '^v0\.1\.0-preview\.\d+$') { throw 'Expected a published preview baseline' }
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          $env:HOME = Join-Path $profile 'home'
          $env:BUTLER_DATA = Join-Path $profile 'data'
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            $env:BUTLER_WINDOWS_SMOKE_FROM = $env:BASELINE_TAG.Substring(1)
            $baseline = Join-Path $profile 'baseline'
            gh release download $env:BASELINE_TAG --dir $baseline --pattern 'ButlerSetup-*-x64.exe*'
            if ($LASTEXITCODE) { throw 'Published baseline download failed' }
            bun run packages/butler-app/scripts/windows/installer-smoke.ts $baseline dist/release/app-windows
            if ($LASTEXITCODE) { throw 'Published baseline to candidate update failed' }
          } finally { Remove-Item -Recurse -Force $profile }
      - name: Verify desktop startup handoff against a gated stub gateway
        shell: pwsh
        run: |
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          $env:HOME = Join-Path $profile 'home'
          $env:BUTLER_DATA = Join-Path $profile 'data'
          $env:BUTLER_STARTUP_EVIDENCE = 'dist/startup-installer-evidence/splash'
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            node packages/butler-app/client/electron/node_modules/electron/install.js
            if ($LASTEXITCODE) { throw 'Electron download failed' }
            bun run app:ui:build
            if ($LASTEXITCODE) { throw 'Renderer build failed' }
            bun run tests/smoke/startup-splash.ts
            if ($LASTEXITCODE) { throw 'Startup smoke failed' }
          } finally { Remove-Item -Recurse -Force $profile }
      - name: Prove legacy-data refusal and desktop recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory $profile | Out-Null
          $env:HOME = Join-Path $profile 'home'
          $env:BUTLER_DATA = Join-Path $profile 'data'
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            $archive = @(Get-ChildItem dist/release/app-windows-first/*-windows-x64-portable.zip)
            if ($archive.Count -ne 1) { throw 'Expected one portable App archive' }
            Expand-Archive $archive[0].FullName (Join-Path $profile 'portable')
            $app = Join-Path $profile 'portable/Butler-win32-x64/Butler.exe'
            bun run packages/butler-app/scripts/windows/legacy-data-smoke.ts $app
            if ($LASTEXITCODE) { throw 'Legacy-data recovery smoke failed' }
          } finally { Remove-Item -Recurse -Force $profile }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-installer-evidence
          path: dist/startup-installer-evidence/
          if-no-files-found: warn
