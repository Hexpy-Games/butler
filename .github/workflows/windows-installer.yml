name: Windows Squirrel install and update
on:
  workflow_dispatch:
    inputs:
      reuse-run:
        description: Completed BUILD run to reuse after product-source equality verification
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !inputs.reuse-run }}
    name: Build Windows Squirrel artifacts
    runs-on: [self-hosted, butler-win]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-owner-setup
        with:
          workflow: win-installer
      - uses: ./.github/actions/build-windows-agent
        with:
          owner-runner: 'true'
          profile: ci-fast
          cache-key: windows-installer
          version: 0.1.0-preview.90
          artifact-base-url: http://127.0.0.1/unused
      - uses: ./.github/actions/package-windows-app
        with:
          owner-runner: 'true'
          version: 0.1.0-preview.90
      - name: Preserve the first packages
        shell: pwsh
        run: |
          Move-Item dist/release/app-windows dist/release/app-windows-first
          Move-Item dist/release/agent dist/release/agent-first
      - uses: ./.github/actions/build-windows-agent
        with:
          owner-runner: 'true'
          profile: ci-fast
          cache-key: windows-installer
          version: 0.1.0-preview.91
          artifact-base-url: http://127.0.0.1/unused
      - uses: ./.github/actions/package-windows-app
        with:
          owner-runner: 'true'
          version: 0.1.0-preview.91
      - name: Compile existing public update E2Es without running them
        shell: pwsh
        run: ./deploy/windows-installer-contracts.ps1 -Mode Build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-preview
          path: |
            dist/release/app-windows-first/
            dist/release/app-windows/
            dist/release/agent-first/
            dist/release/installer-contracts/
          if-no-files-found: error
          compression-level: 0
      - name: Verify owner registration and clean job profile
        if: always()
        shell: pwsh
        run: ./deploy/windows-owner-cleanup.ps1

  verify:
    name: Verify Windows install update uninstall
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || inputs.reuse-run) }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable package sources before reuse
        if: inputs.reuse-run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_RUN: ${{ inputs.reuse-run }}
        run: ./deploy/windows-installer-reuse.ps1 -RunId $env:REUSE_RUN
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse-run || github.run_id }}
          name: windows-installer-preview
          path: dist/release
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run existing public update E2Es from built artifacts
        shell: pwsh
        run: ./deploy/windows-installer-contracts.ps1 -Mode Verify
      - name: Prove Squirrel ordering and real install/update/uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory $profile | Out-Null
          $env:HOME = Join-Path $profile 'home'
          $env:BUTLER_DATA = Join-Path $profile 'data'
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            bun install --frozen-lockfile --ignore-scripts
            if ($LASTEXITCODE) { throw 'Dependency installation failed' }
            ./packages/butler-app/scripts/windows/verify-squirrel-version.ps1 -Squirrel packages/butler-app/client/electron/node_modules/electron-winstaller/vendor/Squirrel.exe
            bun run packages/butler-app/scripts/windows/installer-smoke.ts dist/release/app-windows-first dist/release/app-windows
            if ($LASTEXITCODE) { throw 'Installer/update smoke failed' }
          } finally { Remove-Item -Recurse -Force $profile }
      - name: Prove legacy-data refusal and desktop recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory $profile | Out-Null
          $env:HOME = Join-Path $profile 'home'
          $env:BUTLER_DATA = Join-Path $profile 'data'
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            $archive = @(Get-ChildItem dist/release/app-windows-first/*-windows-x64-portable.zip)
            if ($archive.Count -ne 1) { throw 'Expected one portable App archive' }
            Expand-Archive $archive[0].FullName (Join-Path $profile 'portable')
            $app = Join-Path $profile 'portable/Butler-win32-x64/Butler.exe'
            bun run packages/butler-app/scripts/windows/legacy-data-smoke.ts $app
            if ($LASTEXITCODE) { throw 'Legacy-data recovery smoke failed' }
          } finally { Remove-Item -Recurse -Force $profile }
