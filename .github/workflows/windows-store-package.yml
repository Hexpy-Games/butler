name: Windows Store package check
# On demand only: dispatch it, or add the ci:windows-store label to a PR.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
permissions:
  contents: read
jobs:
  store-package:
    name: Pack, install and verify the Store package
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'ci:windows-store'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows-agent
        with:
          profile: ci-fast
          cache-key: windows-store-package
          version: '0.1.0-preview.0'
          artifact-base-url: http://127.0.0.1/unused
      - uses: ./.github/actions/package-windows-app
        with:
          version: '0.1.0-preview.0'
      - uses: ./.github/actions/windows-store-msix
        with:
          version: '0.1.0-preview.0'
          output: ${{ runner.temp }}/store-package
          check-output: ${{ runner.temp }}/store-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-store-package-check
          path: ${{ runner.temp }}/store-check
          if-no-files-found: warn
          retention-days: 14
