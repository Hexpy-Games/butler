name: Release checksums

on:
  workflow_call:
    inputs:
      tag:
        description: Existing preview tag to refresh after platform recovery
        type: string
        default: ''

permissions:
  contents: write

jobs:
  publish:
    name: Publish consolidated release checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build consolidated checksum asset from every published output
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHECKSUM_TAG: ${{ inputs.tag || github.ref_name }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/publish-release-checksums.py "$CHECKSUM_TAG"

  # Only successful published assets participate; unavailable platforms never
  # introduce nonexistent literal paths or hide another platform's output.
