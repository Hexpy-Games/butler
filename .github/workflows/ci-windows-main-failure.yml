name: Main Windows smoke failure
on:
  workflow_call:
permissions:
  contents: read
  issues: write
jobs:
  report:
    name: Report main Windows smoke failure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Open or update issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh issue list --state open --search '"Main Windows smoke failure" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Main Windows smoke failed: $RUN_URL"
          else
            gh issue create --title 'Main Windows smoke failure' --body "Main Windows smoke failed: $RUN_URL"
          fi
