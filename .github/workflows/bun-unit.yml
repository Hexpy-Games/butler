name: Bun unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: bun-unit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  fast-unit:
    name: Fast Bun unit suite
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run fast unit suite
        run: bun run test:unit:fast

      - name: Assert tests left the runner home untouched
        if: always()
        uses: ./.github/actions/assert-home-untouched
