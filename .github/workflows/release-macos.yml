name: Native macOS release
on:
  workflow_call:
    inputs:
      verify_only:
        description: Build, sign, notarize, staple and verify without publishing anything
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
jobs:
  native-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.verify_only
    name: Build and publish native macOS arm64 artifacts
    runs-on: macos-15
    # Holds the Apple signing secrets; restricted to v* tags (docs: packages/butler-app/scripts/README.md).
    environment: deploy
    env:
      BUTLER_MEMORY_IMPLEMENTATION_COMMIT: ${{ github.sha }}
      # Every signing step, including the App's sign-app, refuses ad-hoc or missing identities.
      BUTLER_SIGN_REQUIRED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The runner context is not available in job-level env.
      - name: Select the native Agent payload directory
        run: echo "BUTLER_NATIVE_AGENT_PAYLOAD=$RUNNER_TEMP/butler-native-agent-payload" >> "$GITHUB_ENV"

      - name: Verify the native runner
        run: test "$(uname -m)" = arm64

      - name: Set up Bun
        uses: ./.github/actions/bun-setup
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/butler-app/client/electron/package-lock.json
            packages/butler-app/client/ui/package-lock.json

      - name: Set up Python
        uses: ./.github/actions/release-python

      - name: Look for an exact-commit release Agent
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          # rust-agent-setup's macOS release recipe; part of the provenance identity.
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Same rule as the Agent build (butler-agent-cli/build.rs): a non-version ref builds <package version>-dev.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("packages/butler-agent/rust/crates/butler-agent-cli/Cargo.toml", "rb"))["package"]["version"])')-dev"
          fi
          python3 .github/scripts/agent-provenance.py reuse "$RUNNER_TEMP/reused-agent" darwin-arm64 static-ort release "$version"

      - name: Read the pinned Rust toolchain
        id: toolchain
        run: python3 -c 'import tomllib; print("channel=" + tomllib.load(open("packages/butler-agent/rust/rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"

      - name: Cache the pinned native Rust build
        if: steps.reuse.outputs.reused != 'true'
        uses: ./.github/actions/rust-agent-setup
        with:
          components: rustfmt,clippy
          native-deps: static-ort
          cache-key: native-darwin-arm64
          cache-workspace-crates: 'true'
          artifact-cache-platform: darwin-arm64
      - name: Pin the toolchain for an exact-commit payload hit
        if: steps.reuse.outputs.reused == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - name: Verify pinned native Rust toolchain
        # The toolchain check remains required even when a payload is reused.
        env:
          PINNED_RUST: ${{ steps.toolchain.outputs.channel }}
        run: |
          rustc --version --verbose | grep -Fx "release: $PINNED_RUST"
          rustc --version --verbose | grep -E '^host: aarch64-apple-darwin$'

      - name: Install app client dependencies
        run: python3 .github/scripts/isolated.py bun install --frozen-lockfile --ignore-scripts

      # The renderer ships in the Agent's resources (app-client/dist).
      - name: Build the App renderer
        run: python3 .github/scripts/isolated.py npm --prefix packages/butler-app/client/ui run build

      - name: Build the native Agent with the verified cached SDK
        if: steps.reuse.outputs.reused != 'true'
        working-directory: packages/butler-agent/rust
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo build --timings -j 8 --release --locked -p butler-agent --bin butler-agent --no-default-features --features static-ort
          echo "BUTLER_NATIVE_AGENT_EXECUTABLE=$PWD/target/release/butler-agent" >> "$GITHUB_ENV"

      - name: Upload Cargo build timings
        if: ${{ always() && steps.reuse.outputs.reused != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-release-macos-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.CARGO_TARGET_DIR || 'packages/butler-agent/rust/target' }}/cargo-timings/*.html
          if-no-files-found: error
          retention-days: 14
      - name: Prepare the native Agent payload
        run: python3 .github/scripts/isolated.py node packages/butler-app/client/electron/scripts/prepare-native-agent.mjs darwin arm64 "$BUTLER_NATIVE_AGENT_PAYLOAD"

      # After every third-party install step: keychain and notary key exist only from here on.
      - name: Set up macOS code signing
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: deploy/macos/sign-and-notarize.sh setup

      - name: Sign and notarize the native Agent binary
        timeout-minutes: 60
        run: |
          deploy/macos/sign-and-notarize.sh agent "$BUTLER_NATIVE_AGENT_PAYLOAD/bin/butler-agent"
          echo "BUTLER_AGENT_NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Select the versioned Agent archive path
        run: |
          set -euo pipefail
          agent_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$BUTLER_NATIVE_AGENT_PAYLOAD/native-agent-manifest.json")"
          echo "BUTLER_AGENT_ARCHIVE=dist/release/agent/butler-agent-${agent_version}-darwin-arm64.tar.gz" >> "$GITHUB_ENV"

      - name: Run the native Agent release gate
        run: python3 .github/scripts/isolated.py bun run release:agent:gate

      - name: Package and smoke the native Agent release
        run: |
          set -euo pipefail
          mkdir -p dist/release/agent
          artifact_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$BUTLER_AGENT_ARCHIVE")"
          python3 .github/scripts/isolated.py bun run release:agent:package -- \
            --artifact-url "$artifact_url"
          python3 .github/scripts/isolated.py bun run release:agent:smoke -- --artifact-url "$artifact_url"

      # Preserve the validated Agent payload even if later App steps fail.
      - name: Keep the darwin-arm64 Agent archive and manifests for the merge
        uses: actions/upload-artifact@v4
        with:
          name: agent-darwin-arm64
          path: |
            dist/release/agent/butler-agent-*-darwin-arm64.tar.gz
            dist/release/agent/agent-release-manifest.json
            dist/release/agent/agent-update-manifest.json
          if-no-files-found: error

      - name: Publish Butler Agent GitHub Release files
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file=".github/releases/${tag}.md"
          if [ ! -f "$notes_file" ] && [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\..+$ ]]; then
            notes_file=".github/releases/${tag%%-preview.*}-preview.md"
          fi
          notes_args=(--notes "Butler Agent release $tag")
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi
          shopt -s nullglob
          files=(
            dist/release/agent/butler-agent-*-darwin-arm64.tar.gz
            dist/release/agent/agent-release-manifest.json
            dist/release/agent/agent-update-manifest.json
          )
          if [ "${#files[@]}" -ne 3 ]; then
            printf 'Expected 3 native Butler Agent release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft --title "$tag" "${notes_args[@]}"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --draft --title "$tag" "${notes_args[@]}"
          fi

      - name: Fetch the previous App release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/release/baseline
          current_tag="${GITHUB_REF_NAME}"
          previous_tag=""
          while IFS= read -r tag; do
            if [ "$tag" = "$current_tag" ]; then
              continue
            fi
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'app-release-manifest.json'; then
              previous_tag="$tag"
              break
            fi
          done < <(gh release list --limit 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          if [ -z "$previous_tag" ]; then
            printf 'No previous app-release-manifest.json asset found. Use --allow-missing-previous-manifest only for the first Butler App release.\n' >&2
            exit 1
          fi
          gh release download "$previous_tag" \
            --pattern app-release-manifest.json \
            --dir dist/release/baseline \
            --clobber
          echo "BUTLER_APP_PREVIOUS_RELEASE_MANIFEST=$PWD/dist/release/baseline/app-release-manifest.json" >> "$GITHUB_ENV"

      - name: Run the native App release gate
        run: python3 .github/scripts/isolated.py bun run release:app:gate -- --platform=darwin-arm64

      - name: Package the native App release
        timeout-minutes: 90
        run: |
          python3 .github/scripts/isolated.py bun run release:app:package -- \
            --platform=darwin-arm64 \
            --out dist/release/app \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Verify the native App release artifacts
        run: python3 .github/scripts/isolated.py bun run release:app:smoke -- --platform=darwin-arm64 --out dist/release/app

      - name: Verify signing, notarization and staple
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dist/release/app/butler-app-*-darwin-arm64.dmg)
          [ "${#dmgs[@]}" -eq 1 ] || { echo "Expected one App DMG, got ${#dmgs[@]}" >&2; exit 1; }
          dmg=${dmgs[0]}
          mount="$RUNNER_TEMP/butler-notarization-report"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount" >/dev/null
          trap 'hdiutil detach "$mount" >/dev/null' EXIT
          app="$mount/Butler.app"
          # Same policy as sign-and-notarize.sh: Apple's ticket service can lag or drop a request.
          check() {
            local i
            printf '\n$ %s\n' "$*"
            for i in 1 2 3; do
              if "$@" 2>&1; then return 0; fi
              if [ "$i" -lt 3 ]; then echo "(attempt $i/3 failed; retrying)"; sleep 15; fi
            done
            return 1
          }
          check codesign --verify --deep --strict --verbose=2 "$app"
          check spctl -a -vvv -t exec "$app"
          check spctl -a -vvv -t open --context context:primary-signature "$dmg"
          check xcrun stapler validate "$app"
          check xcrun stapler validate "$dmg"
          check codesign --verify -R=notarized --check-notarization --verbose=2 "$BUTLER_NATIVE_AGENT_PAYLOAD/bin/butler-agent"

      - name: Preserve validated native App files for publication recovery
        uses: actions/upload-artifact@v4
        with:
          name: app-darwin-arm64
          path: dist/release/app/*
          if-no-files-found: error

      - name: Publish native App GitHub Release files
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(
            dist/release/app/butler-app-*-darwin-arm64.dmg
            dist/release/app/butler-app-*-darwin-arm64.dmg.sha256
            dist/release/app/butler-app-*-darwin-arm64.zip
            dist/release/app/butler-app-*-darwin-arm64.zip.sha256
            dist/release/app/app-release-manifest.json
            dist/release/app/app-update-manifest.json
          )
          if [ "${#files[@]}" -ne 6 ]; then
            printf 'Expected 6 native App release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

      - name: Remove the signing keychain and keys
        if: always()
        run: deploy/macos/sign-and-notarize.sh cleanup
