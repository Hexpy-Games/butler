name: Post-merge CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: post-merge-ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: packages/butler-agent/rust

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      workflow: post-merge-ci.yml

  windows-check:
    # Windows is not ported: the host and CLI are unix-only and main.rs prints
    # "not yet available". This compile check only reports how far the
    # workspace is from building; its failures never fail the workflow.
    name: Windows compile check (x86_64-pc-windows-msvc)
    needs: changes
    outputs:
      compile: ${{ steps.check.outcome }}
    if: always() && !cancelled() && needs.changes.result == 'success' && ((needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['windows-check']) || (needs.changes.outputs.tier != 'integration' && (needs.changes.outputs.rust == 'true')))
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/butler-agent/rust
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Rust and protoc
        uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: prebuilt-ort
          cache-key: windows-check
      - name: Check the workspace
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo check --workspace --locked --keep-going --target x86_64-pc-windows-msvc \
            --message-format short 2>&1 | tee "$RUNNER_TEMP/windows-check.log"
      - name: Summarize
        if: always()
        env:
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          python - "$RUNNER_TEMP/windows-check.log" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, os, re, sys
          pattern = re.compile(r"^(?P<file>[^:\s][^:]*):\d+:\d+: (?P<kind>error|warning)(?:\[(?P<code>\w+)\])?: (?P<text>.*)$")
          errors, files, crates, codes = 0, collections.Counter(), collections.Counter(), collections.Counter()
          failed = []
          try:
              lines = open(sys.argv[1], encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = []
          for line in lines:
              if line.startswith("error: could not compile"):
                  failed.append(line.removeprefix("error: could not compile ").strip())
              match = pattern.match(line)
              if not match or match["kind"] != "error":
                  continue
              path = match["file"].replace("\\", "/")
              errors += 1
              files[path] += 1
              parts = path.split("/")
              crates[parts[1] if parts[0] == "crates" and len(parts) > 1 else parts[0]] += 1
              codes[match["code"] or match["text"][:60]] += 1
          print("### Windows compile check (x86_64-pc-windows-msvc)")
          print(f"Outcome: **{os.environ.get('OUTCOME', 'unknown')}**, {errors} errors.")
          if failed:
              print("\nCould not compile (crates that depend on these were not checked):\n")
              print("\n".join(f"- {item}" for item in failed))
          for title, counter, limit in (("crate", crates, 20), ("file", files, 40), ("error", codes, 20)):
              if counter:
                  print(f"\n| Errors | By {title} |\n| ---: | --- |")
                  print("\n".join(f"| {count} | `{name}` |" for name, count in counter.most_common(limit)))
          PY

  main-issue:
    name: Report main failure
    if: >-
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/main') &&
      (contains(needs.*.result, 'failure') || needs.windows-check.outputs.compile == 'failure')
    needs: [changes, windows-check]
    runs-on: ubuntu-latest
    concurrency:
      group: ci-failure-report-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update issue
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_LABEL: main push
        run: |
          title='Main Rust CI failure'
          body="The $EVENT_LABEL Rust CI failed: $RUN_URL"
          number="$(gh issue list --state open --limit 1000 --json number,title --jq '.[] | select(.title == "Main Rust CI failure") | .number' | head -1)"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gate:
    name: post-merge-ci gate
    if: always()
    needs: [changes, windows-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish successful inputs
        if: always() && needs.changes.result == 'success'
        uses: ./.github/actions/ci-input-receipt
        with:
          results: ${{ toJSON(needs) }}
          groups: '{"rust": ["windows-check"]}'
          workflow: post-merge-ci.yml
      - name: Require selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          CHECK_GROUPS: '{"windows-check": ["rust"]}'
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/ci-check-selected.py
