name: Butler Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  agent-artifact:
    name: Build and publish Butler Agent artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/butler-app/client/ui/package-lock.json

      - name: Install service dependencies
        run: bun install --frozen-lockfile

      - name: Install app web client dependencies
        run: npm --prefix packages/butler-app/client/ui ci

      - name: Run Butler Agent release gate
        run: bun run release:agent:gate

      - name: Package Butler Agent release
        run: |
          bun run release:agent:package \
            --out dist/release/agent \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Smoke Butler Agent release artifact
        run: bun run release:agent:smoke -- --out dist/release/agent

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file=".github/releases/${tag}.md"
          notes_args=(--notes "Butler Agent release $tag")
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi
          shopt -s nullglob
          files=(
            dist/release/agent/butler-agent-*-all.tar.gz
            dist/release/agent/butler-agent-*-all.tar.gz.sha256
            dist/release/agent/agent-release-manifest.json
            dist/release/agent/agent-update-manifest.json
          )
          if [ "${#files[@]}" -ne 4 ]; then
            printf 'Expected 4 Butler Agent release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" "${notes_args[@]}"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$tag" "${notes_args[@]}"
          fi

  app-artifact:
    name: Build and publish app artifacts
    runs-on: macos-latest
    needs: agent-artifact
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/butler-app/client/electron/package-lock.json

      - name: Install app client dependencies
        run: |
          bun install --frozen-lockfile
          npm --prefix packages/butler-app/client/electron ci

      - name: Install Linux package toolchain
        run: |
          brew install dpkg
          command -v dpkg-deb

      - name: Fetch previous app release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/release/baseline
          current_tag="${GITHUB_REF_NAME}"
          previous_tag=""
          while IFS= read -r tag; do
            if [ "$tag" = "$current_tag" ]; then
              continue
            fi
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'app-release-manifest.json'; then
              previous_tag="$tag"
              break
            fi
          done < <(gh release list --limit 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          if [ -z "$previous_tag" ]; then
            printf 'No previous app-release-manifest.json asset found. Use --allow-missing-previous-manifest only for the first Butler App release.\n' >&2
            exit 1
          fi
          gh release download "$previous_tag" \
            --pattern app-release-manifest.json \
            --dir dist/release/baseline \
            --clobber
          echo "BUTLER_APP_PREVIOUS_RELEASE_MANIFEST=$PWD/dist/release/baseline/app-release-manifest.json" >> "$GITHUB_ENV"

      - name: Run app release gate
        run: bun run release:app:gate

      - name: Prepare Linux app-managed Bun payload
        run: |
          set -euo pipefail
          bun_version="$(bun --version)"
          archive="${RUNNER_TEMP}/bun-linux-x64.zip"
          curl -fsSL \
            "https://github.com/oven-sh/bun/releases/download/bun-v${bun_version}/bun-linux-x64.zip" \
            -o "$archive"
          ditto -x -k "$archive" "${RUNNER_TEMP}"
          linux_bun="${RUNNER_TEMP}/bun-linux-x64/bun"
          test -x "$linux_bun"
          file "$linux_bun" | grep -E 'ELF 64-bit.*x86-64'
          echo "BUTLER_APP_MANAGED_BUN_LINUX_X64=$linux_bun" >> "$GITHUB_ENV"
          arm_archive="${RUNNER_TEMP}/bun-linux-aarch64.zip"
          curl -fsSL \
            "https://github.com/oven-sh/bun/releases/download/bun-v${bun_version}/bun-linux-aarch64.zip" \
            -o "$arm_archive"
          ditto -x -k "$arm_archive" "${RUNNER_TEMP}"
          arm_linux_bun="${RUNNER_TEMP}/bun-linux-aarch64/bun"
          test -x "$arm_linux_bun"
          file "$arm_linux_bun" | grep -E 'ELF 64-bit.*aarch64|ELF 64-bit.*ARM aarch64'
          echo "BUTLER_APP_MANAGED_BUN_LINUX_ARM64=$arm_linux_bun" >> "$GITHUB_ENV"

      - name: Package app release
        run: |
          bun run release:app:package \
            --out dist/release/app \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Verify packaged app artifacts
        run: bun run release:app:smoke -- --out dist/release/app

      - name: Publish app GitHub Release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(
            dist/release/app/butler-app-*-darwin-arm64.pkg
            dist/release/app/butler-app-*-darwin-arm64.pkg.sha256
            dist/release/app/butler-app-*-linux-x64.deb
            dist/release/app/butler-app-*-linux-x64.deb.sha256
            dist/release/app/butler-app-*-linux-arm64.deb
            dist/release/app/butler-app-*-linux-arm64.deb.sha256
            dist/release/app/app-release-manifest.json
            dist/release/app/app-update-manifest.json
          )
          if [ "${#files[@]}" -ne 8 ]; then
            printf 'Expected 8 app release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

  app-linux-service-installers:
    name: Build and publish Linux app service installers
    runs-on: ubuntu-latest
    needs: app-artifact
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install package toolchains
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fakeroot libarchive-tools pacman-package-manager rpm zstd
          sudo mkdir -p /var/lib/pacman/local
          sudo chmod -R a+rwx /var/lib/pacman
          command -v dpkg-deb
          command -v makepkg
          command -v rpmbuild
          command -v bsdtar

      - name: Build Linux app service installer packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p dist/release/app dist/release/linux-service
          gh release download "$tag" \
            --pattern 'butler-app-*-linux-x64.deb' \
            --dir dist/release/app \
            --clobber
          gh release download "$tag" \
            --pattern 'butler-app-*-linux-x64.deb.sha256' \
            --dir dist/release/app \
            --clobber
          shopt -s nullglob
          linux_debs=(dist/release/app/butler-app-*-linux-x64.deb)
          linux_deb_checksums=(dist/release/app/butler-app-*-linux-x64.deb.sha256)
          if [ "${#linux_debs[@]}" -ne 1 ] || [ "${#linux_deb_checksums[@]}" -ne 1 ]; then
            printf 'Expected one Linux App deb and checksum, got %s and %s\n' "${#linux_debs[@]}" "${#linux_deb_checksums[@]}" >&2
            printf '%s\n' "${linux_debs[@]}" >&2
            printf '%s\n' "${linux_deb_checksums[@]}" >&2
            exit 1
          fi
          (cd dist/release/app && sha256sum -c "$(basename "${linux_deb_checksums[0]}")")
          dpkg-deb -x "${linux_debs[0]}" dist/release/linux-service
          resource_dir="dist/release/linux-service/opt/butler/Butler-linux-x64/resources/bundled-agent"
          test -f "$resource_dir/service-installer/installer-manifest.json"
          bun packages/butler-app/scripts/release/linux-service-installer-package.ts \
            --resource-dir "$resource_dir" \
            --out dist/release/app \
            --version "$version" \
            --build
          for checksum in dist/release/app/butler-app-service_*.deb.sha256 dist/release/app/butler-app-service-*.pkg.tar.zst.sha256 dist/release/app/butler-app-service-*.rpm.sha256; do
            (cd dist/release/app && sha256sum -c "$(basename "$checksum")")
          done

      - name: Publish Linux app service installer packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(
            dist/release/app/butler-app-service_*_amd64.deb
            dist/release/app/butler-app-service_*_amd64.deb.sha256
            dist/release/app/butler-app-service-*-1-x86_64.pkg.tar.zst
            dist/release/app/butler-app-service-*-1-x86_64.pkg.tar.zst.sha256
            dist/release/app/butler-app-service-*-1.x86_64.rpm
            dist/release/app/butler-app-service-*-1.x86_64.rpm.sha256
          )
          if [ "${#files[@]}" -ne 6 ]; then
            printf 'Expected 6 Linux app service installer files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

  app-arch-artifact:
    name: Build and publish Arch app artifact
    runs-on: ubuntu-latest
    needs: agent-artifact
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/butler-app/client/electron/package-lock.json

      - name: Install release toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fakeroot libarchive-tools pacman-package-manager zstd
          command -v makepkg
          command -v pacman
          command -v bsdtar

      - name: Install app client dependencies
        run: |
          bun install --frozen-lockfile
          npm --prefix packages/butler-app/client/electron ci
          npm --prefix packages/butler-app/client/ui ci

      - name: Package Arch app release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bun-tmp"
          export BUN_TMPDIR="$RUNNER_TEMP/bun-tmp"
          export TMPDIR="$RUNNER_TEMP/bun-tmp"
          bun run release:app:package \
            --platform=linux-x64 \
            --linux-package-format=pacman \
            --out dist/release/app-arch \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Verify Arch app artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/release/app-arch/butler-app-*-1-x86_64.pkg.tar.zst)
          checksums=(dist/release/app-arch/butler-app-*-1-x86_64.pkg.tar.zst.sha256)
          if [ "${#files[@]}" -ne 1 ] || [ "${#checksums[@]}" -ne 1 ]; then
            printf 'Expected one Arch App package and checksum, got %s and %s\n' "${#files[@]}" "${#checksums[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            printf '%s\n' "${checksums[@]}" >&2
            exit 1
          fi
          (cd dist/release/app-arch && sha256sum -c "$(basename "${checksums[0]}")")
          pacman -Qip "${files[0]}"
          pacman -Qlp "${files[0]}" | grep -q '/usr/bin/butler-app$'
          pacman -Qlp "${files[0]}" | grep -q '/usr/lib/systemd/user/butler.service$'

      - name: Publish Arch app artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(
            dist/release/app-arch/butler-app-*-1-x86_64.pkg.tar.zst
            dist/release/app-arch/butler-app-*-1-x86_64.pkg.tar.zst.sha256
          )
          if [ "${#files[@]}" -ne 2 ]; then
            printf 'Expected 2 Arch app release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber
