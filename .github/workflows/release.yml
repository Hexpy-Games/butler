name: Butler Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native-release:
    name: Build and publish native macOS arm64 artifacts
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The runner context is not available in job-level env.
      - name: Select the native Agent payload directory
        run: echo "BUTLER_NATIVE_AGENT_PAYLOAD=$RUNNER_TEMP/butler-native-agent-payload" >> "$GITHUB_ENV"

      - name: Verify the native runner
        run: test "$(uname -m)" = arm64

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/butler-app/client/electron/package-lock.json
            packages/butler-app/client/ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy --target aarch64-apple-darwin
          rustup default 1.91.0
          rustc --version --verbose | grep -E '^release: 1\.91\.0$'
          rustc --version --verbose | grep -E '^host: aarch64-apple-darwin$'

      - name: Install app client dependencies
        run: |
          bun install --frozen-lockfile
          npm --prefix packages/butler-app/client/electron ci
          npm --prefix packages/butler-app/client/ui ci

      - name: Prepare the native Agent payload
        run: node packages/butler-app/client/electron/scripts/prepare-native-agent.mjs darwin arm64 "$BUTLER_NATIVE_AGENT_PAYLOAD"

      - name: Select the versioned Agent archive path
        run: |
          set -euo pipefail
          agent_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$BUTLER_NATIVE_AGENT_PAYLOAD/native-agent-manifest.json")"
          echo "BUTLER_AGENT_ARCHIVE=dist/release/agent/butler-agent-${agent_version}-darwin-arm64.tar.gz" >> "$GITHUB_ENV"

      - name: Run the native Agent release gate
        run: bun run release:agent:gate

      - name: Package and smoke the native Agent release
        run: |
          set -euo pipefail
          mkdir -p dist/release/agent
          artifact_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$BUTLER_AGENT_ARCHIVE")"
          bun run release:agent:package -- \
            --artifact-url "$artifact_url"
          bun run release:agent:smoke -- --artifact-url "$artifact_url"

      - name: Publish Butler Agent GitHub Release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file=".github/releases/${tag}.md"
          notes_args=(--notes "Butler Agent release $tag")
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi
          shopt -s nullglob
          files=(
            dist/release/agent/butler-agent-*-darwin-arm64.tar.gz
            dist/release/agent/agent-release-manifest.json
            dist/release/agent/agent-update-manifest.json
          )
          if [ "${#files[@]}" -ne 3 ]; then
            printf 'Expected 3 native Butler Agent release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" "${notes_args[@]}"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$tag" "${notes_args[@]}"
          fi

      - name: Fetch the previous App release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/release/baseline
          current_tag="${GITHUB_REF_NAME}"
          previous_tag=""
          while IFS= read -r tag; do
            if [ "$tag" = "$current_tag" ]; then
              continue
            fi
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'app-release-manifest.json'; then
              previous_tag="$tag"
              break
            fi
          done < <(gh release list --limit 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          if [ -z "$previous_tag" ]; then
            printf 'No previous app-release-manifest.json asset found. Use --allow-missing-previous-manifest only for the first Butler App release.\n' >&2
            exit 1
          fi
          gh release download "$previous_tag" \
            --pattern app-release-manifest.json \
            --dir dist/release/baseline \
            --clobber
          echo "BUTLER_APP_PREVIOUS_RELEASE_MANIFEST=$PWD/dist/release/baseline/app-release-manifest.json" >> "$GITHUB_ENV"

      - name: Run the native App release gate
        run: bun run release:app:gate -- --platform=darwin-arm64

      # Production signing turns on only when every Developer ID and notary
      # secret is present. Forks and repositories without the secrets keep
      # building an ad-hoc signed App; a partial set fails instead of silently
      # publishing an ad-hoc release.
      - name: Detect macOS signing credentials
        id: macos-signing
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          required=(
            MACOS_DEVELOPER_ID_P12_BASE64
            MACOS_DEVELOPER_ID_P12_PASSWORD
            APPLE_API_KEY_P8_BASE64
            APPLE_API_KEY_ID
            APPLE_API_ISSUER_ID
            APPLE_TEAM_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq "${#required[@]}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=macOS signing::No Developer ID secrets are configured; packaging an ad-hoc signed App."
          elif [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=macOS signing::Missing macOS signing secrets: ${missing[*]}"
            exit 1
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID and notarization credentials
        if: steps.macos-signing.outputs.enabled == 'true'
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          signing_dir="$RUNNER_TEMP/butler-macos-signing"
          keychain="$signing_dir/butler-release.keychain-db"
          notary_profile="butler-release-notary"
          mkdir -p "$signing_dir"
          chmod 700 "$signing_dir"
          umask 077

          # Temporary keychain with a random password; removed in the last step.
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          search_list=()
          while IFS= read -r entry; do
            entry="$(printf '%s' "$entry" | sed -e 's/^[[:space:]]*"//' -e 's/"$//')"
            if [ -n "$entry" ] && [ "$entry" != "$keychain" ]; then
              search_list+=("$entry")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${search_list[@]}"

          # Developer ID Application certificate and private key.
          p12_path="$signing_dir/developer-id-application.p12"
          printf '%s' "$MACOS_DEVELOPER_ID_P12_BASE64" | tr -d '\r\n ' | base64 --decode > "$p12_path"
          security import "$p12_path" -k "$keychain" -f pkcs12 -P "$MACOS_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$p12_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # The exported .p12 carries only the leaf certificate. Apple's Developer ID
          # G2 intermediate lets codesign build the chain to the Apple Root CA.
          curl -fsSL --retry 3 -o "$signing_dir/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$signing_dir/DeveloperIDG2CA.cer" -k "$keychain" > /dev/null
          identity="$(bun run --silent packages/butler-app/scripts/release/mac-signing.ts select-identity \
            --keychain "$keychain" --team-id "$APPLE_TEAM_ID")"

          # App Store Connect API key, stored as a notarytool profile in the same keychain.
          key_path="$signing_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '\r\n ' | base64 --decode > "$key_path"
          xcrun notarytool store-credentials "$notary_profile" \
            --key "$key_path" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --keychain "$keychain"
          rm -f "$key_path"

          {
            echo "BUTLER_APP_SIGN_IDENTITY=$identity"
            echo "BUTLER_APP_SIGN_KEYCHAIN=$keychain"
            echo "BUTLER_APP_NOTARY_KEYCHAIN_PROFILE=$notary_profile"
            echo "BUTLER_APP_NOTARY_KEYCHAIN=$keychain"
            echo "BUTLER_APP_TEAM_ID=$APPLE_TEAM_ID"
            echo "BUTLER_APP_REQUIRE_PRODUCTION_SIGNING=1"
          } >> "$GITHUB_ENV"

      - name: Package the native App release
        run: |
          bun run release:app:package -- \
            --platform=darwin-arm64 \
            --out dist/release/app \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Verify the native App release artifacts
        env:
          BUTLER_APP_RELEASE_SMOKE_MODE: ${{ steps.macos-signing.outputs.enabled == 'true' && 'production' || 'ad-hoc' }}
        run: bun run release:app:smoke -- --platform=darwin-arm64 --out dist/release/app

      - name: Publish native App GitHub Release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(
            dist/release/app/butler-app-*-darwin-arm64.dmg
            dist/release/app/butler-app-*-darwin-arm64.dmg.sha256
            dist/release/app/butler-app-*-darwin-arm64.zip
            dist/release/app/butler-app-*-darwin-arm64.zip.sha256
            dist/release/app/app-release-manifest.json
            dist/release/app/app-update-manifest.json
          )
          if [ "${#files[@]}" -ne 6 ]; then
            printf 'Expected 6 native App release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

      - name: Remove macOS signing credentials
        if: always()
        run: |
          set -uo pipefail
          signing_dir="$RUNNER_TEMP/butler-macos-signing"
          keychain="$signing_dir/butler-release.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain" || true
          fi
          rm -rf "$signing_dir"

  release-checksums:
    name: Publish consolidated release checksums
    runs-on: ubuntu-latest
    needs: native-release
    steps:
      - name: Build consolidated checksum asset from published outputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p dist/release/checksums/assets
          gh release download "$tag" \
            --dir dist/release/checksums/assets \
            --clobber
          shopt -s nullglob
          files=(
            dist/release/checksums/assets/butler-agent-*-darwin-arm64.tar.gz
            dist/release/checksums/assets/agent-release-manifest.json
            dist/release/checksums/assets/agent-update-manifest.json
            dist/release/checksums/assets/butler-app-*-darwin-arm64.dmg
            dist/release/checksums/assets/butler-app-*-darwin-arm64.dmg.sha256
            dist/release/checksums/assets/butler-app-*-darwin-arm64.zip
            dist/release/checksums/assets/butler-app-*-darwin-arm64.zip.sha256
            dist/release/checksums/assets/app-release-manifest.json
            dist/release/checksums/assets/app-update-manifest.json
          )
          if [ "${#files[@]}" -ne 9 ]; then
            printf 'Expected 9 current native release outputs, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          checksum_file="dist/release/checksums/butler-${version}-SHA256SUMS"
          (
            cd dist/release/checksums/assets
            for file in "${files[@]}"; do
              sha256sum "$(basename "$file")"
            done
          ) > "$checksum_file"
          checksum_count="$(wc -l < "$checksum_file" | tr -d ' ')"
          if [ "$checksum_count" -ne 9 ]; then
            printf 'Expected 9 checksummed native release outputs, got %s\n' "$checksum_count" >&2
            cat "$checksum_file" >&2
            exit 1
          fi
          gh release upload "$tag" "$checksum_file" --clobber
