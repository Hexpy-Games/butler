name: Butler Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  agent-artifact:
    name: Build and publish Butler Agent artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/butler-app/client/ui/package-lock.json

      - name: Install service dependencies
        run: bun install --frozen-lockfile

      - name: Install app web client dependencies
        run: npm --prefix packages/butler-app/client/ui ci

      - name: Run Butler Agent release gate
        run: bun run release:agent:gate

      - name: Package Butler Agent release
        run: |
          bun run release:agent:package \
            --out dist/release/agent \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Smoke Butler Agent release artifact
        run: bun run release:agent:smoke -- --out dist/release/agent

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file=".github/releases/${tag}.md"
          notes_args=(--notes "Butler Agent release $tag")
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi
          shopt -s nullglob
          files=(
            dist/release/agent/butler-agent-*-all.tar.gz
            dist/release/agent/agent-release-manifest.json
            dist/release/agent/agent-update-manifest.json
          )
          if [ "${#files[@]}" -ne 3 ]; then
            printf 'Expected 3 Butler Agent release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" "${notes_args[@]}"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$tag" "${notes_args[@]}"
          fi

  app-artifact:
    name: Build and publish app artifacts
    runs-on: macos-latest
    needs: agent-artifact
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/butler-app/client/electron/package-lock.json

      - name: Install app client dependencies
        run: |
          bun install --frozen-lockfile
          npm --prefix packages/butler-app/client/electron ci

      - name: Install Linux package toolchain
        run: |
          brew install dpkg
          command -v dpkg-deb

      - name: Fetch previous app release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/release/baseline
          current_tag="${GITHUB_REF_NAME}"
          previous_tag=""
          while IFS= read -r tag; do
            if [ "$tag" = "$current_tag" ]; then
              continue
            fi
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'app-release-manifest.json'; then
              previous_tag="$tag"
              break
            fi
          done < <(gh release list --limit 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          if [ -z "$previous_tag" ]; then
            printf 'No previous app-release-manifest.json asset found. Use --allow-missing-previous-manifest only for the first Butler App release.\n' >&2
            exit 1
          fi
          gh release download "$previous_tag" \
            --pattern app-release-manifest.json \
            --dir dist/release/baseline \
            --clobber
          echo "BUTLER_APP_PREVIOUS_RELEASE_MANIFEST=$PWD/dist/release/baseline/app-release-manifest.json" >> "$GITHUB_ENV"

      - name: Run app release gate
        run: bun run release:app:gate

      - name: Prepare Linux app-managed Bun payload
        run: |
          set -euo pipefail
          bun_version="$(bun --version)"
          archive="${RUNNER_TEMP}/bun-linux-x64.zip"
          curl -fsSL \
            "https://github.com/oven-sh/bun/releases/download/bun-v${bun_version}/bun-linux-x64.zip" \
            -o "$archive"
          ditto -x -k "$archive" "${RUNNER_TEMP}"
          linux_bun="${RUNNER_TEMP}/bun-linux-x64/bun"
          test -x "$linux_bun"
          file "$linux_bun" | grep -E 'ELF 64-bit.*x86-64'
          echo "BUTLER_APP_MANAGED_BUN_LINUX_X64=$linux_bun" >> "$GITHUB_ENV"
          arm_archive="${RUNNER_TEMP}/bun-linux-aarch64.zip"
          curl -fsSL \
            "https://github.com/oven-sh/bun/releases/download/bun-v${bun_version}/bun-linux-aarch64.zip" \
            -o "$arm_archive"
          ditto -x -k "$arm_archive" "${RUNNER_TEMP}"
          arm_linux_bun="${RUNNER_TEMP}/bun-linux-aarch64/bun"
          test -x "$arm_linux_bun"
          file "$arm_linux_bun" | grep -E 'ELF 64-bit.*aarch64|ELF 64-bit.*ARM aarch64'
          echo "BUTLER_APP_MANAGED_BUN_LINUX_ARM64=$arm_linux_bun" >> "$GITHUB_ENV"

      - name: Configure macOS signing and notarization
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in MACOS_CERTIFICATE_P12 MACOS_CERTIFICATE_PASSWORD MACOS_NOTARY_APPLE_ID MACOS_NOTARY_PASSWORD MACOS_NOTARY_TEAM_ID; do
            test -n "${!name:-}" || { printf 'Missing required release secret: %s\n' "$name" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/butler-signing.keychain-db"
          certificate="$RUNNER_TEMP/butler-signing.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          xcrun notarytool store-credentials butler-notary \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_PASSWORD" \
            --keychain "$keychain"
          echo "BUTLER_APP_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Package app release
        env:
          BUTLER_APP_REQUIRE_PRODUCTION_SIGNING: "1"
          BUTLER_APP_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          BUTLER_APP_NOTARY_KEYCHAIN_PROFILE: butler-notary
        run: |
          bun run release:app:package \
            --out dist/release/app \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Verify packaged app artifacts
        env:
          BUTLER_APP_RELEASE_SMOKE_MODE: production
          BUTLER_APP_REQUIRE_PRODUCTION_SIGNING: "1"
          BUTLER_APP_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          BUTLER_APP_NOTARY_KEYCHAIN_PROFILE: butler-notary
        run: bun run release:app:smoke -- --out dist/release/app

      - name: Publish app GitHub Release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(
            dist/release/app/butler-app-*-darwin-arm64.dmg
            dist/release/app/butler-app-*-darwin-arm64.zip
            dist/release/app/butler-app-*-linux-x64.deb
            dist/release/app/butler-app-*-linux-arm64.deb
            dist/release/app/app-release-manifest.json
            dist/release/app/app-update-manifest.json
          )
          if [ "${#files[@]}" -ne 6 ]; then
            printf 'Expected 6 app release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

  app-arch-artifact:
    name: Build and publish Arch app artifact
    runs-on: ubuntu-latest
    needs: agent-artifact
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/butler-app/client/electron/package-lock.json

      - name: Install release toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fakeroot libarchive-tools pacman-package-manager zstd
          command -v makepkg
          command -v bsdtar

      - name: Install app client dependencies
        run: |
          bun install --frozen-lockfile
          npm --prefix packages/butler-app/client/electron ci
          npm --prefix packages/butler-app/client/ui ci

      - name: Package Arch app release
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bun-tmp"
          export BUN_TMPDIR="$RUNNER_TEMP/bun-tmp"
          export TMPDIR="$RUNNER_TEMP/bun-tmp"
          bun run release:app:package \
            --platform=linux-x64 \
            --linux-package-format=pacman \
            --out dist/release/app-arch \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Verify Arch app artifact
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/release/app-arch/butler-app-*-archlinux-x64.pkg.tar.zst)
          checksums=(dist/release/app-arch/butler-app-*-archlinux-x64.pkg.tar.zst.sha256)
          if [ "${#files[@]}" -ne 1 ] || [ "${#checksums[@]}" -ne 1 ]; then
            printf 'Expected one Arch App package and checksum, got %s and %s\n' "${#files[@]}" "${#checksums[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            printf '%s\n' "${checksums[@]}" >&2
            exit 1
          fi
          (cd dist/release/app-arch && sha256sum -c "$(basename "${checksums[0]}")")
          zstd -t "${files[0]}"
          bsdtar -tf "${files[0]}" | tee dist/release/app-arch/package-contents.txt
          grep -qx '.PKGINFO' dist/release/app-arch/package-contents.txt
          grep -qx 'usr/bin/butler-app' dist/release/app-arch/package-contents.txt
          if grep -qx 'usr/lib/systemd/user/butler.service' dist/release/app-arch/package-contents.txt; then
            echo 'Arch App must not contain an App-owned systemd service' >&2
            exit 1
          fi

      - name: Publish Arch app artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(
            dist/release/app-arch/butler-app-*-archlinux-x64.pkg.tar.zst
          )
          if [ "${#files[@]}" -ne 1 ]; then
            printf 'Expected 1 Arch app release file, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

  release-checksums:
    name: Publish consolidated release checksums
    runs-on: ubuntu-latest
    needs:
      - agent-artifact
      - app-artifact
      - app-arch-artifact
    steps:
      - name: Build consolidated checksum asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p dist/release/checksums/assets
          gh release download "$tag" \
            --dir dist/release/checksums/assets \
            --clobber
          checksum_file="dist/release/checksums/butler-${version}-SHA256SUMS"
          (
            cd dist/release/checksums/assets
            find . -type f ! -name '*SHA256SUMS' -print | sort | while IFS= read -r file; do
              sha256sum "$file" | sed 's#  \./#  #'
            done
          ) > "$checksum_file"
          checksum_count="$(wc -l < "$checksum_file" | tr -d ' ')"
          if [ "$checksum_count" -ne 10 ]; then
            printf 'Expected 10 checksummed release files, got %s\n' "$checksum_count" >&2
            cat "$checksum_file" >&2
            exit 1
          fi
          gh release upload "$tag" "$checksum_file" --clobber
