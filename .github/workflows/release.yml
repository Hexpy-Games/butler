name: Butler Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Recover final publication using artifacts from this release run (no builds)
        required: false
        type: string
      tag:
        description: Optional recovery tag; must match the reused run
        required: false
        type: string
      task-xml-build-run:
        description: Diagnose an immutable Windows preview Agent archive on disposable Windows
        required: false
        type: string
      macos-process-contract:
        description: Verify process identity while an exited child is unreaped
        required: false
        type: boolean
        default: false
      task-startup-contract:
        description: Run the full startup contract against the immutable Windows Agent archive
        required: false
        type: boolean
        default: false
      runner:
        type: choice
        options: [self, hosted]
        default: self
        description: Windows build host (select a release tag as the ref)

permissions:
  contents: write
  actions: read

jobs:
  integration-proof:
    if: ${{ !inputs.reuse_run_id && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require complete integration evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BUTLER_RELEASE_OWNER: ${{ vars.BUTLER_RELEASE_OWNER }}
          BUTLER_RELEASE_COORDINATORS: ${{ vars.BUTLER_RELEASE_COORDINATORS }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/integration-proof.py

  macos-process-contract:
    if: ${{ !inputs.reuse_run_id && inputs.macos-process-contract }}
    name: Verify macOS unreaped process identity
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: packages/butler-agent/rust
          shared-key: macos-process-identity
      - name: Prove live identity and unreaped exit behavior
        working-directory: packages/butler-agent/rust
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          isolated=$(mktemp -d)
          trap 'rm -rf "$isolated"' EXIT
          mkdir "$isolated/home" "$isolated/data"
          HOME="$isolated/home" BUTLER_DATA="$isolated/data" cargo test --locked -j 8 -p butler-platform --test contract instance_lock_is_released_when_its_identified_holder_is_terminated -- --nocapture --test-threads=1
      - name: Check platform contracts
        working-directory: packages/butler-agent/rust
        run: |
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup"
          isolated=$(mktemp -d)
          trap 'rm -rf "$isolated"' EXIT
          mkdir "$isolated/home" "$isolated/data"
          HOME="$isolated/home" BUTLER_DATA="$isolated/data" cargo clippy --locked -j 8 -p butler-platform --all-targets -- -D warnings

  task-xml-contract:
    if: ${{ !inputs.reuse_run_id && inputs.task-xml-build-run }}
    name: Verify imported Windows Task Scheduler XML
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.task-xml-build-run }}
          name: agent-windows-x64
          path: artifacts
      - name: Compare imported XML and enforce ownership
        shell: pwsh
        run: |
          if ('${{ inputs.task-startup-contract }}' -eq 'true') {
            ./deploy/windows-task-xml-probe.ps1 -ArchiveDirectory "$pwd/artifacts" -StartupContract
          } else {
            ./deploy/windows-task-xml-probe.ps1 -ArchiveDirectory "$pwd/artifacts"
          }

  native-release:
    needs: integration-proof
    if: ${{ !inputs.reuse_run_id && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/release-macos.yml
    secrets: inherit

  agent-linux-x64:
    needs: integration-proof
    if: ${{ !inputs.reuse_run_id && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/release-linux-agent.yml
    with:
      platform: linux-x64
      runner: ubuntu-24.04

  agent-linux-arm64:
    needs: integration-proof
    if: ${{ !inputs.reuse_run_id && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/release-linux-agent.yml
    with:
      platform: linux-arm64
      runner: ubuntu-24.04-arm

  agent-windows-build:
    needs: integration-proof
    name: Build unsigned Windows x64 Agent preview
    if: ${{ !inputs.reuse_run_id && startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-preview.') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ inputs.runner == 'hosted' && 'windows-latest' || fromJSON('["self-hosted", "butler-win"]') }}
    concurrency:
      group: windows-release-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-owner-setup
        if: inputs.runner != 'hosted'
        with:
          workflow: windows-agent-v1
      - uses: ./.github/actions/build-windows-agent
        with:
          owner-runner: ${{ inputs.runner != 'hosted' }}
          profile: release
          cache-key: package-windows-x64
          artifact-base-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x64
          path: dist/release/agent/*
          if-no-files-found: error
      - name: Verify basic Windows capabilities before release
        shell: pwsh
        working-directory: packages/butler-agent/rust
        run: |
          $env:CARGO_HOME = "$env:USERPROFILE/.cargo"
          $env:RUSTUP_HOME = "$env:USERPROFILE/.rustup"
          $agent = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/butler-agent.exe"
          ../../../deploy/windows-basic-capabilities.ps1 -Agent $agent
      - name: Check owner registration and remove job profile
        if: always() && inputs.runner != 'hosted'
        shell: pwsh
        run: ./deploy/windows-owner-cleanup.ps1

  agent-windows:
    name: Verify unsigned Windows x64 Agent preview
    if: ${{ !inputs.reuse_run_id }}
    needs: agent-windows-build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-windows-x64
          path: dist/release/agent
      - name: Smoke the installed archive
        shell: pwsh
        run: |
          try { ./deploy/windows-preview-smoke.ps1 }
          finally {
            if ($env:WINDOWS_PREVIEW_TEMP_ROOT -and (Test-Path $env:WINDOWS_PREVIEW_TEMP_ROOT)) {
              Remove-Item $env:WINDOWS_PREVIEW_TEMP_ROOT -Recurse -Force
            }
          }

  app-windows:
    name: Package unsigned Windows Squirrel App
    needs: agent-windows-build
    if: ${{ !inputs.reuse_run_id && contains(github.ref_name, '-preview.') }}
    runs-on: ${{ inputs.runner == 'hosted' && 'windows-latest' || fromJSON('["self-hosted", "butler-win"]') }}
    concurrency:
      group: windows-app-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-windows-x64
          path: dist/release/agent
      - uses: ./.github/actions/windows-owner-setup
        if: inputs.runner != 'hosted'
        with:
          workflow: win-installer-release
      - uses: ./.github/actions/package-windows-app
        with:
          owner-runner: ${{ inputs.runner != 'hosted' }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows-x64
          path: dist/release/app-windows/*
          if-no-files-found: error
      - name: Verify owner registration and clean job profile
        if: always() && inputs.runner != 'hosted'
        shell: pwsh
        run: ./deploy/windows-owner-cleanup.ps1

  # Runs after the macOS job, whose single-platform manifests it replaces with
  # the merged ones (the update manifest lists one artifact per platform).
  agent-release:
    name: Publish successful Agent archives, merged manifests and installers
    runs-on: ubuntu-latest
    needs: [native-release, agent-linux-x64, agent-linux-arm64, agent-windows]
    if: ${{ always() && !cancelled() && !inputs.reuse_run_id && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the exact npm release asset without registry publication
        run: python3 .github/scripts/isolated.py python3 deploy/npm/pack-release.py "$GITHUB_REF_NAME" dist/release/npm

      # install.sh refuses an archive whose Agent version is not the release's.
      - name: Check the tag against the Agent version
        run: |
          set -euo pipefail
          agent_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' packages/butler-agent/rust/crates/butler-agent-cli/Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          # Preview tags share the base Cargo Agent version; keep the full tag
          # for release URLs and the npm next dist-tag.
          release_version="${tag_version%%-*}"
          if [ "$release_version" != "$agent_version" ]; then
            printf 'Tag %s does not match the Agent version %s in crates/butler-agent-cli/Cargo.toml\n' "$GITHUB_REF_NAME" "$agent_version" >&2
            exit 1
          fi

      - name: Download the per-platform Agent outputs
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: dist/agent

      - name: Merge the Agent manifests
        run: |
          set -euo pipefail
          inputs=()
          for directory in dist/agent/agent-*; do
            if [ -f "$directory/agent-release-manifest.json" ] && [ -f "$directory/agent-update-manifest.json" ]; then
              inputs+=("$directory")
            fi
          done
          test "${#inputs[@]}" -gt 0
          python3 packages/butler-agent/rust/scripts/release-standalone-agent.py merge \
            --output dist/agent/merged "${inputs[@]}"

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            dist/agent/agent-*/butler-agent-*.tar.gz
            dist/agent/agent-*/butler-agent-*.zip
            dist/agent/agent-*/butler-agent-*.zip.sha256
            dist/agent/merged/agent-release-manifest.json
            dist/agent/merged/agent-update-manifest.json
            deploy/install.sh
            deploy/install.ps1
            dist/release/npm/*.tgz
            dist/release/npm/*.tgz.sha256
          )
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Butler release $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  app-linux-x64:
    if: ${{ !inputs.reuse_run_id && startsWith(github.ref, 'refs/tags/v') }}
    name: Build and smoke Linux App packages
    needs: agent-linux-x64
    # The reusable workflow declares an issues-writing main/nightly reporter.
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/linux-packages.yml
    with:
      label: release-x64
      platforms: '[{"target":"linux-x64","runner":"ubuntu-24.04","formats":"--format=deb --format=pacman"}]'
      smokes: '[{"target":"linux-x64","runner":"ubuntu-24.04","format":"deb","image":"ubuntu:24.04"},{"target":"linux-x64","runner":"ubuntu-24.04","format":"deb","image":"debian:trixie"},{"target":"linux-x64","runner":"ubuntu-24.04","format":"pacman","image":"archlinux:base-20260927.0.600689@sha256:eb8f6dcc89a38977c9735f10fcf6ae4afe496283e7008eb7a3420cdba31fbd04"}]'
      shared-agents: true
      agent-prefix: release-agent

  app-linux-arm64:
    if: ${{ !inputs.reuse_run_id && startsWith(github.ref, 'refs/tags/v') }}
    name: Build and smoke Linux App packages
    needs: agent-linux-arm64
    permissions:
      contents: read
      actions: read
      issues: write
    uses: ./.github/workflows/linux-packages.yml
    with:
      label: release-arm64
      platforms: '[{"target":"linux-arm64","runner":"ubuntu-24.04-arm","formats":"--format=deb"}]'
      smokes: '[{"target":"linux-arm64","runner":"ubuntu-24.04-arm","format":"deb","image":"ubuntu:24.04"}]'
      shared-agents: true
      agent-prefix: release-agent

  app-linux-release:
    name: Attach Linux App packages to the draft release
    runs-on: ubuntu-latest
    needs: [agent-release, app-linux-x64, app-linux-arm64]
    if: ${{ always() && !cancelled() && needs.agent-release.result == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the Linux App packages
        uses: actions/download-artifact@v4
        with:
          pattern: butler-app-linux-*
          path: dist/release/app-linux
          merge-multiple: true

      - name: Upload packages and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash deploy/app/publish-release-artifacts.sh linux

  app-manifests:
    name: Publish successful Windows artifacts and merged App update manifest
    runs-on: ubuntu-latest
    needs: [native-release, agent-release, app-linux-release, app-windows]
    if: ${{ always() && !cancelled() && needs.agent-release.result == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.app-windows.result == 'success'
        with:
          name: app-windows-x64
          path: dist/release/app-windows
      - name: Merge only published platforms
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash deploy/app/publish-release-artifacts.sh manifest

  release-checksums:
    needs: [agent-release, app-manifests]
    if: ${{ always() && !cancelled() && needs.agent-release.result == 'success' }}
    uses: ./.github/workflows/release-checksums.yml

  publish-release:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    needs: release-checksums
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$prerelease"

  # After the release is public, so `npx @hexpygames/butler install` works the
  # moment the package is visible. Tag runs only; PRs get the pack dry run in
  # install-smoke.yml.
  npm-publish:
    name: Publish the npm package
    # Preview packages are published by the owner after desktop verification.
    if: ${{ !inputs.reuse_run_id && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    needs: publish-release
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ github.ref_name }}
      forward_dispatch: true

  recover-release:
    name: Recover publication from immutable build artifacts
    if: inputs.reuse_run_id != ''
    runs-on: ubuntu-latest
    concurrency:
      group: release-publication-recovery
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the source run, tag, commit and required artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
          RECOVERY_TAG: ${{ inputs.tag }}
          RECOVERY_REF: ${{ github.ref }}
        run: python3 .github/scripts/recover-release.py prepare
      - name: Check out the exact release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: release-source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download immutable artifacts from the original run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.reuse_run_id }}
          github-token: ${{ github.token }}
          pattern: ${{ steps.source.outputs.pattern }}
          path: release-source/dist/recovery
      - name: Merge, pack, checksum and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ steps.source.outputs.tag }}
        working-directory: release-source
        run: python3 ../.github/scripts/isolated.py python3 ../.github/scripts/recover-release.py publish dist/recovery

  recover-npm:
    name: Recover stable npm publication
    needs: recover-release
    if: ${{ !contains(needs.recover-release.outputs.tag, '-') }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ needs.recover-release.outputs.tag }}
      skip_if_published: true
      forward_dispatch: true
