name: Butler Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  native-release:
    name: Build and publish native macOS arm64 artifacts
    runs-on: macos-15
    # Holds the Apple signing secrets; restricted to v* tags (docs: packages/butler-app/scripts/README.md).
    environment: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The runner context is not available in job-level env.
      - name: Select the native Agent payload directory
        run: echo "BUTLER_NATIVE_AGENT_PAYLOAD=$RUNNER_TEMP/butler-native-agent-payload" >> "$GITHUB_ENV"

      - name: Verify the native runner
        run: test "$(uname -m)" = arm64

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/butler-app/client/electron/package-lock.json
            packages/butler-app/client/ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy --target aarch64-apple-darwin
          rustup default 1.91.0
          rustc --version --verbose | grep -E '^release: 1\.91\.0$'
          rustc --version --verbose | grep -E '^host: aarch64-apple-darwin$'

      - name: Install app client dependencies
        run: |
          export HOME=$(mktemp -d) BUTLER_DATA=$(mktemp -d)
          bun install --frozen-lockfile --ignore-scripts

      # The renderer ships in the Agent's resources (app-client/dist).
      - name: Build the App renderer
        run: |
          export HOME=$(mktemp -d) BUTLER_DATA=$(mktemp -d)
          npm --prefix packages/butler-app/client/ui run build

      - name: Prepare the native Agent payload
        run: node packages/butler-app/client/electron/scripts/prepare-native-agent.mjs darwin arm64 "$BUTLER_NATIVE_AGENT_PAYLOAD"

      # After every third-party install step: keychain and notary key exist only from here on.
      - name: Set up macOS code signing
        env:
          BUTLER_SIGN_REQUIRED: "1"
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: deploy/macos/sign-and-notarize.sh setup

      - name: Sign and notarize the native Agent binary
        timeout-minutes: 60
        run: |
          deploy/macos/sign-and-notarize.sh agent "$BUTLER_NATIVE_AGENT_PAYLOAD/bin/butler-agent"
          notarized=1
          if [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\..+$ ]]; then notarized=0; fi
          echo "BUTLER_AGENT_NOTARIZED=$notarized" >> "$GITHUB_ENV"

      - name: Select the versioned Agent archive path
        run: |
          set -euo pipefail
          agent_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"])' "$BUTLER_NATIVE_AGENT_PAYLOAD/native-agent-manifest.json")"
          echo "BUTLER_AGENT_ARCHIVE=dist/release/agent/butler-agent-${agent_version}-darwin-arm64.tar.gz" >> "$GITHUB_ENV"

      - name: Run the native Agent release gate
        run: bun run release:agent:gate

      - name: Package and smoke the native Agent release
        run: |
          set -euo pipefail
          mkdir -p dist/release/agent
          artifact_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$BUTLER_AGENT_ARCHIVE")"
          bun run release:agent:package -- \
            --artifact-url "$artifact_url"
          bun run release:agent:smoke -- --artifact-url "$artifact_url"

      # The darwin-arm64 entries of the multi-platform Agent manifests.
      - name: Keep the darwin-arm64 Agent manifests for the merge
        uses: actions/upload-artifact@v4
        with:
          name: agent-darwin-arm64
          path: |
            dist/release/agent/agent-release-manifest.json
            dist/release/agent/agent-update-manifest.json
          if-no-files-found: error

      - name: Publish Butler Agent GitHub Release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes_file=".github/releases/${tag}.md"
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-preview\..+$ ]]; then
            notes_file=".github/releases/${tag%%-preview.*}-preview.md"
          fi
          notes_args=(--notes "Butler Agent release $tag")
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi
          shopt -s nullglob
          files=(
            dist/release/agent/butler-agent-*-darwin-arm64.tar.gz
            dist/release/agent/agent-release-manifest.json
            dist/release/agent/agent-update-manifest.json
          )
          if [ "${#files[@]}" -ne 3 ]; then
            printf 'Expected 3 native Butler Agent release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --draft --title "$tag" "${notes_args[@]}"
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --draft --title "$tag" "${notes_args[@]}"
          fi

      - name: Fetch the previous App release manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/release/baseline
          current_tag="${GITHUB_REF_NAME}"
          previous_tag=""
          while IFS= read -r tag; do
            if [ "$tag" = "$current_tag" ]; then
              continue
            fi
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -qx 'app-release-manifest.json'; then
              previous_tag="$tag"
              break
            fi
          done < <(gh release list --limit 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')
          if [ -z "$previous_tag" ]; then
            printf 'No previous app-release-manifest.json asset found. Use --allow-missing-previous-manifest only for the first Butler App release.\n' >&2
            exit 1
          fi
          gh release download "$previous_tag" \
            --pattern app-release-manifest.json \
            --dir dist/release/baseline \
            --clobber
          echo "BUTLER_APP_PREVIOUS_RELEASE_MANIFEST=$PWD/dist/release/baseline/app-release-manifest.json" >> "$GITHUB_ENV"

      - name: Run the native App release gate
        run: bun run release:app:gate -- --platform=darwin-arm64

      - name: Package the native App release
        timeout-minutes: 90
        run: |
          bun run release:app:package -- \
            --platform=darwin-arm64 \
            --out dist/release/app \
            --artifact-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"

      - name: Verify the native App release artifacts
        run: bun run release:app:smoke -- --platform=darwin-arm64 --out dist/release/app

      - name: Publish native App GitHub Release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(
            dist/release/app/butler-app-*-darwin-arm64.dmg
            dist/release/app/butler-app-*-darwin-arm64.dmg.sha256
            dist/release/app/butler-app-*-darwin-arm64.zip
            dist/release/app/butler-app-*-darwin-arm64.zip.sha256
            dist/release/app/app-release-manifest.json
            dist/release/app/app-update-manifest.json
          )
          if [ "${#files[@]}" -ne 6 ]; then
            printf 'Expected 6 native App release files, got %s\n' "${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

      - name: Remove the signing keychain and keys
        if: always()
        run: deploy/macos/sign-and-notarize.sh cleanup

  agent-linux:
    name: Build Linux Agent archive (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build, package and smoke the Agent archive
        uses: ./.github/actions/build-agent-archive
        with:
          cache-key: package-${{ matrix.platform }}
          ort-mode: static-ort
          artifact-base-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}

      - name: Keep the archive and its manifests for the release
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}
          path: dist/release/agent/*
          if-no-files-found: error

  agent-windows:
    name: Build unsigned Windows x64 Agent preview
    if: contains(github.ref_name, '-preview.')
    runs-on: windows-latest
    timeout-minutes: 100
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-release
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows-agent
        with:
          cache-key: package-windows-x64
          artifact-base-url: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
      - name: Smoke the installed archive
        shell: pwsh
        run: ./deploy/windows-preview-smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: agent-windows-x64
          path: dist/release/agent/*
          if-no-files-found: error

  # Runs after the macOS job, whose single-platform manifests it replaces with
  # the merged ones (the update manifest lists one artifact per platform).
  agent-release:
    name: Publish successful Agent archives, merged manifests and installers
    runs-on: ubuntu-latest
    needs: [native-release, agent-linux, agent-windows]
    if: ${{ always() && !cancelled() }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # install.sh refuses an archive whose Agent version is not the release's.
      - name: Check the tag against the Agent version
        run: |
          set -euo pipefail
          agent_version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' packages/butler-agent/rust/crates/butler-agent/Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          # Preview tags share the base Cargo Agent version; keep the full tag
          # for release URLs and the npm next dist-tag.
          release_version="${tag_version%%-*}"
          if [ "$release_version" != "$agent_version" ]; then
            printf 'Tag %s does not match the Agent version %s in crates/butler-agent/Cargo.toml\n' "$GITHUB_REF_NAME" "$agent_version" >&2
            exit 1
          fi

      - name: Download the per-platform Agent outputs
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: dist/agent

      - name: Merge the Agent manifests
        run: |
          set -euo pipefail
          inputs=()
          for directory in dist/agent/agent-*; do
            if [ -f "$directory/agent-release-manifest.json" ] && [ -f "$directory/agent-update-manifest.json" ]; then
              inputs+=("$directory")
            fi
          done
          test "${#inputs[@]}" -gt 0
          python3 packages/butler-agent/rust/scripts/release-standalone-agent.py merge \
            --output dist/agent/merged "${inputs[@]}"

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(
            dist/agent/agent-*/butler-agent-*.tar.gz
            dist/agent/agent-*/butler-agent-*.zip
            dist/agent/agent-*/butler-agent-*.zip.sha256
            dist/agent/merged/agent-release-manifest.json
            dist/agent/merged/agent-update-manifest.json
            deploy/install.sh
            deploy/install.ps1
          )
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Butler release $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  app-linux:
    name: Build and smoke Linux App packages
    # The reusable workflow declares an issues-writing main/nightly reporter.
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/linux-packages.yml

  app-linux-release:
    name: Attach Linux App packages to the draft release
    runs-on: ubuntu-latest
    needs: [native-release, app-linux]
    steps:
      - name: Download the Linux App packages
        uses: actions/download-artifact@v4
        with:
          pattern: butler-app-linux-*
          path: dist/release/app-linux
          merge-multiple: true

      - name: Upload packages and their checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Like the Agent archives, preview tags use the base component version.
          version="${GITHUB_REF_NAME#v}"
          version="${version%%-*}"
          cd dist/release/app-linux
          files=(
            "butler-app-${version}-linux-x64.deb"
            "butler-app-${version}-linux-arm64.deb"
            "butler-app-${version}-archlinux-x64.pkg.tar.zst"
          )
          for file in "${files[@]}"; do
            test -f "$file"
            sha256sum -c "$file.sha256"
          done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" "${files[@]/%/.sha256}" --clobber

  release-checksums:
    name: Publish consolidated release checksums
    runs-on: ubuntu-latest
    needs: [native-release, agent-release, app-linux-release]
    if: ${{ always() && !cancelled() && needs.agent-release.result == 'success' }}
    steps:
      - name: Build consolidated checksum asset from published outputs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          mkdir -p dist/release/checksums/assets
          gh release download "$tag" \
            --dir dist/release/checksums/assets \
            --clobber
          shopt -s nullglob
          files=(
            dist/release/checksums/assets/butler-agent-*-darwin-arm64.tar.gz
            dist/release/checksums/assets/butler-agent-*-linux-x64.tar.gz
            dist/release/checksums/assets/butler-agent-*-linux-arm64.tar.gz
            dist/release/checksums/assets/butler-agent-*-windows-x64.zip
            dist/release/checksums/assets/butler-agent-*-windows-x64.zip.sha256
            dist/release/checksums/assets/install.ps1
            dist/release/checksums/assets/install.sh
            dist/release/checksums/assets/agent-release-manifest.json
            dist/release/checksums/assets/agent-update-manifest.json
            dist/release/checksums/assets/butler-app-*-darwin-arm64.dmg
            dist/release/checksums/assets/butler-app-*-darwin-arm64.dmg.sha256
            dist/release/checksums/assets/butler-app-*-darwin-arm64.zip
            dist/release/checksums/assets/butler-app-*-darwin-arm64.zip.sha256
            dist/release/checksums/assets/app-release-manifest.json
            dist/release/checksums/assets/app-update-manifest.json
            dist/release/checksums/assets/butler-app-*-linux-x64.deb
            dist/release/checksums/assets/butler-app-*-linux-x64.deb.sha256
            dist/release/checksums/assets/butler-app-*-linux-arm64.deb
            dist/release/checksums/assets/butler-app-*-linux-arm64.deb.sha256
            dist/release/checksums/assets/butler-app-*-archlinux-x64.pkg.tar.zst
            dist/release/checksums/assets/butler-app-*-archlinux-x64.pkg.tar.zst.sha256
          )
          test "${#files[@]}" -gt 0
          checksum_file="dist/release/checksums/butler-${version}-SHA256SUMS"
          (
            cd dist/release/checksums/assets
            for file in "${files[@]}"; do
              sha256sum "$(basename "$file")"
            done
          ) > "$checksum_file"
          gh release upload "$tag" "$checksum_file" --clobber

  # Publish the successful outputs after all platform jobs finish. Only now does
  # /releases/latest (and so install.sh) see it. A tag with a hyphen is a
  # preview and is marked as a prerelease, which /releases/latest skips.
  publish-release:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    needs: release-checksums
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prerelease=false
          case "$GITHUB_REF_NAME" in *-*) prerelease=true ;; esac
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease="$prerelease"

  # After the release is public, so `npx @hexpygames/butler install` works the
  # moment the package is visible. Tag runs only; PRs get the pack dry run in
  # install-smoke.yml.
  npm-publish:
    name: Publish the npm package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: publish-release
    environment: deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          registry-url: https://registry.npmjs.org

      - name: Verify the published Agent release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash deploy/npm/verify-release.sh "$GITHUB_REF_NAME"

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: bash deploy/npm/publish.sh "$GITHUB_REF_NAME"
