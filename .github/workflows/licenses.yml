name: Open source notices
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      workflow: licenses.yml

  licenses:
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && ((needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['licenses']) || (needs.changes.outputs.tier != 'integration' && (needs.changes.outputs.licenses == 'true')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate locked inventory and deterministic notices
        run: python3 .github/scripts/isolated.py node deploy/licenses/generate.mjs --check
      - run: python3 .github/scripts/isolated.py node deploy/licenses/check.mjs
      - run: python3 .github/scripts/isolated.py python3 deploy/licenses/check-disclosure.py

  gate:
    name: licenses gate
    if: always()
    needs: [changes, licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish successful inputs
        if: always() && needs.changes.result == 'success'
        uses: ./.github/actions/ci-input-receipt
        with:
          results: ${{ toJSON(needs) }}
          groups: '{"licenses": ["licenses"]}'
          workflow: licenses.yml
      - name: Require selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          CHECK_GROUPS: '{"licenses": ["licenses"]}'
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/ci-check-selected.py
