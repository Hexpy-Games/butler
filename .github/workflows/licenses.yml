name: Open source notices
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  gate:
    name: licenses gate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/changes
        id: paths
        with:
          workflow: licenses.yml
      - uses: actions/setup-node@v4
        if: fromJSON(steps.paths.outputs.jobs)['licenses']
        with:
          node-version: 24
      - name: Validate locked inventory, notices and disclosure
        id: licenses
        if: fromJSON(steps.paths.outputs.jobs)['licenses']
        run: |
          python3 .github/scripts/isolated.py node deploy/licenses/generate.mjs --check
          python3 .github/scripts/isolated.py node deploy/licenses/check.mjs
          python3 .github/scripts/isolated.py python3 deploy/licenses/check-disclosure.py
      # Preserve the existing receipt schema and fail-closed gate contract using
      # step outcomes now that selection and validation share this required job.
      - name: Publish successful inputs
        if: always() && steps.paths.outcome == 'success'
        uses: ./.github/actions/ci-input-receipt
        with:
          results: >-
            {"changes":{"result":"${{ steps.paths.outcome }}","outputs":${{ toJSON(steps.paths.outputs) }}},
            "licenses":{"result":"${{ steps.licenses.outcome }}"}}
          groups: '{"licenses": ["licenses"]}'
          workflow: licenses.yml
      - name: Require selected checks
        if: always() && steps.paths.outcome == 'success'
        env:
          RESULTS: >-
            {"changes":{"result":"${{ steps.paths.outcome }}","outputs":${{ toJSON(steps.paths.outputs) }}},
            "licenses":{"result":"${{ steps.licenses.outcome }}"}}
          CHECK_GROUPS: '{"licenses": "jobs"}'
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/ci-check-selected.py
