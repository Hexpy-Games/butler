name: Install smoke

# The CLI install path end to end, without a published release: build the
# standalone Agent archive on each native runner, serve it locally, install it
# with deploy/install.sh, run the agent headless (version, start, authenticated /health, stop) and install
# again. Nothing is published.

on:
  workflow_call:
    inputs:
      label:
        type: string
        default: all
      platforms:
        type: string
        default: '[{"platform":"linux-x64","runner":"ubuntu-24.04"},{"platform":"linux-arm64","runner":"ubuntu-24.04-arm"},{"platform":"darwin-arm64","runner":"macos-15"}]'
      merge-manifests:
        type: boolean
        default: true
      lint:
        description: Lint the install scripts (once per run)
        type: boolean
        default: true
      shared-agents:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: install-smoke-${{ inputs.label || 'all' }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: ${{ toJSON(inputs.lint) != 'false' }}
    name: Lint and test the install scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint the shell scripts
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" shellcheck -s sh deploy/install.sh deploy/install-smoke.sh

      - name: Test and lint release admission
        run: |
          HOME="$(mktemp -d)"
          BUTLER_DATA="$(mktemp -d)"
          export HOME BUTLER_DATA
          trap 'rm -rf "$HOME" "$BUTLER_DATA"' EXIT
          shellcheck deploy/verify-release.sh deploy/verify-release.test.sh
          bash deploy/verify-release.test.sh

  smoke:
    name: Install smoke (${{ matrix.platform }})
    needs: lint
    if: ${{ !cancelled() && (needs.lint.result == 'success' || (toJSON(inputs.lint) == 'false' && needs.lint.result == 'skipped')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms || '[{"platform":"linux-x64","runner":"ubuntu-24.04"},{"platform":"linux-arm64","runner":"ubuntu-24.04-arm"},{"platform":"darwin-arm64","runner":"macos-15"}]') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build, package and smoke the Agent archive
        uses: ./.github/actions/build-agent-archive
        with:
          cache-key: package-${{ matrix.platform }}
          agent-artifact: ${{ inputs.shared-agents && format('agent-payload-{0}', matrix.platform) || '' }}
          ort-mode: ${{ (matrix.platform == 'darwin-arm64' && inputs.shared-agents) && 'static-ort' || 'prebuilt-ort' }}
          artifact-base-url: https://github.com/${{ github.repository }}/releases/download/v0.0.0-ci

      - name: Install, run headless, reinstall
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" sh deploy/install-smoke.sh dist/release/agent

      - name: Keep the archive and manifests for the merge check
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.platform }}
          path: |
            dist/release/agent/agent-release-manifest.json
            dist/release/agent/agent-update-manifest.json
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/heads/release/') && 30 || 1 }}

  # The release workflow merges the per-platform manifests on a tag; check it here.
  merge-manifests:
    if: inputs.merge-manifests != false
    needs: smoke
    uses: ./.github/workflows/merge-agent-manifests.yml
