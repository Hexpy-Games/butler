name: Unsigned Windows preview smoke

on:
  pull_request:
    paths:
      - .github/workflows/windows-preview-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh
    working-directory: packages/butler-agent/rust

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: short
      BUTLER_E2E_TIER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: prebuilt-ort
          cache-key: windows-preview-release
      - name: Isolate runtime and check directories
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-preview'
          New-Item -ItemType Directory -Force "$root/logs" | Out-Null
          # Keep toolchain/cache locations while every check gets a fresh HOME.
          "CARGO_HOME=$env:USERPROFILE/.cargo" >> $env:GITHUB_ENV
          "RUSTUP_HOME=$env:USERPROFILE/.rustup" >> $env:GITHUB_ENV
          "PREVIEW_ROOT=$root" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE/target/windows-preview" >> $env:GITHUB_ENV
      - name: Platform and portable crate tests
        id: tests
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          cargo test --locked --target x86_64-pc-windows-msvc -p butler-platform -p butler-core --lib 2>&1 |
            Tee-Object "$env:PREVIEW_ROOT/logs/crate-tests.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned release agent
        id: build
        if: ${{ !cancelled() }}
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          cargo build --locked --release --target x86_64-pc-windows-msvc -p butler-agent --bin butler-agent 2>&1 |
            Tee-Object "$env:PREVIEW_ROOT/logs/build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Version, HTTP readiness, status and stop
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $env:BUTLER_APP_SERVER_HOST = '127.0.0.1'
          $env:BUTLER_APP_SERVER_PORT = '0'
          $env:BUTLER_SERVICE_MANAGER = 'off'
          $env:BUTLER_SECRET_STORE = 'file'
          $env:BUTLER_PROVIDER_QUOTA_POLLING = '0'
          $binary = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/butler-agent.exe"
          $resources = "$env:GITHUB_WORKSPACE/packages/butler-agent/resources"
          & $binary --version 2>&1 | Tee-Object "$env:PREVIEW_ROOT/logs/version.log"
          if ($LASTEXITCODE -ne 0) { throw 'Version failed' }
          $agent = Start-Process $binary -ArgumentList @('--resource-root',"`"$resources`"") -PassThru `
            -RedirectStandardOutput "$env:PREVIEW_ROOT/logs/agent.stdout.log" `
            -RedirectStandardError "$env:PREVIEW_ROOT/logs/agent.stderr.log"
          try {
            $ready = $false
            $deadline = [datetime]::UtcNow.AddSeconds(90)
            while ([datetime]::UtcNow -lt $deadline) {
              if ($agent.HasExited) { throw "Agent exited: $($agent.ExitCode)" }
              $recordPath = "$env:BUTLER_DATA/state/butler-agent-native-service.json"
              $authPath = "$env:BUTLER_DATA/app/runtime/auth/local-agent-auth.json"
              if ((Test-Path $recordPath) -and (Test-Path $authPath)) {
                try {
                  $record = Get-Content $recordPath -Raw | ConvertFrom-Json
                  $auth = Get-Content $authPath -Raw | ConvertFrom-Json
                  $health = Invoke-RestMethod "$($record.app_endpoint)/health" `
                    -Headers @{Authorization="Bearer $($auth.token)"} -TimeoutSec 2
                  $ready = $health.protocol_version -eq 'butler.app.v1' -and $health.data.ok -eq $true
                  if ($ready) { break }
                } catch { $ready = $false }
              }
              Start-Sleep -Milliseconds 100
            }
            if (!$ready) { throw 'HTTP readiness did not succeed within 90 seconds' }
            'PASS authenticated HTTP /health: butler.app.v1, data.ok=true' |
              Tee-Object "$env:PREVIEW_ROOT/logs/readiness.log"
            & $binary status --json 2>&1 | Tee-Object "$env:PREVIEW_ROOT/logs/status.log"
            if ($LASTEXITCODE -ne 0) { throw 'Status failed' }
            & $binary stop --json 2>&1 | Tee-Object "$env:PREVIEW_ROOT/logs/stop.log"
            if ($LASTEXITCODE -ne 0) { throw 'Stop failed' }
            if (!$agent.WaitForExit(30000)) { throw 'Agent did not stop within 30 seconds' }
            if ($agent.ExitCode -ne 0) { throw "Stop exit: $($agent.ExitCode)" }
          } finally {
            # Only the process this step started; never terminate by name.
            if (!$agent.HasExited) { Stop-Process -Id $agent.Id -Force }
          }
      - name: Existing stub chat and CLI E2E
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $env:BUTLER_E2E_BIN = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release/butler-agent.exe"
          cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test turn `
            turn_01_reply_is_delivered_persisted_and_survives_restart -- --exact --nocapture 2>&1 |
            Tee-Object "$env:PREVIEW_ROOT/logs/stub-chat.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test cli_surface -- --nocapture 2>&1 |
            Tee-Object "$env:PREVIEW_ROOT/logs/cli-surface.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload diagnostic logs (no credentials or data directories)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-preview-logs
          path: ${{ runner.temp }}/windows-preview/logs/*.log
          if-no-files-found: warn
          retention-days: 14
