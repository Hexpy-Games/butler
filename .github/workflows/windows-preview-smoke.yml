name: Unsigned Windows preview smoke
on:
  # Native owner-PC coverage runs on main/release, ci:windows-native PRs or
  # branch dispatch. Other PRs that change Windows agent crates or Windows
  # inputs (ci-changes.py selects) run the hosted shards on a hosted build.
  # gh workflow run windows-preview-smoke.yml --ref <head-branch>
  push:
    branches: [main, 'release/**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      native-cache:
        description: Task Cargo cache namespace on the native Windows build host
        required: false
        type: string
      native-loop:
        description: Run the self-hosted native checks before hosted final confirmation
        required: false
        type: boolean
        default: false
      diagnose-powershell:
        description: Run isolated startup diagnostics instead of build/test jobs
        required: false
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{0}"
    working-directory: packages/butler-agent/rust
concurrency:
  group: windows-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/release/') }}
jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml
    with:
      workflow: windows-preview-smoke.yml
  build:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    name: Build unsigned Windows preview
    if: always() && !cancelled() && needs.changes.result == 'success' && ((needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['build']) || (needs.changes.outputs.tier != 'integration' && fromJSON(needs.changes.outputs.jobs)['build'] && !inputs.native-loop && !inputs.diagnose-powershell && github.event_name != 'pull_request'))
    runs-on: [self-hosted, butler-win, butler-win-release]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-preview-build
        with:
          native-cache: ${{ inputs.native-cache || 'windows-agent-v1' }}

  stub:
    permissions:
      contents: read
      actions: read
      packages: write
    needs: changes
    name: Platform contracts and debug stub chat
    if: always() && !cancelled() && needs.changes.result == 'success' && ((needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['stub']) || (needs.changes.outputs.tier != 'integration' && (fromJSON(needs.changes.outputs.jobs)['stub'] && !inputs.diagnose-powershell && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository))))
    runs-on: [self-hosted, butler-win, "${{ (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/')) && 'butler-win-release' || 'butler-win-shared' }}"]
    timeout-minutes: 90
    env:
      BUTLER_E2E_TIER: stub
      BUTLER_DEBUG_COMMAND_TIMINGS: "1"
      RUST_TEST_THREADS: 8
      RUSTFLAGS: -C target-feature=+crt-static
      BUTLER_MEMORY_IMPLEMENTATION_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-runner-setup
        with:
          workflow: ${{ inputs.native-cache || 'windows-agent-v1' }}
      - name: Windows native stderr and clippy
        env:
          GH_TOKEN: ${{ github.token }}
        run: ../../../deploy/windows-preview-quality.ps1
      - name: Diagnose original ACL writer and checker
        run: ../../../deploy/windows-acl-diagnosis.ps1
      - name: Platform and portable crate tests
        id: tests
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $ErrorActionPreference = 'Continue'
          cmd /d /c "cargo test --locked --target x86_64-pc-windows-msvc -p butler-platform -p butler-core -p butler-models > `"$env:PREVIEW_ROOT/logs/crate-tests.log`" 2>&1"
          $testCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($testCode -ne 0) {
            & "$env:GITHUB_WORKSPACE/deploy/windows-test-log.ps1" -Log "$env:PREVIEW_ROOT/logs/crate-tests.log"
            exit $testCode
          }
      - name: Keep ACL and contract evidence before the full build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-contract-logs
          path: |
            ${{ env.PREVIEW_ROOT }}/logs/acl*.log
            ${{ env.PREVIEW_ROOT }}/logs/crate-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Compile existing Windows E2E harness
        id: harness
        if: ${{ !cancelled() }}
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $ErrorActionPreference = 'Continue'
          cmd /d /c "cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e --no-run --message-format=json > `"$env:PREVIEW_ROOT/logs/harness-compile.log`" 2>&1"
          $testCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($testCode -ne 0) {
            & "$env:GITHUB_WORKSPACE/deploy/windows-test-log.ps1" -Log "$env:PREVIEW_ROOT/logs/harness-compile.log"
            exit $testCode
          }
      - name: Build debug agent for the stub harness
        id: build
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-windows-debug-agent
      - name: Upload Cargo build timings
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-windows-preview-smoke-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.CARGO_TARGET_DIR || 'packages/butler-agent/rust/target' }}/cargo-timings/*.html
          if-no-files-found: error
          retention-days: 14
      - name: Existing stub chat E2E
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $env:BUTLER_E2E_BIN = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/butler-agent.exe"
          $ErrorActionPreference = 'Continue'
          cmd /d /c "cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e turn::turn_01_reply_is_delivered_persisted_and_survives_restart -- --exact --test-threads=8 --nocapture > `"$env:PREVIEW_ROOT/logs/stub-chat.log`" 2>&1"
          $testCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($testCode -ne 0) {
            & "$env:GITHUB_WORKSPACE/deploy/windows-test-log.ps1" -Log "$env:PREVIEW_ROOT/logs/stub-chat.log"
            exit $testCode
          }
      - name: Dedicated OAuth profile and existing OAuth regressions (stub/replay)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: |
          $env:BUTLER_E2E_BIN = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/butler-agent.exe"
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e setup_oauth:: -- --test-threads=1
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ErrorActionPreference = 'Continue'
          python "$env:GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e quota:: -- --test-threads=1
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Terminal settlement without filesystem notifications
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $env:BUTLER_E2E_BIN = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/butler-agent.exe"
          $ErrorActionPreference = 'Continue'
          cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e projection_settlement:: `
            -- --test-threads=1 --nocapture
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stub chat and durable config under a long data path
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $env:BUTLER_E2E_BIN = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/butler-agent.exe"
          $ErrorActionPreference = 'Continue'
          cmd /d /c "cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e long_paths:: -- --test-threads=8 --nocapture > `"$env:PREVIEW_ROOT/logs/long-paths.log`" 2>&1"
          $testCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($testCode -ne 0) {
            & "$env:GITHUB_WORKSPACE/deploy/windows-test-log.ps1" -Log "$env:PREVIEW_ROOT/logs/long-paths.log"
            exit $testCode
          }
      - name: Native Windows command regression matrix
        run: ../../../deploy/windows-command-matrix.ps1
      - name: Selected project workspace and approval E2E
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $env:BUTLER_E2E_BIN = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/butler-agent.exe"
          $ErrorActionPreference = 'Continue'
          cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e project_workspace:: -- --test-threads=8 --nocapture
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Read-only real-profile Downloads command
        if: ${{ inputs.native-loop && !cancelled() && steps.build.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $env:BUTLER_E2E_BIN = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/butler-agent.exe"
          # Only the Agent's observation HOME/USERPROFILE is real. Its data,
          # XDG dirs, local/roaming profiles and fixtures stay temporary.
          $env:BUTLER_E2E_DOWNLOADS_REAL_PROFILE = $env:USERPROFILE
          $env:BUTLER_E2E_PERF = '1'
          try {
            $ErrorActionPreference = 'Continue'
            cmd /d /c "cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e windows_commands::profile_observation::profile_downloads_with_external_data_in_both_access_modes -- --exact --test-threads=1 --nocapture > `"$env:PREVIEW_ROOT/logs/real-profile.log`" 2>&1"
            $testCode = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($testCode -ne 0) {
              & "$env:GITHUB_WORKSPACE/deploy/windows-test-log.ps1" -Log "$env:PREVIEW_ROOT/logs/real-profile.log"
              exit $testCode
            }
          } finally { Remove-Item Env:BUTLER_E2E_DOWNLOADS_REAL_PROFILE,Env:BUTLER_E2E_PERF }
      - name: Prepare verified embedding assets for native memory qualification
        if: ${{ inputs.native-loop && !cancelled() && steps.build.outcome == 'success' && steps.harness.outcome == 'success' }}
        working-directory: .
        run: |
          $ErrorActionPreference = 'Continue'
          python .github/scripts/isolated.py python .github/scripts/prepare-native-embedding.py
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native service recovery, full shutdown queue and memory reset
        if: ${{ inputs.native-loop && !cancelled() && steps.build.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: |
          foreach ($test in @('service_supervision', 'queue_shutdown', 'service_diagnostics', 'memory_reset', 'memory_profile_reset', 'paired-idle', 'artifact-history', 'unicode_delivery', 'delegate_followup', 'steward_presentation', 'ask_user', 'memory-rules-cursor', 'context_telemetry', 'project-instruction-reset', 'storage_concurrency', 'memory-rules-crash', 'memory-rules-correction', 'memory-rules-forget', 'memory-recall-judge')) {
            $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
            $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
            New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
            $env:BUTLER_E2E_BIN = "$env:CARGO_TARGET_DIR/x86_64-pc-windows-msvc/debug/butler-agent.exe"
            $filter = switch ($test) {
              'paired-idle' { 'gateway_pairing::support::idle::paired_devices_have_zero_idle_writes_and_request_driven_last_seen' }
              'artifact-history' { 'project_artifacts::paging::perf_many_matches_page_completely' }
              'memory-rules-cursor' { 'memory_wiring_more::cursor::' }
              'project-instruction-reset' { 'memory_wiring_more::duration::project_reset_includes_temporary_instructions_and_keeps_other_scopes' }
              'memory-rules-crash' { 'memory_wiring_more::crash::' }
              'memory-rules-correction' { 'memory_wiring_more::wiring_more_correction_supersedes_previous_rule_in_next_prompt' }
              'memory-rules-forget' { 'memory_wiring_more::forget::rules_forget_and_correction_preserve_other_bindings_after_restart' }
              'memory-recall-judge' { 'memory::recall_judge::' }
              default { "$test`::" }
            }
            $ErrorActionPreference = 'Continue'
            cmd /d /c "cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e `"$filter`" -- --test-threads=8 --nocapture > `"$env:PREVIEW_ROOT/logs/$test.log`" 2>&1"
            $testCode = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($testCode -ne 0) {
              & "$env:GITHUB_WORKSPACE/deploy/windows-test-log.ps1" -Log "$env:PREVIEW_ROOT/logs/$test.log"
              exit $testCode
            }
          }
      # Native failures stay fatal, but must not hide independent hosted evidence.
      - name: Export compiled verification harnesses
        id: export-harnesses
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.harness.outcome == 'success' }}
        run: |
          ../../../deploy/windows-e2e-artifacts.ps1 -Mode Export
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.export-harnesses.outcome == 'success' }}
        with:
          name: windows-e2e
          path: ${{ env.PREVIEW_ROOT }}/artifacts
          if-no-files-found: error
      - name: Preserve failed native fixtures before isolated cleanup
        if: always()
        run: |
          $failures = Join-Path ([System.IO.Path]::GetTempPath()) 'butler-e2e/failures'
          if (Test-Path $failures) {
            . "$env:GITHUB_WORKSPACE/deploy/windows-job-tree.ps1"; Copy-JobTree $failures "$env:PREVIEW_ROOT/logs/failures"
          }
      - name: Preserve native regression evidence before isolated cleanup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-regression-logs
          path: ${{ env.PREVIEW_ROOT }}/logs
          if-no-files-found: warn
          retention-days: 14
      - uses: ./.github/actions/publish-windows-target
        continue-on-error: true
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        with:
          profile: debug
      - name: Check runner registration and remove job profile
        if: always()
        working-directory: .
        run: ./deploy/windows-self-hosted-cleanup.ps1
  hosted-build:
    permissions:
      contents: read
      actions: read
    needs: changes
    name: Build Windows E2E harness (hosted)
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.tier != 'integration' && fromJSON(needs.changes.outputs.jobs)['hosted-build'] && !inputs.native-loop && !inputs.diagnose-powershell
    runs-on: windows-latest
    timeout-minutes: 90
    # Downloaded prebuilt ORT objects import the dynamic CRT (/MD); the static
    # CRT flag belongs to the owner PC's static-ort build and fails to link here.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-agent-setup
        with:
          native-deps: prebuilt-ort
          cache-key: windows-e2e-hosted
          save-cargo-cache: 'false'
      - name: Isolate the harness build
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-build'
          New-Item -ItemType Directory -Force "$root/logs" | Out-Null
          "PREVIEW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE/packages/butler-agent/rust/target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile existing Windows E2E harness on a hosted runner
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $ErrorActionPreference = 'Continue'
          cmd /d /c "cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test e2e --no-run --message-format=json > `"$env:PREVIEW_ROOT/logs/harness-compile.log`" 2>&1"
          $testCode = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($testCode -ne 0) {
            & "$env:GITHUB_WORKSPACE/deploy/windows-test-log.ps1" -Log "$env:PREVIEW_ROOT/logs/harness-compile.log"
            exit $testCode
          }
      - name: Vault scenarios on Windows
        env:
          BUTLER_E2E_TIER: stub
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $ErrorActionPreference = 'Continue'
          cargo test --locked --target x86_64-pc-windows-msvc -p butler-e2e --test vault
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build debug agent for the harness
        run: |
          $env:HOME = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:PREVIEW_ROOT ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          $ErrorActionPreference = 'Continue'
          cargo build --locked --features butler-agent/e2e-fixtures,butler-platform/test-support --target x86_64-pc-windows-msvc -p butler-agent --bin butler-agent -p butler-platform --bin butler-sandbox
          $ErrorActionPreference = 'Stop'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Export compiled verification harnesses
        run: ../../../deploy/windows-e2e-artifacts.ps1 -Mode Export
      - uses: actions/upload-artifact@v4
        with:
          name: windows-e2e
          path: ${{ env.PREVIEW_ROOT }}/artifacts
          if-no-files-found: error
      - name: Keep harness build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-hosted-build-logs
          path: ${{ env.PREVIEW_ROOT }}/logs
          if-no-files-found: warn
          retention-days: 1
  release:
    name: Installed unsigned Windows preview
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && contains(fromJSON(needs.changes.outputs.artifacts).*.name, 'agent-windows-x64'))) && (needs.stub.result == 'success' || (needs.stub.result == 'skipped' && contains(fromJSON(needs.changes.outputs.artifacts).*.name, 'windows-e2e'))) && ((needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['release']) || (needs.changes.outputs.tier != 'integration' && fromJSON(needs.changes.outputs.jobs)['release'] && !inputs.native-loop && github.event_name != 'pull_request'))
    needs: [changes, build, stub]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BUTLER_E2E_TIER: stub
      BUTLER_DEBUG_COMMAND_TIMINGS: "1"
    steps:
      - name: Enable short names on the hosted temp volume
        # Fresh hosted VM only (never self-hosted): command folders need 8.3 names,
        # which this volume ships without. Runs before the job creates its directories.
        working-directory: ${{ runner.temp }}
        run: |
          $volume = Split-Path -Qualifier $env:RUNNER_TEMP
          fsutil 8dot3name set $volume 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agent-windows-x64
          path: dist/release/agent
      - uses: actions/download-artifact@v4
        with:
          name: windows-e2e
          path: ${{ runner.temp }}/windows-verify/artifacts
      - name: Isolate verification profile
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-verify'
          New-Item -ItemType Directory -Force "$root/logs" | Out-Null
          "PREVIEW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUTLER_E2E_WORKSPACE_ROOT=$env:GITHUB_WORKSPACE/packages/butler-agent/rust" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install ZIP, authenticate browser UI and exercise lifecycle
        working-directory: .
        run: ./deploy/windows-preview-smoke.ps1
      - uses: ./.github/actions/bun-setup
      - name: Install smoke dependencies and Chromium
        working-directory: .
        run: |
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          $env:HOME = Join-Path $profile 'home'
          $env:BUTLER_DATA = Join-Path $profile 'data'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'playwright-browsers'
          New-Item -ItemType Directory -Force $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            $ErrorActionPreference = 'Continue'
            bun install --frozen-lockfile --ignore-scripts
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($code -ne 0) { throw "Dependency installation failed: $code" }
            $ErrorActionPreference = 'Continue'
            bun x playwright install chromium
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($code -ne 0) { throw "Chromium installation failed: $code" }
          } finally { Remove-Item $profile -Recurse -Force }
      - name: Installed agent composer permission smoke
        working-directory: .
        run: |
          $agentRoot = $env:BUTLER_E2E_INSTALLED_ROOT
          if (!$agentRoot -or !(Test-Path "$agentRoot/butler-agent.exe" -PathType Leaf) -or
              !(Test-Path "$agentRoot/resources" -PathType Container)) {
            throw 'Installed agent executable and resources are required'
          }
          $profile = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          $env:HOME = Join-Path $profile 'home'
          $env:BUTLER_DATA = Join-Path $profile 'data'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:RUNNER_TEMP 'playwright-browsers'
          $env:BUTLER_APP_DISABLE_SHELL_REGISTRATION = '1'
          $env:BUTLER_PERMISSION_SCREENSHOTS = Join-Path $env:PREVIEW_ROOT 'logs/composer-permission'
          New-Item -ItemType Directory -Force $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            $ErrorActionPreference = 'Continue'
            bun tests/smoke/composer-permission-agent-smoke.ts "$agentRoot"
            $code = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($code -ne 0) { throw "Composer permission smoke failed: $code" }
          } finally { Remove-Item $profile -Recurse -Force }
      - name: Pure Task Scheduler XML from compiled harness
        run: ../../../deploy/windows-e2e-artifacts.ps1 -Mode Run -Tests windows_startup_xml
      - name: Installed release stub chat
        run: ../../../deploy/windows-installed-e2e.ps1 -Tests installed_preview
      - name: Installed release native command regression matrix
        if: ${{ !cancelled() }}
        run: ../../../deploy/windows-installed-e2e.ps1 -Tests windows_commands
      - name: Hosted terminal settlement live-event regression
        if: ${{ !cancelled() }}
        run: |
          $env:BUTLER_E2E_BIN = "$env:PREVIEW_ROOT/artifacts/butler-agent.exe"
          ../../../deploy/windows-e2e-artifacts.ps1 -Mode Run -Tests projection_settlement
      - name: Require installed verification harnesses
        if: ${{ !cancelled() }}
        run: |
          $expected = @('windows_startup_xml','installed_preview','windows_commands','projection_settlement')
          $actual = @(Get-Content "$env:PREVIEW_ROOT/logs/completed-harnesses.txt")
          if ($actual.Count -ne $expected.Count -or (Compare-Object $expected $actual)) {
            throw "Incomplete verification: completed=$($actual -join ',')"
          }
          "Verified installed harnesses: $($actual -join ',')"
      - name: Task Scheduler installed artifact E2E (disposable runner only)
        working-directory: .
        run: |
          $root = $env:WINDOWS_PREVIEW_TEMP_ROOT
          $env:HOME = "$root/home/미리 보기 %USERPROFILE% !"
          $env:LOCALAPPDATA = "$root/local/미리 보기 %USERPROFILE% !"
          $env:APPDATA = "$root/roaming"
          $env:BUTLER_DATA = "$root/data/미리 보기 %USERPROFILE% !"
          $env:BUTLER_APP_SERVER_HOST = '127.0.0.1'
          $env:BUTLER_APP_SERVER_PORT = '0'
          $env:BUTLER_SECRET_STORE = 'file'
          ./deploy/windows-startup-smoke.ps1 -Launcher "$env:LOCALAPPDATA/Butler/bin/butler.exe"
      - name: Preserve failed hosted harness fixtures
        if: failure()
        run: |
          $failures = Join-Path ([System.IO.Path]::GetTempPath()) 'butler-e2e/failures'
          if (Test-Path $failures) {
            Copy-Item $failures "$env:PREVIEW_ROOT/logs/failures" -Recurse
          }
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-stub-logs
          path: ${{ runner.temp }}/windows-verify/logs/
          retention-days: 1
      - name: Keep installed harness completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-completed-installed
          path: ${{ runner.temp }}/windows-verify/logs/completed-harnesses.txt
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/heads/release/') && 30 || 1 }}
      - name: Remove temporary verification profiles
        if: always()
        run: |
          if ($env:WINDOWS_PREVIEW_TEMP_ROOT -and (Test-Path $env:WINDOWS_PREVIEW_TEMP_ROOT)) {
            Remove-Item $env:WINDOWS_PREVIEW_TEMP_ROOT -Recurse -Force
          }
          Remove-Item $env:PREVIEW_ROOT -Recurse -Force
  hosted:
    name: Hosted Windows E2E (${{ matrix.shard }})
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.stub.result == 'success' || needs.hosted-build.result == 'success' || (needs.stub.result == 'skipped' && contains(fromJSON(needs.changes.outputs.artifacts).*.name, 'windows-e2e'))) && ((needs.changes.outputs.tier == 'integration' && fromJSON(needs.changes.outputs.jobs)['hosted']) || (needs.changes.outputs.tier != 'integration' && fromJSON(needs.changes.outputs.jobs)['hosted'] && !inputs.native-loop))
    needs: [changes, stub, hosted-build]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BUTLER_E2E_TIER: stub
      BUTLER_DEBUG_COMMAND_TIMINGS: ${{ matrix.shard == 'basics' && '1' || '' }}
      RUST_TEST_THREADS: 8
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.parts).hosted }}
    steps:
      - name: Enable short names on the hosted temp volume
        # Fresh hosted VM only (never self-hosted): command folders need 8.3 names,
        # which this volume ships without. Runs before the job creates its directories.
        working-directory: ${{ runner.temp }}
        run: |
          $volume = Split-Path -Qualifier $env:RUNNER_TEMP
          fsutil 8dot3name set $volume 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-e2e
          path: ${{ runner.temp }}/windows-verify/artifacts
      - name: Isolate the existing compiled harnesses
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-verify'
          New-Item -ItemType Directory -Force "$root/logs" | Out-Null
          "PREVIEW_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUTLER_E2E_WORKSPACE_ROOT=$env:GITHUB_WORKSPACE/packages/butler-agent/rust" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BUTLER_E2E_BIN=$root/artifacts/butler-agent.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run every existing selected harness
        env:
          SELECTED_HARNESSES: ${{ matrix.tests }}
          BUTLER_E2E_REQUIRE_LAN: ${{ matrix.shard == 'remote' && '1' || '' }}
        run: |
          ../../../deploy/windows-e2e-artifacts.ps1 -Mode Run -Tests $env:SELECTED_HARNESSES.Split(',')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep harness completion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-completed-${{ matrix.shard }}
          path: ${{ runner.temp }}/windows-verify/logs/completed-harnesses.txt
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/heads/release/') && 30 || 1 }}
      - name: Preserve hosted failure fixtures
        if: failure()
        run: |
          $fixtures = Join-Path ([System.IO.Path]::GetTempPath()) 'butler-e2e'
          if (Test-Path $fixtures) {
            Copy-Item $fixtures "$env:PREVIEW_ROOT/logs/failures" -Recurse
          }
      - name: Keep diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-${{ matrix.shard }}-logs
          path: ${{ runner.temp }}/windows-verify/logs/
          retention-days: 1
      - name: Remove temporary verification profiles
        if: always()
        run: Remove-Item $env:PREVIEW_ROOT -Recurse -Force
  gate:
    name: Complete Windows preview verification
    if: ${{ always() && !inputs.native-loop && !inputs.diagnose-powershell && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [changes, build, stub, hosted-build, release, hosted]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Require selected preview checks
        env:
          RESULTS: ${{ toJSON(needs) }}
          CHECK_GROUPS: '{"build":"jobs","stub":"jobs","hosted-build":"jobs","release":"jobs","hosted":"jobs"}'
        run: python3 .github/scripts/isolated.py python3 .github/scripts/ci-check-selected.py
      - uses: ./.github/actions/windows-preview-gate
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        with:
          results: ${{ toJSON(needs) }}
      - name: Publish successful inputs
        if: always() && needs.changes.result == 'success'
        uses: ./.github/actions/ci-input-receipt
        with:
          results: ${{ toJSON(needs) }}
          groups: '{"package": ["build", "stub", "release", "hosted"]}'
          workflow: windows-preview-smoke.yml
  diagnostics:
    if: inputs.diagnose-powershell
    uses: ./.github/workflows/windows-powershell-diagnostics.yml
    with:
      native-cache: ${{ inputs.native-cache }}
