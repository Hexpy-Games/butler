name: Butler Site

# The repository's one GitHub Pages site, https://butler.hexpy.games:
#   /       redirects to /help/ until the intro page exists
#   /help/  the user manual (packages/butler-site; old /docs/ URLs redirect here)
#   /ds/    the DS Viewer (client/ui `build:ds-site:ds`, DS_SITE_BASE=/ds/; see ds-site/README.md)
# plus one 404.html that forwards /ds/<path> links to the viewer (ds-404-redirect.js) and shows the
# manual's 404 otherwise. The custom domain is the SITE_DOMAIN repository variable (default
# butler.hexpy.games); it becomes dist/CNAME and must match Settings → Pages → Custom domain.
# Triggers cover every input of both builds (the whole client/ui package feeds the DS build).
# Pull requests only check and build; pushes to main (and manual runs) also deploy.
on:
  push:
    branches: [main]
    paths:
      - "packages/butler-site/**"
      - "packages/butler-app/client/ui/**"
      - "tests/smoke/ds-site-*.ts"
      - "LICENSE"
      - "VERSION"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "packages/butler-site/**"
      - "packages/butler-app/client/ui/**"
      - "tests/smoke/ds-site-*.ts"
      - "LICENSE"
      - "VERSION"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Check and build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'butler.hexpy.games' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/butler-app/client/ui/package-lock.json

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts

      - name: Check the manual
        run: bun run site:check

      - name: Build /, /help/ and /ds/
        run: bun run site:build

      - name: Leak check (/ds/)
        run: bun run tests/smoke/ds-site-leak-check.ts packages/butler-site/dist/ds

      - name: Font assets (/ds/)
        env:
          DS_SITE_BASE: /ds/
        run: bun run tests/smoke/font-assets-check.ts packages/butler-site/dist/ds

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/butler-site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
