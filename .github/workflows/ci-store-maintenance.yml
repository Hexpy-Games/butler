name: Remove migrated CI releases
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ci-store-maintenance
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.3
      - name: Verify all public SDKs before deleting any release or tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/migrate-ci-releases.py
