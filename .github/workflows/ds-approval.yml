name: DS approval

# DS changes without owner approval fail the rust-quality gate.
# rust-quality calls this on every pull_request event, including label changes.
# See .github/scripts/ds-approval.py.

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  ds-approval:
    name: ds-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Require owner approval for DS primitive, block and token changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 .github/scripts/isolated.py python3 .github/scripts/ds-approval.py --pr "$PR_NUMBER"
