name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
# pull_request_target runs with write access: never check out or run pull request code here.
permissions:
  actions: write
  contents: write
  pull-requests: write
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  cla:
    name: cla
    if: >-
      (github.event_name == 'pull_request_target' &&
       (github.event.action != 'closed' || github.event.pull_request.merged)) ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    runs-on: ubuntu-latest
    env:
      SIGNATURE_BRANCH: cla-signatures
      SIGNATURE_FILE: signatures/v1/cla.json
    steps:
      # Signatures live on an orphan branch that holds only the signature file.
      - name: Create the signature branch on first use
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="repos/$GITHUB_REPOSITORY"
          if gh api "$repo/branches/$SIGNATURE_BRANCH" --silent 2>/dev/null; then exit 0; fi
          blob=$(jq -n '{content: "{\"signedContributors\": []}\n", encoding: "utf-8"}' |
            gh api "$repo/git/blobs" --input - --jq .sha)
          tree=$(jq -n --arg path "$SIGNATURE_FILE" --arg sha "$blob" \
            '{tree: [{path: $path, mode: "100644", type: "blob", sha: $sha}]}' |
            gh api "$repo/git/trees" --input - --jq .sha)
          commit=$(jq -n --arg tree "$tree" '{message: "Create the CLA signature store", tree: $tree, parents: []}' |
            gh api "$repo/git/commits" --input - --jq .sha)
          gh api "$repo/git/refs" -f ref="refs/heads/$SIGNATURE_BRANCH" -f sha="$commit" --silent ||
            gh api "$repo/branches/$SIGNATURE_BRANCH" --silent
      - name: Check CLA signatures
        # contributor-assistant/github-action v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA-v1.md
          path-to-signatures: ${{ env.SIGNATURE_FILE }}
          branch: ${{ env.SIGNATURE_BRANCH }}
          allowlist: byeolbit,dependabot[bot],github-actions[bot]
