name: gpui Windows package

on:
  pull_request:
    paths:
      - packages/butler-shell/**
      - packages/butler-app/scripts/windows/package-gpui-release.ts
      - packages/butler-app/scripts/windows/release-outputs.ts
      - packages/butler-app/scripts/windows/gpui-update-smoke.ts
      - packages/butler-agent/rust/crates/butler-platform/src/squirrel.rs
      - packages/butler-agent/rust/crates/butler-platform/src/squirrel/**
      - packages/butler-agent/rust/crates/butler-platform/src/app_shell.rs
      - packages/butler-agent/rust/crates/butler-platform/src/login_item/**
      - .github/workflows/gpui-windows-package.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: gpui-windows-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    runs-on: ubuntu-latest
    outputs:
      from: ${{ steps.versions.outputs.from }}
      to: ${{ steps.versions.outputs.to }}
    steps:
      - name: Select the published Electron preview and candidate version
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          pages = json.loads(subprocess.check_output([
              'gh', 'api', '--paginate', '--slurp',
              f"repos/{os.environ['GH_REPO']}/releases?per_page=100"], text=True))
          releases = [r for page in pages for r in page if not r['draft']
                      and re.fullmatch(r'v\d+\.\d+\.\d+-preview\.\d+', r['tag_name'])
                      and any(a['name'] == f"ButlerSetup-{r['tag_name'][1:]}-x64.exe" for a in r['assets'])]
          if not releases:
              raise SystemExit('No published Electron preview with a Windows installer')
          latest = max(releases, key=lambda r: r['published_at'])
          previous = latest['tag_name'][1:]
          prefix, number = previous.rsplit('.', 1)
          candidate = os.environ['REQUESTED_VERSION'] or f'{prefix}.{int(number) + 1}'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'from={previous}\nto={candidate}\n')
          PY

  agent:
    needs: versions
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-windows-agent
        with:
          version: ${{ needs.versions.outputs.to }}
          profile: ci-fast
          cache-key: gpui-package-windows-x64
          artifact-base-url: https://github.com/${{ github.repository }}/releases/download/v${{ needs.versions.outputs.to }}
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-agent-windows-x64
          path: dist/release/agent/*
          if-no-files-found: error

  shell:
    needs: versions
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/butler-shell
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '8'
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/gpui-package
      BUTLER_APP_BUILD_VERSION: ${{ needs.versions.outputs.to }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install workspace toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Use bundled Windows linker
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          sysroot = Path(subprocess.check_output(['rustc', '--print', 'sysroot'], text=True).strip())
          linker = sysroot / 'lib/rustlib/x86_64-pc-windows-msvc/bin/rust-lld.exe'
          subprocess.run([str(linker), '-flavor', 'link', '--version'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER={linker}\n')
          PY
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: |
            packages/butler-shell -> ../../target/gpui-package
            packages/butler-agent/rust -> ../../../target/gpui-package
          key: gpui-package-windows-x64
      - name: Build release shell
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo build --locked --release --bin butler-shell
      - name: Locate CEF cache
        shell: pwsh
        run: '"CEF_PATH=$env:RUNNER_TEMP/cef" >> $env:GITHUB_ENV'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/cef
          key: cef-windows-${{ hashFiles('packages/butler-agent/rust/crates/butler-platform/cef/fetch.py') }}
      - name: Fetch pinned CEF
        working-directory: packages/butler-agent/rust
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" python3 crates/butler-platform/cef/fetch.py --dest "$CEF_PATH"
      - name: Build CEF host
        working-directory: packages/butler-agent/rust
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo build --locked --release -p butler-cef --features cef --target x86_64-pc-windows-msvc
      - name: Stage shell and CEF runtime
        working-directory: packages/butler-agent/rust
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" python3 crates/butler-platform/cef/stage.py \
            --cef "$CEF_PATH" --target "$CARGO_TARGET_DIR/x86_64-pc-windows-msvc/release" --out "$RUNNER_TEMP/gpui-shell/cef-runtime"
          python3 - <<'PY'
          import os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'crates/butler-platform/cef')
          from fetch import VERSION, PINS
          stage = Path(os.environ['RUNNER_TEMP']) / 'gpui-shell'
          cef = Path(os.environ['CEF_PATH']) / VERSION / PINS[('Windows', 'AMD64')]['dir']
          shutil.copy2(cef / 'CREDITS.html', stage / 'cef-runtime/CREDITS.html')
          shutil.copy2(Path(os.environ['CARGO_TARGET_DIR']) / 'release/butler-shell.exe', stage)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-shell-windows-x64
          path: ${{ runner.temp }}/gpui-shell/*
          if-no-files-found: error

  package:
    needs: [versions, agent, shell]
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gpui-agent-windows-x64
          path: dist/release/agent
      - uses: actions/download-artifact@v4
        with:
          name: gpui-shell-windows-x64
          path: dist/release/gpui-shell
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workspace toolchain for shell notices
        shell: bash
        working-directory: packages/butler-shell
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
      - name: Package the gpui App
        shell: pwsh
        env:
          GITHUB_REF_NAME: v${{ needs.versions.outputs.to }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CARGO_HOME = "$env:USERPROFILE/.cargo"
          $env:RUSTUP_HOME = "$env:USERPROFILE/.rustup"
          $packageRoot = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          $env:HOME = Join-Path $packageRoot 'home'
          $env:BUTLER_DATA = Join-Path $packageRoot 'data'
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            bun install --frozen-lockfile --ignore-scripts
            if ($LASTEXITCODE) { throw 'Dependency installation failed' }
            $archives = @(Get-ChildItem dist/release/agent/butler-agent-*-windows-x64.zip)
            if ($archives.Count -ne 1) { throw 'Expected one Windows Agent archive' }
            $expected = (Get-Content ($archives[0].FullName + '.sha256')).Split(' ')[0]
            if ((Get-FileHash $archives[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Agent checksum mismatch' }
            Expand-Archive $archives[0].FullName (Join-Path $packageRoot 'agent')
            $env:BUTLER_NATIVE_AGENT_EXECUTABLE = Join-Path $packageRoot 'agent/butler-agent.exe'
            $env:BUTLER_NATIVE_UI_DIST = Join-Path $packageRoot 'agent/resources/app-client/dist'
            $env:BUTLER_SHELL_EXECUTABLE = (Resolve-Path dist/release/gpui-shell/butler-shell.exe).Path
            $env:BUTLER_CEF_RUNTIME = (Resolve-Path dist/release/gpui-shell/cef-runtime).Path
            bun run packages/butler-app/scripts/windows/package-gpui-release.ts
            if ($LASTEXITCODE) { throw 'gpui Windows packaging failed' }
          } finally { . "$env:GITHUB_WORKSPACE/deploy/windows-job-tree.ps1"; Remove-JobTree $packageRoot }
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-app-windows-x64
          path: dist/release/app-windows-gpui/*
          if-no-files-found: error
      - name: Download the published Electron installer and prove the update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUTLER_WINDOWS_SMOKE_FROM: ${{ needs.versions.outputs.from }}
          BUTLER_WINDOWS_SMOKE_TO: ${{ needs.versions.outputs.to }}
          BUTLER_WINDOWS_INSTALLER_EVIDENCE: ${{ runner.temp }}/gpui-update-logs
        run: |
          $env:HOME = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          $env:BUTLER_DATA = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid())
          New-Item -ItemType Directory $env:HOME,$env:BUTLER_DATA | Out-Null
          try {
            gh release download "v$env:BUTLER_WINDOWS_SMOKE_FROM" -p 'ButlerSetup-*-x64.exe' -D dist/release/electron-from
            if ($LASTEXITCODE) { throw 'Published Electron installer download failed' }
            bun run packages/butler-app/scripts/windows/gpui-update-smoke.ts dist/release/electron-from dist/release/app-windows-gpui
            if ($LASTEXITCODE) { throw 'Electron to gpui update smoke failed' }
          } finally {
            . "$env:GITHUB_WORKSPACE/deploy/windows-job-tree.ps1"
            Remove-JobTree $env:HOME
            Remove-JobTree $env:BUTLER_DATA
          }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gpui-update-smoke-logs
          path: ${{ runner.temp }}/gpui-update-logs
          if-no-files-found: warn
