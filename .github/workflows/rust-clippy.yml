name: Parallel Linux Clippy
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  lint:
    name: Clippy lint (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_SPLIT_DEBUGINFO: 'off'
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: 'off'
    defaults:
      run:
        working-directory: packages/butler-agent/rust
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-agent-setup
        with:
          components: rustfmt, clippy
          native-deps: prebuilt-ort
          cache-key: archive-linux-x64
          artifact-cache-platform: linux-x64
          artifact-cache-kind: dev
          save-cargo-cache: 'false'
      - name: Check formatting
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo fmt --all -- --check
      - name: Check Rust source rules
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo run --locked -p butler-source-check -- .
      # These four libraries allow panic/unwrap/expect and dead-code lints
      # under test-support. --all-targets enables it through dev dependencies;
      # retain their feature-free production check. Other ordinary libraries
      # and binaries are covered by the workspace all-targets invocation.
      - name: Clippy production libraries with stricter cfg lints
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo clippy -p butler-turn -p butler-models -p butler-runtime -p butler-ledger --lib --locked --keep-going -- -D warnings
      # E2E hooks compile only into the fixture agent the harness builds.
      - name: Clippy the E2E fixture agent
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo clippy -p butler-agent --bin butler-agent -p butler-platform --bin butler-sandbox --features butler-platform/test-support,butler-agent/e2e-fixtures --locked --keep-going -- -D warnings
      - name: Clippy all targets
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" cargo clippy --workspace --all-targets --locked --keep-going -- -D warnings
      - name: Check Windows agent crate selection against the Cargo graph
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/isolated.py" python3 "$GITHUB_WORKSPACE/.github/scripts/ci_runtime_crates.py" --check
